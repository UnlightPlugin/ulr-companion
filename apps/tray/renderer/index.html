                <td>${r.playerBName === null ? "<b>等人中</b>" : esc(r.playerBName)}</td>
              </tr>`,
          )
          .join("");

        const list = `<div class="card">
            <div class="row"><span class="dim">這個頻道的房間</span><span>${
              (s.rooms ?? []).length
            } 間，其中 <b>${waiting.length}</b> 間在等人</span></div>
            ${
              rows
                ? `<table><thead><tr><th></th><th>房名</th><th>房主</th><th>對手</th></tr></thead><tbody>${rows}</tbody></table>`
                : `<div class="hint">清單是空的。</div>`
            }
            <div class="row"><span class="dim">進別人的房</span><span>
              <input id="mJoinId" type="text" size="12" placeholder="房號" />
              <input id="mJoinPass" type="text" size="9" placeholder="密碼" />
              <button id="mJoin">進房</button>
            </span></div>
            <div class="hint">⚠ 清單是遊戲推播的，閒置時<b>約 20 秒才更新一次</b> —— 「等人中」可能已經是舊的了。</div>
          </div>`;

        return (
          head("約戰", "跟指定的對手用同一份 COST 規則開一場。") +
          state +
          ruleCard +
          form +
          queueCard +
          handoff +
          err +
          list
        );
      };

      /**
       * 配對狀態 → 一句人話。
       *
       * ⚠ 「配到人了」跟「開房了」要分開講：中間隔著規則驗算，而那一步是
       * 這整個功能的重點 —— 玩家看到「配對成功」卻沒進遊戲時，得知道插件
       * 正在做什麼，否則那看起來就是卡住了。
       */
      function queuePhaseText(p) {
        switch (p.phase) {
          case "idle":
            return "沒在配對";
          case "queued":
            return "排隊中";
          case "checking":
            return "配到人了，正在對規則";
          case "opening":
            return "開房中";
          case "joining":
            return "進房中";
          case "ready":
            return p.role === "host" ? "房開好了，等對手進來" : "已進房";
          case "blocked":
            return "停下來了，要先處理下面那件事";
          default:
            return String(p.phase);
        }
      }

      // --- 牌組 › 隱藏地圖 --------------------------------------------------
      //
      // ⚠ 這一頁跟配對頁一樣，狀態**不在 snapshot 裡** —— 它要跟遊戲要一次
      // （一次 CDP 往返）。開著才輪詢，離開就停。
      let sstate = null;
      let stageTimer = null;
      const onStagePage = () => tab === "deck" && sub === "hidden";

      function startStagePolling() {
        if (stageTimer !== null) return;
        const tick = () =>
          window.ulr.stages.state().then((s) => {
            sstate = s;
            if (!onStagePage()) return;
            const el = document.activeElement;
            if (el && /^(INPUT|SELECT)$/.test(el.tagName) && el.closest("#content")) return;
            renderBody();
          });
        void tick();
        // 3 秒：這頁唯一會自己變的是「玩家開了一次開房對話框」與「遊戲進大廳了」，
        // 兩件事都不急，但都要在玩家切回來的時候是對的。
        stageTimer = setInterval(tick, 3000);
      }
      function stopStagePolling() {
        if (stageTimer !== null) clearInterval(stageTimer);
        stageTimer = null;
      }

      /**
       * 補丁現在到底怎樣，寫成一句人話。
       *
       * ⚠ 這一頁最重要的一件事，是**分清楚「開關打開」跟「遊戲那邊真的變了」**。
       * 中間隔著三段：遊戲有沒有開、有沒有載到對戰大廳、玩家有沒有開過一次開房
       * 對話框。只寫「已啟用」的話，玩家會打開遊戲、發現選單只有 11 項，然後以為
       * 插件壞了。
       */
      function stageStatusText(enabled, st) {
        if (!enabled) return "未啟用 —— 遊戲的選單維持官方那 11 項";
        if (st === null) return "還沒接上遊戲 —— 開了遊戲就會自己裝上";
        if (!st.installed) {
          return st.waiting ? "等遊戲載到對戰大廳…（不用做任何事，到了就會自己補上）" : "還沒裝上";
        }
        if (!st.dropdownPatched) {
          return "地圖已經加進去了，選單等你在遊戲裡開一次「創建對戰房間」";
        }
        return "生效中";
      }

      PAGES["deck/hidden"] = () => {
        const s = sstate;
        // ⚠ 第一次畫的時候還沒問到狀態。這時候**不要先畫出開關** —— 它會是沒勾的
        // 樣子，而那對已經啟用的玩家是假的（下一輪輪詢就會跳成勾的）。
        if (s === null) {
          return (
            head("隱藏地圖", "官方選單裡沒有的四張地圖，加回遊戲自己的開房選單。") +
            `<div class="card"><div class="hint">讀取中…</div></div>`
          );
        }
        const enabled = s.enabled === true;
        const st = s.status ?? null;
        const stages = s.stages ?? [];
        const added = st?.added ?? [];

        const toggle = `<div class="card">
            <label class="toggle">
              <input type="checkbox" id="stagesOn" ${enabled ? "checked" : ""} />
              <span><b>在遊戲的開房選單裡顯示隱藏地圖</b>
                <div class="hint">
                  打開之後，遊戲自己的「創建對戰房間 › 對戰地點」下拉會從 11 項變成 15 項，
                  多出來的四項在最下面。房名、對戰規則、密碼、AP <b>全部走官方流程</b> ——
                  這裡只是把選項放回選單，開房仍然是你自己在遊戲裡按的。
                </div>
              </span>
            </label>
          </div>`;

        const state = `<div class="card">
            <div class="row"><span class="dim">狀態</span><span>${esc(stageStatusText(enabled, st))}</span></div>
            ${
              enabled && st?.installed
                ? `<div class="row"><span class="dim">已加進選單</span><span>${
                    added.length
                  } 張${added.length ? `（${added.map(esc).join("、")}）` : ""}</span></div>`
                : ""
            }
            ${
              st?.lang
                ? `<div class="row"><span class="dim">遊戲語言</span><span><code>${esc(st.lang)}</code></span></div>`
                : ""
            }
            ${
              enabled && st?.installed && !st.dropdownPatched
                ? `<div class="hint">選單那一格要等對話框第一次被建出來才碰得到 ——
                     <b>開一次就會補上，不必開兩次</b>。</div>`
                : ""
            }
            ${st?.reason ? `<div class="hint warn">⚠ ${esc(st.reason)}</div>` : ""}
            ${
              // 頁面那支腳本已經不等了（逾時、或換過語言）——
              // 這時候唯一能做的就是再推一次，給他一個按鈕。
              enabled && st !== null && !st.installed && !st.waiting
                ? `<div class="row"><span></span><span><button id="stagesRetry">再試一次</button></span></div>`
                : ""
            }
          </div>`;

        const rows = stages
          .map(
            (g) => `<tr>
                <td><code>${esc(g.value)}</code></td>
                <td>${esc(g.name)}</td>
                <td>${added.includes(g.value) ? "已加入" : '<span class="dim">—</span>'}</td>
              </tr>`,
          )
          .join("");

        const list = `<div class="card">
            <table><thead><tr><th>代號</th><th>地圖</th><th></th></tr></thead><tbody>${rows}</tbody></table>
          </div>`;

        const caveat = `<div class="card">
            <div class="hint" style="margin-top:0">
              <b>要知道的三件事</b><br />
              · 背景圖載得起來是<b>實測過的</b>，但還<b>沒有在這四張上打完一整場</b> ——
                真的出事只影響你自己那一場。<br />
              · 伺服器本來就收這四個代號（實測開房不會被拒）。插件<b>沒有</b>改變
                任何伺服器判定，只是讓選項在選單上出得來。<br />
              · <b>遊戲重載會把它沖掉</b>，插件會自己補回去 ——
                但補回去的那一刻選單又要等你開一次對話框。
            </div>
          </div>`;

        return (
          head("隱藏地圖", "官方選單裡沒有的四張地圖，加回遊戲自己的開房選單。") +
          toggle +
          state +
          list +
          caveat
        );
      };

      // --- 設置 › 配置 ------------------------------------------------------
      //
      // ⚠ 這一頁的表格、IPC（window.ulr.profiles.*）與按鈕事件本來就在了，
      // 缺的一直是這支 render 函式 —— 分頁註冊了但 PAGES 沒有對應的鍵，
      // renderBody() 就畫出一片空白。空白頁不會報錯，所以很難發現。
      PAGES["settings/profiles"] = () => {
        const list = snap?.store.profiles ?? [];
        const meId = snap?.profile.id;
        const ports = snap?.gamePorts ?? {};

        const row = (p) => {
          const self = p.id === meId;
          // ⚠ 別份配置只敢說「那個埠上有沒有遊戲在回話」。一個視窗只管一個
          // 客戶端，它沒辦法知道另一份配置的插件狀態。
          const alive = ports[p.port];
          const state = self
            ? snap?.status?.connected
              ? "這個視窗（已接上）"
              : "這個視窗（等遊戲…）"
            : alive === true
              ? "遊戲開著"
              : alive === false
                ? "沒有回應"
                : "—";
          return `<tr data-id="${esc(p.id)}"${self ? ' class="self"' : ""}>
              <td><input type="text" data-field="name" value="${esc(p.name)}" /></td>
              <td><select data-field="kind">
                    <option value="desktop"${p.kind === "desktop" ? " selected" : ""}>桌面版</option>
                    <option value="web"${p.kind === "web" ? " selected" : ""}>網頁版</option>
                  </select></td>
              <td><input type="number" data-field="port" value="${p.port}" /></td>
              <td><input type="text" data-field="link" value="${esc(p.link)}" placeholder="留空＝雲端" /></td>
              <td>${esc(state)}</td>
              <td>
                ${self ? "" : `<button data-act="launch">開新實例</button>`}
                <button data-act="dup">複製</button>
                ${list.length > 1 && !self ? `<button data-act="del">刪除</button>` : ""}
              </td>
            </tr>`;
        };

        const table = list.length
          ? `<table class="profiles">
               <thead><tr><th>名稱</th><th>客戶端</th><th>遊戲埠</th><th>中間人</th><th>狀態</th><th></th></tr></thead>
               <tbody>${list.map(row).join("")}</tbody>
             </table>`
          : `<div class="hint">清單是空的。按下面的「新增配置」建一份 ——
               第一份預設是桌面版，第二份會自動變成網頁版並換一個埠。</div>`;

        return (
          head("配置", "一個視窗管一個遊戲客戶端。要同時管兩個就建兩份配置，各開一個實例。") +
          `<div class="card">
             ${table}
             <div class="row"><span></span><span><button id="addProfile">新增配置…</button></span></div>
             <!--
               ⚠ 這裡以前有五行說明。留下的兩行是「不知道就會壞掉」的：改埠不重開
               沒有任何反應（引擎綁在啟動時的埠上）、兩份撞同一個埠時第二份是
               **開不起來**而不是報錯。其餘三行（狀態欄的語意、中間人留空＝雲端、
               local 是什麼）都是「看得懂欄位就猜得到」的，刪掉不會有人卡住。
             -->
             <div class="hint">
               ⚠ 改埠要<b>重開那個實例</b>才生效。<br />
               ⚠ 兩份不能用同一個埠 —— 撞到的話第二份會<b>安靜地開不起來</b>。
             </div>
           </div>` +
          (snap?.ephemeral
            ? `<div class="card"><div class="hint warn" style="margin-top:0">
                 這個視窗是用命令列的 <b>--port ${snap.profile.port}</b> 開的臨時配置，<b>不在清單裡</b>。
                 改它的設定不會存下來 —— 要留著就按上面的「新增配置」。
               </div></div>`
            : "")
        );
      };

      PAGES["settings/link"] = () => {
        const st = snap?.status;
        const p = snap?.profile;
        /**
         * ⚠ **埠與中間人只在「進階」打開時才出現。**
         *
         * 沒開進階的玩家只有一個客戶端、用的是雲端中間人的預設值，那兩個數字
         * 他一個都不需要、也一個都不能拿去做什麼 —— 露出來只會變成「我是不是
         * 漏設了什麼」。這一頁對他該只回答一個問題：**插件跟遊戲接上了沒。**
         */
        const multi = snap?.store?.multiProfile === true;
        return (
          head("連線", "插件跟遊戲接上了沒。") +
          `<div class="card">
             <div class="row"><span class="dim">遊戲</span><span>${
               !st ? "啟動中…" : st.connected ? "已接上" : "等遊戲…"
             }</span></div>
             <div class="row"><span class="dim">分頁</span><span>${esc(st?.title ?? "—")}</span></div>
             <div class="row"><span class="dim">攔截已掛上</span><span>${
               st?.armed ? "是" : "否（還在大廳）"
             }</span></div>
             <div class="row"><span class="dim">側通道</span><span>${
               st ? (LINK_TEXT[st.link] ?? st.link) : "—"
             }</span></div>
             ${st?.error ? `<div class="hint warn">⚠ ${esc(st.error)}</div>` : ""}
           </div>
           ${
             multi
               ? `<div class="card">
                    <div class="row"><span class="dim">客戶端</span><span>${
                      p?.kind === "web" ? "網頁版" : "桌面版"
                    }</span></div>
                    <div class="row"><span class="dim">CDP 埠</span><span>${
                      // ⚠ 顯示**實際**接到的埠，不是設定值。用 =0 啟動時客戶端
                      // 自己挑埠，我們從 DevToolsActivePort 讀回來 —— 顯示設定值
                      // 的話，這個數字會是一個沒有人在聽的號碼，而它唯一的用途
                      // 就是拿去給 CLI 用。
                      st?.port != null ? `:${st.port}` : `—　<span class="dim">（未接上）</span>`
                    }</span></div>
                    <div class="row"><span class="dim">中間人</span><span>${esc(p?.link ?? "—")}</span></div>
                    <div class="row"><span class="dim">我是中間人</span><span>${
                      st?.hosting ? "是" : "否（連到別人開的）"
                    }</span></div>
                  </div>`
               : ""
           }
           ${howToConnect(p)}`
        );
      };

      // --- 設置 › 啟動 ------------------------------------------------------
      PAGES["settings/startup"] = () => {
        const s = snap?.store;
        return (
          head("啟動", "開機時要不要自己起來。") +
          `<div class="card">
             <label class="toggle">
               <input type="checkbox" id="atLogin" ${snap?.launchAtLogin ? "checked" : ""} ${
                 snap?.packaged ? "" : "disabled"
               } />
               <span><b>隨 Windows 開機啟動</b>
                 <div class="hint">${
                   snap?.packaged
                     ? "開機後自動縮到系統匣，不跳視窗。"
                     : "⚠ 開發模式下不能設 —— 會把 node_modules 裡的 electron.exe 寫進登錄檔，之後開機跳出空白視窗且很難查。打包後才可用。"
                 }</div>
               </span>
             </label>
           </div>
           <div class="card">
             <label class="toggle">
               <input type="checkbox" id="startMin" ${s?.startMinimized ? "checked" : ""} />
               <span><b>啟動時只留托盤圖示</b>
                 <div class="hint">不跳設定視窗。點托盤圖示隨時叫得出來。</div>
               </span>
             </label>
           </div>
           <div class="card">
             <div class="hint" style="margin-top:0">
               <b>怎麼讓遊戲一開插件就接上</b><br />
               在 Steam 的啟動選項裡設一次 debug port —— 步驟在
               <b>設置 › 連線</b>那一頁。設好之後每次從 Steam 開遊戲，插件都會自己接上。<br />
               ⚠ 沒設的話 debug 埠不會開，插件<b>永遠</b>接不上，而畫面上只會寫「等遊戲…」。
             </div>
           </div>`
        );
      };

      // --- 設置 › 更新 ------------------------------------------------------
      PAGES["settings/update"] = () =>
        head("更新", "") +
        `<div class="card">
           <div class="row"><span class="dim">目前版本</span><span>${esc(snap?.version ?? "—")}</span></div>
           <div class="row"><span class="dim">執行方式</span><span>${
             snap?.packaged ? "已安裝" : "開發模式（未打包）"
           }</span></div>
         </div>
         <div class="card">
           <div class="hint" style="margin-top:0">
             更新流程本身是完整的（檢查 → 下載 → 驗 SHA-256 → 暫存 → 安全時機套用），
             但<b>還沒有預設的發布來源</b>，要設環境變數 <b>ULR_UPDATE_FEED</b> 才會啟動。<br />
             ⚠ <b>套用一定不在對戰中發生。</b>「靜默」指的是不打擾，不是未經同意就重啟 ——
             協定版本一變，中間人會回 incompatible，雙方當場退回單邊模式。
             那件事發生在移動階段中間的話，玩家會看到約定秒數突然消失而不知道為什麼。
           </div>
         </div>`;

      // --- 設置 › 記錄 ------------------------------------------------------
      PAGES["settings/log"] = () =>
        head("記錄", "最近的動作。查「剛剛到底發生了什麼」用的。") +
        `<div class="card"><pre class="log" id="log">${esc(
          (snap?.log ?? []).join("\n") || "（還沒有記錄）",
        )}</pre></div>
         <div class="card">
           <div class="hint" style="margin-top:0">
             這一頁只留最近 40 行，<b>完整記錄寫在檔案裡</b>（關掉插件也還在）：<br />
             <code>${esc(snap?.logPath ?? "—")}</code><br />
             回報問題時請附上它。<b>裡面不含任何遊戲內容</b> —— 沒有手牌、沒有牌組、
             沒有對手是誰，房號也是截短的雜湊，可以直接貼。
           </div>
         </div>`;

      // --- 設置 › 關於 ------------------------------------------------------
      PAGES["settings/about"] = () =>
        head("關於", "") +
        `<div class="card">
           <div class="row"><span class="dim">ULR Companion</span><span>${esc(snap?.version ?? "—")}</span></div>
           <div class="hint">UNLIGHT:Revive 自訂 COST 規則與對戰追蹤的執行端。MIT 授權。</div>
         </div>
         <div class="card">
           <div class="hint" style="margin-top:0">
             <b>公平性立場</b><br />
             這個插件只改<b>自己客戶端的顯示</b>，伺服器收到的東西一個字都沒變。<br />
             · 不修改伺服器端技能判定，不繞過官方戰鬥規則<br />
             · 自訂 COST 是<b>自我約束</b>：雙方同意才有意義<br />
             · 不顯示也不上傳對手未揭露的手牌、牌組或任何隱藏資訊<br />
             · 會改變節奏的功能（秒數、加速）一律<b>雙方同意才生效</b>
           </div>
         </div>
         <div class="card">
           <div class="hint" style="margin-top:0">
             <b>這個插件會連到哪裡、送什麼</b><br />
             只有兩個對外連線，兩個都連到同一台伺服器（Cloudflare Workers）：<br />
             · <b>中間人</b>（對戰中）—— 送<b>雜湊過的場次編號</b>與你的四個偏好設定<br />
             · <b>檢查更新</b>（每小時一次）—— 只問「最新版是哪一版」<br />
             <br />
             <b>不會送出去的東西：</b>你的名字、Steam 帳號或 token、對手是誰、
             任何一張手牌或牌組內容、對戰結果。<br />
             伺服器只回答一個問題：<b>「這兩條連線在不在同一場對戰」</b> ——
             場次編號是 SHA-256 截斷過的，它<b>認不出那是哪一場，也認不出你是誰</b>。<br />
             <br />
             ⚠ 沒進對戰時<b>完全不連線</b>。中間人連不上時自動退回單邊模式，
             功能會少，但不會壞。
           </div>
         </div>
         <div class="card">
           <button class="gene" data-link="https://github.com/UnlightPlugin/ulr-companion">原始碼與問題回報</button>
           <button class="gene" data-link="https://ulgg.online/">ULGG</button>
         </div>
         <div class="card">
           <label class="toggle">
             <input type="checkbox" id="multi" ${snap?.store?.multiProfile ? "checked" : ""} />
             <span><b>進階：同時管兩個遊戲客戶端</b>
               <div class="hint">
                 平常不需要。<b>一個視窗管一個遊戲</b>，裝好就是這樣，不必設定任何東西。<br />
                 打開之後左邊會多一格「配置」（在這一頁下面），托盤選單會多一個「開新實例」，
                 狀態列會開始顯示埠號 —— 那些是給要同時開兩個帳號的人用的。
               </div>
             </span>
           </label>
         </div>`;

      // =====================================================================
      // 事件（委派：內容是每次重畫的，不能直接綁在元素上）
      // =====================================================================
      $("content").addEventListener("change", (e) => {
        const t = e.target;
        // ⚠ 配對表單改動要**立刻**收進 mform。這頁每 3 秒重畫一次，而重畫是從
        // mform 取值的 —— 不收的話你選好的地點會在下一次輪詢時被打回去。
        if (MATCH_FIELDS.has(t.id)) readMatchForm();
        if (t.id === "ready") return void set({ readyEnabled: t.checked });
        if (t.id === "seconds") {
          dragging = false;
          return void set({ phaseSeconds: Number(t.value) });
        }
        if (t.id === "tintPick") {
          return void window.ulr.setReadyTint(parseInt(t.value.slice(1), 16)).then(apply);
        }
        if (t.id === "stagesOn") {
          return void window.ulr.stages.set(t.checked).then((s) => {
            sstate = s;
            renderBody();
          });
        }
        if (t.id === "atLogin") return void options({ launchAtLogin: t.checked });
        if (t.id === "startMin") return void options({ startMinimized: t.checked });
        if (t.id === "multi") return void options({ multiProfile: t.checked });

        const row = t.closest("tr[data-id]");
        if (row && t.dataset.field) {
          editing = null;
          const field = t.dataset.field;
          const value = field === "port" ? Number(t.value) : t.value;
          const patch = { [field]: value };
          // 換客戶端種類時順手把埠帶到那一種的預設，玩家少改一個欄位。
          if (field === "kind") {
            window.ulr.profiles.defaultPort(value).then((port) => {
              window.ulr.profiles.edit(row.dataset.id, { kind: value, port }).then(apply);
            });
            return;
          }
          return void window.ulr.profiles.edit(row.dataset.id, patch).then(apply);
        }
      });

      $("content").addEventListener("input", (e) => {
        const t = e.target;
        if (t.id === "seconds") {
          dragging = true;
          $("secLabel").textContent = t.value;
        }
        // 打字時記住是誰在被編輯，重畫後要把它還原（見 renderBody 的呼叫點）
        if (t.closest("tr[data-id]")) editing = t;

        // --- 編輯 COST ---
        //
        // ⚠ **改一格不重畫整頁。** 角色那一頁有 700 個欄位，重畫會把游標踢掉、
        // 捲軸跳回頂端，而玩家正在一個一個調數字。只更新那一格的樣式與計數。
        if (t.dataset.t !== undefined && t.dataset.k !== undefined) {
          editing = t;
          const n = Number(t.value);
          if (t.value !== "" && Number.isFinite(n)) ed.draft[t.dataset.t][t.dataset.k] = n;
          t.classList.toggle("dirty", edChanged(t.dataset.t, t.dataset.k));
          edMsg = null;
          const save = $("edSave");
          if (save) save.disabled = edUnsavedCount() === 0;
          return;
        }
        // --- 編輯規則（壓 C 區間）---
        //
        // 改一格就要重算重疊、縫隙與試算表 —— 但**只重畫那幾塊**（`rlRefresh`），
        // 不整頁重畫，否則正在打字的輸入框會連焦點一起被換掉。
        if (t.dataset.rb !== undefined && rl !== null) {
          editing = t;
          const band = rl.bands[Number(t.dataset.rb)];
          if (band) {
            const raw = t.value.trim();
            const n = Number(raw);
            if (t.dataset.rf === "maxGap") {
              // ⚠ 空白＝無上界，**不是 0**。`Number("")` 是 0，那會把
              // 「14 以上」變成「14 到 0」—— 一段不可能命中的區間。
              band.maxGap = raw === "" ? null : Number.isFinite(n) ? n : band.maxGap;
            } else if (raw !== "" && Number.isFinite(n)) {
              band[t.dataset.rf] = n;
            }
          }
          rlMsg = null;
          return rlRefresh();
        }
        if (t.id === "rlVersion") {
          editing = t;
          return;
        }
        if (t.id === "edFilter") {
          edFilter = t.value;
          editing = t;
          // 篩選要立刻反映，但只重畫清單那一塊，不動上面的表頭與輸入焦點。
          const cat = ed?.catalog;
          const box = $("content").querySelector(".card:last-child");
          if (cat && box) {
            box.innerHTML =
              edTab === "characters"
                ? edCharacters(cat)
                : edTab === "monsters"
                  ? edMonsters(cat)
                  : edTab === "equipment"
                    ? edEquipment(cat)
                    : edEvents(cat);
          }
          return;
        }
      });

      $("content").addEventListener("click", (e) => {
        const btn = e.target.closest("button");
        if (!btn) return;

        // --- 編輯 COST ---
        if (btn.dataset.edtab !== undefined) {
          edTab = btn.dataset.edtab;
          edFilter = "";
          return renderBody();
        }
        if (btn.id === "edCatalog") {
          btn.disabled = true;
          btn.textContent = "讀取中…";
          return void window.ulr.editor.refreshCatalog().then((payload) => {
            // ⚠ 重讀名冊會換掉「原價」的基準，所以草稿要跟著重建 —— 但**玩家
            // 已經改過的值不能丟**。decorate() 是從規則檔重建的，而規則檔就是
            // 上一次存檔的內容，所以這裡把還沒存的改動疊回去。
            const keep = ed?.draft ?? null;
            ed = decorate(payload);
            if (keep !== null) {
              for (const t of ED_TABS)
                for (const k of Object.keys(keep[t.id] ?? {}))
                  if (ed.draft[t.id][k] !== undefined) ed.draft[t.id][k] = keep[t.id][k];
            }
            renderBody();
          });
        }
        if (btn.id === "edSave") {
          const version = $("edVersion")?.value.trim() ?? ed.rule.version;
          // ⚠⚠ **檔名要在這裡先抓下來，不能等 then 裡面才讀 `ed.rule`。**
          // 存檔成功會讓主程序推一份新狀態過來，而 apply() 看到核對碼變了就把
          // `ed` 設成 null —— 那份推播**比 invoke 的回覆先到**。在 then 裡讀
          // `ed.rule.fileName` 會拋 TypeError，而 promise 會把它吞掉：檔案存好了，
          // 玩家卻什麼提示都沒有。2026-08-16 實測踩到，兩次都以為是時序問題。
          const fileName = ed.rule.fileName;
          btn.disabled = true;
          return void window.ulr.editor.save({ tables: ed.draft, version }).then((r) => {
            edMsg = r.ok
              ? { text: `已存回 ${fileName}（${r.version}，核對碼 ${r.shortHash}）`, bad: false }
              : { text: r.error ?? "存檔失敗", bad: true };
            // ⚠ 不自己 `edLoad(true)`：狀態推播已經把 `ed` 丟掉了，重畫時
            // 會自然重拉一次。這裡再拉一次只會兩份 payload 賽跑。
            // 但**一定要重畫** —— 兩個 promise 的先後沒有保證，少了這一行時
            // 訊息可能落在最後一次重畫之後，變成存了檔卻沒有任何回應。
            renderBody();
          });
        }
        if (btn.id === "edResetTab") {
          const label = ED_TABS.find((t) => t.id === edTab)?.label ?? edTab;
          // ⚠ 只動當前這一頁。四張表一起清掉是很難反悔的操作，而玩家按的是
          // 「這一頁」那顆按鈕。
          for (const k of Object.keys(ed.base[edTab])) ed.draft[edTab][k] = ed.base[edTab][k];
          edMsg = { text: `${label}已全部改回原價（還沒存檔）`, bad: false };
          return renderBody();
        }

        // --- 編輯規則（壓 C 區間）---
        if (btn.dataset.rbdel !== undefined && rl !== null) {
          rl.bands.splice(Number(btn.dataset.rbdel), 1);
          rlMsg = null;
          return renderBody();
        }
        if (btn.id === "rlAdd" && rl !== null) {
          // 接在最後一段後面起跳，玩家少改一個欄位。最後一段沒有上界時就從
          // 它的下界 +1 起 —— 那一定會重疊，而重疊會立刻被上面的檢查點名，
          // 比安靜地插一段 0 進去好懂。
          const last = rl.bands[rl.bands.length - 1];
          const start = last ? (last.maxGap === null ? last.minGap + 1 : last.maxGap + 1) : 7;
          rl.bands.push({ minGap: start, maxGap: null, extraCost: 0 });
          rlMsg = null;
          return renderBody();
        }
        if (btn.id === "rlSort" && rl !== null) {
          // ⚠ 順序**有意義**：引擎取第一個命中的區間。沒重疊時排序不改變任何
          // 結果，有重疊時排序會改變 —— 所以排完要讓玩家自己看那個警告。
          rl.bands.sort((a, b) => a.minGap - b.minGap);
          rlMsg = null;
          return renderBody();
        }
        if (btn.id === "rlSnap" && rl !== null) {
          // 每一段的上界頂到下一段起點的前 0.01（`shinon/squeeze-band` 的 x.99
          // 就是這樣來的）。最後一段不動 —— 它要嘛本來就無上界，要嘛作者是
          // 刻意讓超大差距不罰。
          const order = rl.bands.map((b, i) => ({ b, i })).sort((x, y) => x.b.minGap - y.b.minGap);
          for (let n = 0; n < order.length - 1; n++) {
            const cur = order[n].b;
            const next = order[n + 1].b;
            if (cur.maxGap === null) continue;
            if (next.minGap > cur.maxGap) cur.maxGap = Math.round((next.minGap - 0.01) * 100) / 100;
          }
          rlMsg = { text: "已把每一段的上界頂到下一段（還沒存檔）", bad: false };
          return renderBody();
        }
        if (btn.id === "rlOfficial" && rl !== null) {
          rl.bands = RL_OFFICIAL.map((b) => ({ ...b }));
          rlMsg = { text: "已換成原版的兩段（還沒存檔）", bad: false };
          return renderBody();
        }
        if (btn.id === "rlClear" && rl !== null) {
          rl.bands = [];
          rlMsg = { text: "已清空 —— 存檔之後這份規則完全不壓 C", bad: false };
          return renderBody();
        }
        if (btn.id === "rlSave" && rl !== null) {
          // ⚠ 檔名先抓下來。存檔會讓主程序推一份新狀態過來，而 apply() 看到
          // 核對碼變了就把 `rl` 設成 null —— 那份推播比 invoke 的回覆先到。
          // 編輯 COST 那邊踩過同一件事。
          const fileName = rl.rule.fileName;
          const version = $("rlVersion")?.value.trim() ?? rl.rule.version;
          const bands = rl.bands.map((b) => ({
            minGap: b.minGap,
            // 主程序那邊 null 就是「沒有上界」（`sanitizeBand`）。
            maxGap: b.maxGap,
            extraCost: b.extraCost,
          }));
          btn.disabled = true;
          return void window.ulr.editor
            .save({
              // ⚠ **不送 `tables`。** 主程序看到沒有這個欄位就沿用檔案裡的四張
              // 表；送一份空的等於把 1186 筆價格全洗掉（而空表是合法規則，
              // 不會報錯，只會讓每張卡變成 99C）。
              compression: bands.length === 0 ? { type: "none" } : { type: "gap-band-v1", bands },
              version,
            })
            .then((r) => {
              rlMsg = r.ok
                ? { text: `已存回 ${fileName}（${r.version}，核對碼 ${r.shortHash}）`, bad: false }
                : { text: r.error ?? "存檔失敗", bad: true };
              renderBody();
            });
        }

        if (btn.dataset.tint !== undefined) {
          const v = btn.dataset.tint === "" ? null : Number(btn.dataset.tint);
          return void window.ulr.setReadyTint(v).then(apply);
        }
        if (btn.id === "addProfile") {
          return void window.ulr.profiles.add().then(apply);
        }
        if (btn.id === "copyFlag") {
          // 走主程序的剪貼簿（見 preload）。要玩家自己把那一行一字不差地打進
          // Steam，就是在製造一個「打錯了但完全看不出來」的失敗。
          return void window.ulr.copyDebugFlag().then(() => {
            btn.textContent = "已複製";
            setTimeout(() => (btn.textContent = "複製"), 1500);
          });
        }
        if (btn.id === "mOpen") return void matchOpen();
        if (btn.id === "mCancel") return void matchCancel();
        if (btn.id === "mJoin") return void matchJoin();
        if (btn.id === "mQueueStart") return void queueStart();
        if (btn.id === "mQueueStop") return void queueStop();
        if (btn.dataset.tier !== undefined) {
          // 快速鍵：填數字並順手打開勾選 —— 按了檔位卻沒生效是最沒道理的狀態。
          // ⚠ 先 readMatchForm() 把其他欄位收起來，否則重畫會把它們打回去。
          readMatchForm();
          mform.limit = Number(btn.dataset.tier);
          mform.limitOn = true;
          return void renderBody();
        }
        if (btn.id === "stagesRetry") {
          return void window.ulr.stages.retry().then((s) => {
            sstate = s;
            renderBody();
          });
        }
        if (btn.id === "costPick") return void window.ulr.cost.pick().then(apply);
        if (btn.id === "costClear") return void window.ulr.cost.clear().then(apply);
        if (btn.id === "costReload") return void window.ulr.cost.reload().then(apply);
        if (btn.dataset.link) {
          return void window.ulr.openExternal(btn.dataset.link);
        }

        const row = btn.closest("tr[data-id]");
        if (!row) return;
        const id = row.dataset.id;
        if (btn.dataset.act === "launch") return void window.ulr.profiles.launch(id).then(apply);
        if (btn.dataset.act === "dup") return void window.ulr.profiles.add(id).then(apply);
        if (btn.dataset.act === "del") return void window.ulr.profiles.remove(id).then(apply);
      });

      // --- 配對的動作 -------------------------------------------------------
      //
      // ⚠ 這三支**會替玩家操作遊戲**：開房消耗 AP、進房直接開打。只能綁在
      // 玩家按下去的按鈕上，不要放進輪詢或自動重試。

      const MATCH_FIELDS = new Set([
        "mRoomName",
        "mStage",
        "mMulti",
        "mBandOn",
        "mBand",
        "mLimitOn",
        "mLimit",
      ]);

      /** 把畫面上的值收回 mform。重畫是從 mform 取值的，所以按鈕按下前要先收。 */
      function readMatchForm() {
        const v = (id) => $(id);
        const fallback = mstate?.statics?.defaultRoomName ?? "";
        if (v("mRoomName")) mform.roomName = v("mRoomName").value.trim() || fallback;
        if (v("mStage")) mform.stage = v("mStage").value;
        if (v("mMulti")) mform.multi = v("mMulti").value === "1";
        if (v("mBandOn")) mform.bandOn = v("mBandOn").checked;
        if (v("mBand")) mform.band = Number(v("mBand").value);
        if (v("mLimitOn")) mform.limitOn = v("mLimitOn").checked;
        // ⚠ 夾到兩位小數。上限會進配對鍵（`matchCriteriaString` 用 toFixed(2)），
        // 打三位小數的話「畫面上的數字」跟「實際比的數字」會不一樣。
        if (v("mLimit")) {
          const n = Number(v("mLimit").value);
          if (Number.isFinite(n) && n >= 0) mform.limit = Math.round(n * 100) / 100;
        }
      }

      /**
       * 開始自動配對。
       *
       * ⚠ 這一支跟 matchOpen 一樣**會替玩家操作遊戲** —— 而且更進一步：配到人
       * 之後不必再按任何東西就會開房／進房。所以按鈕的文案要講清楚，而且
       * 「停止」永遠可以按。
       */
      function queueStart() {
        readMatchForm();
        const ch = mstate?.context?.channel;
        if (ch === null || ch === undefined) {
          matchHandoff = { error: "請先在遊戲裡進入一個頻道。" };
          return renderBody();
        }
        matchHandoff = null;
        return window.ulr.match.queue
          .start({
            channel: ch,
            multi: mform.multi,
            costLimit: mform.limitOn ? mform.limit : null,
            deckCostBand: mform.bandOn ? mform.band : null,
            roomName: mform.roomName ?? mstate?.statics?.defaultRoomName ?? "",
            stage: mform.stage,
          })
          .then((r) => {
            if (!r.ok) matchHandoff = { error: r.reason };
            else if (mstate) mstate.pairing = r.status;
            renderBody();
          });
      }

      function queueStop() {
        return window.ulr.match.queue.stop().then((r) => {
          if (mstate && r.status) mstate.pairing = r.status;
          renderBody();
        });
      }

      function matchOpen() {
        readMatchForm();
        const ch = mstate?.context?.channel;
        if (ch === null || ch === undefined) {
          matchHandoff = { error: "請先在遊戲裡進入一個頻道。" };
          return renderBody();
        }
        matchHandoff = null;
        return window.ulr.match
          .open({
            channel: ch,
            roomName: mform.roomName ?? mstate?.statics?.defaultRoomName ?? "",
            stage: mform.stage,
            multi: mform.multi,
            // ⚠ 遊戲的「牌組Cost限制 ±N」，伺服器用原版 COST 判。
            deckCostBand: mform.bandOn ? mform.band : null,
          })
          .then((r) => {
            matchHandoff = r.ok ? { roomId: r.roomId, pass: r.pass } : { error: r.reason };
            renderBody();
          });
      }

      function matchCancel() {
        return window.ulr.match.cancel().then((r) => {
          matchHandoff = r.ok ? null : { error: r.reason };
          renderBody();
        });
      }

      function matchJoin() {
        const id = $("mJoinId")?.value.trim() ?? "";
        const pass = $("mJoinPass")?.value.trim() ?? "";
        if (!id || !pass) {
          matchHandoff = { error: "房號跟密碼都要填。" };
          return renderBody();
        }
        return window.ulr.match.join(id, pass).then((r) => {
          matchHandoff = r.ok ? null : { error: r.reason };
          renderBody();
        });
      }

      function set(prefs) {
        return window.ulr.setPrefs(prefs).then(apply);
      }
      function options(patch) {
        return window.ulr.setOptions(patch).then(apply);
      }

      // =====================================================================
      // 套用一份快照
      // =====================================================================
      /** 目前選著的規則的身分。換檔或換版本時，編輯器的草稿就作廢了。 */
      function ruleSig(s) {
        const r = s?.status ? s.costRule : null;
        return `${s?.costRule?.path ?? ""}|${s?.costRule?.version ?? ""}|${s?.costRule?.shortHash ?? ""}`;
      }
      let lastRuleSig = null;

      function apply(next) {
        if (!next) return;
        const sig = ruleSig(next);
        // 規則換了（玩家去「Cost 表」選了別份，或我們剛存完檔）→ 手上那份草稿
        // 的基準已經不對了，丟掉重載。
        //
        // ⚠ **`edMsg` 不能一起清掉。** 存檔會讓核對碼改變，於是這個判斷成立、
        // 於是「已存回 xxx」那行字在出現的同一瞬間就被抹掉 —— 玩家按了存檔卻
        // 什麼回應都看不到。訊息本身帶著檔名與核對碼，過期也不會誤導。
        if (lastRuleSig !== null && sig !== lastRuleSig) {
          ed = null;
          rl = null;
        }
        lastRuleSig = sig;
        snap = next;
        renderFooter();
        // ⚠ 拖滑桿或打字時不要重畫內容區 —— 會把游標踢掉、滑桿跳回去。
        // 狀態列照更新（它跟輸入無關，而且那才是玩家在等的資訊）。
        if (dragging || (editing && document.activeElement === editing)) return;
        // ⚠ 編輯 COST 那一頁**不跟著狀態推播重畫**。它有 700 個輸入框，而連線
        // 心跳、對戰狀態這些跟它一點關係都沒有的變動每幾秒就來一次 —— 重畫會
        // 把捲軸拉回頂端，而玩家正在第 40 位角色那一排調數字。
        // 需要重畫的兩件事（換規則、存完檔）各自都有明確的呼叫點。
        if (onEditPage() && ed !== null) return;
        // ⚠ 編輯規則那一頁同理。欄位少得多，但玩家一樣是在輸入框裡打數字，
        // 而連線心跳每幾秒就推一次 —— 重畫會把打到一半的數字連游標一起換掉。
        // 換規則與存完檔都會把 `rl` 設成 null，那時這道閘自然放行。
        if (onRulePage() && rl !== null) return;
        editing = null;
        // ⚠ 側邊那排會隨「進階：多開」增減，所以每次套用快照都要重畫，不能只在
        // 切分頁時畫。而關掉多開的那一刻若玩家正站在「配置」上，那一格已經不
        // 存在了 —— 退回第一格，不要把他留在一片空白上。
        const visible = subsOf(TABS.find((t) => t.id === tab));
        if (!visible.some((s) => s.id === sub)) sub = visible[0].id;
        renderChrome();
        renderBody();
      }

      renderChrome();
      window.ulr.onState(apply);
      window.ulr.state().then(apply);
    </script>
  </body>
</html>
