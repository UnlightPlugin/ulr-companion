<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <!--
      ⚠ CSP 這裡是**必要的**，不是加好玩的。這個視窗的內容全部是我們自己寫死的，
      所以連線來源可以鎖到只剩 'self'。§12 的原則：邊界擋一次，之後都安全。

      ⚠ **外觀是純 CSS 重現的，一張遊戲圖檔都沒有。** 色票是 2026-08-07 從跑著的
      客戶端量出來的（分頁 tab_chara/library_btn_*、底 option_bg、面板 edit_bg），
      不是憑印象調的。這個選擇讓上面那行 `default-src 'none'` 成立 ——
      要是改成載入遊戲的圖，就得放寬 img-src，而且離線時整個外觀會消失。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>ULR Companion</title>
    <style>
      :root {
        /* --- 從客戶端量到的色票（見上方註解） --- */
        --tab-off: #622b2f; /* edit/tab_chara.png frame 0 */
        --tab-off-lo: #4a2024;
        --tab-hover: #873136; /* frame 1 */
        --tab-on: #d5d5d5; /* 選中是淺灰，不是更亮的紅 */
        --tab-on-lo: #b4b4b4;
        /*
         * ⚠ 遊戲原本的分頁字幾乎是黑的（量到的暗部接近 #000），靠浮雕撐可讀性。
         * 這裡刻意調亮一階：遊戲的分頁是大圖示尺寸，這個視窗是 13.5px 的文字，
         * 照抄會變成看不清楚要點哪裡。像它，但不要像到不能用。
         */
        --ink-off: #d8b6b8;
        --ink-on: #241013;

        --bg: #1e2336; /* option_bg 的主色 */
        --bg-lo: #161a29;
        --panel: #272c3c;
        --panel-hi: #313749;
        --line: #0c0e16;
        --rule: #434a60;

        --text: #dfe2ea;
        --dim: #939bb0;
        --amber: #ffc247;
        --green: #4cc96a;
        --red: #b8434b;
        --grey: #7d8496;

        --serif: "Noto Serif TC", "Source Han Serif TC", "MS Mincho", "PMingLiU", Georgia, serif;
        --sans: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg-lo);
        color: var(--text);
        font: 13px/1.6 var(--sans);
        user-select: none;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* --- 頂條：遊戲每個畫面上緣那條直紋 --- */
      header {
        flex: none;
        height: 34px;
        display: flex;
        align-items: center;
        padding: 0 12px;
        border-bottom: 1px solid var(--line);
        background:
          repeating-linear-gradient(90deg, #2b3a42 0 3px, #26333a 3px 6px, #1d282e 6px 9px), #26282a;
      }
      header .brand {
        font-family: var(--serif);
        font-size: 13px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #b9c6cc;
        text-shadow: 0 1px 0 #000;
      }
      header .ver {
        margin-left: 10px;
        padding: 1px 7px;
        border: 1px solid #3a4a52;
        border-radius: 2px;
        font-size: 10.5px;
        letter-spacing: 0.06em;
        color: #8fa0a8;
      }
      header .who {
        margin-left: auto;
        font-size: 11.5px;
        color: #8fa0a8;
        letter-spacing: 0.04em;
      }

      /* --- 大分頁列 --- */
      nav.tabs {
        flex: none;
        display: flex;
        gap: 2px;
        padding: 6px 8px 0;
        background: var(--bg-lo);
        border-bottom: 1px solid var(--line);
      }
      nav.tabs button {
        appearance: none;
        min-width: 92px;
        padding: 6px 16px 5px;
        border: 1px solid var(--line);
        border-bottom: none;
        border-radius: 2px 2px 0 0;
        font-family: var(--serif);
        font-size: 13.5px;
        letter-spacing: 0.14em;
        cursor: pointer;
        color: var(--ink-off);
        background: linear-gradient(180deg, var(--tab-off) 0%, var(--tab-off-lo) 100%);
        /* 遊戲的分頁字是浮雕的，靠一暗一亮兩層陰影做出來 */
        text-shadow:
          0 1px 1px rgba(0, 0, 0, 0.75),
          0 -1px 0 rgba(0, 0, 0, 0.35);
      }
      nav.tabs button:hover {
        background: linear-gradient(180deg, var(--tab-hover) 0%, #6e282d 100%);
        color: #f4e2e3;
      }
      nav.tabs button[aria-selected="true"] {
        background: linear-gradient(180deg, var(--tab-on) 0%, var(--tab-on-lo) 100%);
        color: var(--ink-on);
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.6);
      }

      /* --- 主體：左側子分頁 + 內容 --- */
      main {
        flex: 1;
        display: flex;
        min-height: 0;
        background:
          radial-gradient(circle at 1px 1px, rgba(255, 255, 255, 0.028) 1px, transparent 1px) 0 0 /
            4px 4px,
          linear-gradient(180deg, var(--bg) 0%, var(--bg-lo) 100%);
      }

      aside {
        flex: none;
        width: 116px;
        padding: 10px 0;
        border-right: 1px solid var(--line);
        background: linear-gradient(90deg, rgba(0, 0, 0, 0.28), rgba(0, 0, 0, 0.06));
        overflow-y: auto;
      }
      aside button {
        appearance: none;
        display: block;
        width: 100%;
        padding: 7px 10px 7px 16px;
        border: none;
        border-left: 3px solid transparent;
        background: none;
        color: var(--dim);
        font-family: var(--serif);
        font-size: 13px;
        letter-spacing: 0.1em;
        text-align: left;
        cursor: pointer;
      }
      aside button:hover {
        color: var(--text);
        background: rgba(135, 49, 54, 0.22);
      }
      aside button[aria-selected="true"] {
        color: #fff;
        border-left-color: var(--red);
        background: linear-gradient(90deg, rgba(184, 67, 75, 0.36), transparent);
      }
      /* 未實作的子分頁：看得見，但一眼看得出還不能用 */
      aside button.todo::after {
        content: "…";
        color: var(--grey);
        margin-left: 4px;
      }

      section.body {
        flex: 1;
        padding: 14px 16px;
        overflow-y: auto;
        min-width: 0;
      }
      h2 {
        margin: 0 0 3px;
        font-family: var(--serif);
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0.08em;
      }
      /* 遊戲 Library 那條帶小飾釘的分隔線 */
      .rule {
        height: 1px;
        margin: 9px 0 13px;
        background: linear-gradient(90deg, var(--rule), rgba(67, 74, 96, 0.1));
        position: relative;
      }
      .rule::before {
        content: "";
        position: absolute;
        left: -3px;
        top: -2.5px;
        width: 6px;
        height: 6px;
        background: var(--rule);
        transform: rotate(45deg);
      }
      .lede {
        color: var(--dim);
        font-size: 12px;
        margin: 0;
      }

      .card {
        background: linear-gradient(180deg, var(--panel-hi), var(--panel));
        border: 1px solid var(--line);
        border-radius: 3px;
        padding: 11px 13px;
        margin-bottom: 10px;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.045);
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 10px;
      }
      .row + .row {
        margin-top: 5px;
      }
      .dim {
        color: var(--dim);
      }
      .big {
        font-family: var(--serif);
        font-size: 24px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .hint {
        color: var(--dim);
        font-size: 11.5px;
        margin-top: 6px;
        line-height: 1.65;
      }
      .warn {
        color: var(--amber);
      }
      .bad {
        color: var(--red);
      }
      .good {
        color: var(--green);
      }

      label.toggle {
        display: flex;
        align-items: flex-start;
        gap: 9px;
        cursor: pointer;
      }
      label.toggle input {
        margin: 4px 0 0;
        flex: none;
        accent-color: var(--red);
      }
      label.toggle b {
        font-family: var(--serif);
        letter-spacing: 0.05em;
      }

      input[type="range"] {
        width: 100%;
        margin: 10px 0 2px;
        accent-color: var(--amber);
      }
      .ticks {
        display: flex;
        justify-content: space-between;
        color: var(--dim);
        font-size: 11px;
      }

      input[type="text"],
      input[type="number"],
      select {
        background: #12151f;
        border: 1px solid var(--line);
        border-radius: 2px;
        color: var(--text);
        font: 12.5px var(--sans);
        padding: 4px 7px;
      }
      input:focus,
      select:focus {
        outline: 1px solid var(--red);
      }
      select option {
        background: #12151f;
      }

      /* 遊戲的通用按鈕（btn_gene）：淺灰漸層、按下去描紅邊 */
      button.gene {
        appearance: none;
        padding: 4px 12px;
        border: 1px solid #2a2c31;
        border-radius: 2px;
        background: linear-gradient(180deg, #cfd4da 0%, #9aa1ab 48%, #cdd2d8 52%, #eef1f4 100%);
        color: #23262c;
        font: 12px var(--sans);
        cursor: pointer;
      }
      button.gene:hover {
        border-color: var(--red);
      }
      button.gene:disabled {
        opacity: 0.4;
        cursor: default;
        border-color: #2a2c31;
      }
      button.gene.danger:hover {
        border-color: var(--red);
        color: #7a1f26;
      }

      .presets {
        display: flex;
        gap: 6px;
        margin: 10px 0 2px;
        flex-wrap: wrap;
      }
      .presets button {
        appearance: none;
        padding: 5px 13px;
        border: 1px solid var(--line);
        border-radius: 2px;
        background: linear-gradient(180deg, var(--tab-off), var(--tab-off-lo));
        color: #e8d5d6;
        font-family: var(--serif);
        font-size: 13px;
        letter-spacing: 0.06em;
        cursor: pointer;
      }
      .presets button:hover {
        background: linear-gradient(180deg, var(--tab-hover), #6e282d);
      }
      .presets button[aria-pressed="true"] {
        background: linear-gradient(180deg, var(--tab-on), var(--tab-on-lo));
        color: var(--ink-on);
      }

      /* --- 配置清單 --- */
      table.profiles {
        width: 100%;
        border-collapse: collapse;
        font-size: 12.5px;
      }
      table.profiles th {
        text-align: left;
        font-weight: 500;
        color: var(--dim);
        font-size: 11.5px;
        padding: 0 6px 5px;
        border-bottom: 1px solid var(--rule);
      }
      table.profiles td {
        padding: 5px 6px;
        border-bottom: 1px solid rgba(67, 74, 96, 0.35);
        vertical-align: middle;
      }
      table.profiles tr.self td {
        background: rgba(184, 67, 75, 0.13);
      }
      table.profiles input[type="text"] {
        width: 100%;
      }
      table.profiles input[type="number"] {
        width: 72px;
      }
      /* 中間人那一欄是一整個網址（36 字元），不再是四位數的埠。
         窄於這個寬度會被切成 `wss://ulr-link.lldavuull.work`，而看不到尾巴的
         網址沒有辦法用眼睛核對 —— 那正是這一格唯一的用途。 */
      table.profiles td:nth-child(5) {
        min-width: 250px;
      }
      .self-mark {
        color: var(--amber);
        font-size: 11px;
      }

      /* 步驟教學：玩家要照著做的東西，行距要鬆、序號要看得見 */
      ol.steps {
        margin: 8px 0 0;
        padding-left: 20px;
        color: var(--text);
        font-size: 12px;
        line-height: 1.9;
      }
      ol.steps li {
        margin-bottom: 2px;
      }
      code {
        display: inline-block;
        padding: 1px 6px;
        margin: 1px 0;
        border: 1px solid var(--rule);
        border-radius: 2px;
        background: #12151f;
        color: var(--amber);
        font:
          11.5px ui-monospace,
          Consolas,
          monospace;
        /* 玩家要把這一行複製到 Steam 去 —— 選得起來是這個元素的全部用途 */
        user-select: text;
      }

      /* --- 未實作的頁 --- */
      .todo-box {
        border: 1px dashed var(--rule);
        border-radius: 3px;
        padding: 12px 14px;
        background: rgba(0, 0, 0, 0.16);
      }
      .todo-box h3 {
        margin: 0 0 6px;
        font-family: var(--serif);
        font-size: 13.5px;
        font-weight: 600;
        color: var(--text);
        letter-spacing: 0.06em;
      }
      .todo-box ul {
        margin: 6px 0 0;
        padding-left: 18px;
        color: var(--dim);
        font-size: 12px;
        line-height: 1.75;
      }
      .badge {
        display: inline-block;
        padding: 1px 7px;
        border: 1px solid var(--rule);
        border-radius: 2px;
        font-size: 10.5px;
        letter-spacing: 0.08em;
        color: var(--grey);
        vertical-align: 2px;
        margin-left: 8px;
      }

      pre.log {
        margin: 0;
        max-height: 320px;
        overflow: auto;
        color: var(--dim);
        font:
          11px/1.6 ui-monospace,
          Consolas,
          monospace;
        white-space: pre-wrap;
        word-break: break-all;
        user-select: text;
      }

      /* --- 底部狀態列：遊戲每個畫面下緣那條 --- */
      footer {
        flex: none;
        display: flex;
        align-items: center;
        gap: 0;
        height: 28px;
        border-top: 1px solid var(--line);
        background: linear-gradient(180deg, #0d0d0d, #050505);
        font-size: 11.5px;
      }
      footer .cell {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 18px;
        margin: 0 4px;
        padding: 0 10px;
        border: 1px solid #2a2a28;
        border-radius: 2px;
        background: linear-gradient(180deg, #6a6866, #4c4a48);
        color: #16181c;
        font-weight: 600;
        white-space: nowrap;
      }
      footer .cell.grow {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        display: block;
        line-height: 16px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--grey);
        flex: none;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.5);
      }
      .dot.solo {
        background: var(--amber);
      }
      .dot.paired {
        background: var(--green);
      }
    </style>
  </head>
  <body>
    <header>
      <span class="brand">Unlight&nbsp;Companion</span>
      <!--
        ⚠ 版本要**隨時看得見**，不能只藏在「設置 › 關於」。
        自動更新是靜默的（updater.ts）—— 玩家不會知道自己被換過版，而回報問題時
        第一個要問的就是版本。藏兩層深等於每次都要教他點去哪裡看。
      -->
      <span class="ver" id="ver"></span>
      <span class="who" id="who"></span>
    </header>

    <nav class="tabs" id="tabs"></nav>

    <main>
      <aside id="side"></aside>
      <section class="body" id="content"></section>
    </main>

    <footer>
      <span class="cell"><span class="dot" id="dot"></span><span id="fProfile">—</span></span>
      <span class="cell" id="fGame">等遊戲…</span>
      <span class="cell" id="fLink">—</span>
      <span class="cell grow" id="fLast">—</span>
    </footer>

    <script>
      "use strict";

      // =====================================================================
      // 分頁結構
      //
      // ⚠ 大分頁**照里程碑分**，不是照實作狀態分。牌組／渦／獎勵／任務四個
      // 這一輪不出現（範圍決定），但加回來只要在這裡多一筆 —— 畫面的其餘部分
      // 完全不必動。
      // =====================================================================
      const TABS = [
        {
          id: "battle",
          label: "戰鬥",
          subs: [
            { id: "ready", label: "準備" },
            { id: "seconds", label: "秒數上限" },
            // ⚠ 加速的引擎與協商都做好了，**刻意不開放**。理由見 battle/speed
            // 那一頁：它動的是節奏，而節奏牽涉公平性，還沒驗夠。
            { id: "speed", label: "加速", todo: true },
            { id: "count", label: "記牌", todo: true },
            { id: "replay", label: "牌譜", todo: true },
          ],
        },
        { id: "deck", label: "牌組", subs: [{ id: "cost", label: "Cost 表", todo: true }] },
        {
          id: "vortex",
          label: "渦",
          subs: [
            { id: "vspeed", label: "速度加倍", todo: true },
            { id: "vteam", label: "推薦隊伍", todo: true },
            { id: "vrank", label: "排名與獎勵", todo: true },
          ],
        },
        { id: "bonus", label: "獎勵", subs: [{ id: "foresight", label: "未來視", todo: true }] },
        { id: "quest", label: "任務", subs: [{ id: "chest", label: "寶箱標註", todo: true }] },
        {
          id: "settings",
          label: "設置",
          subs: [
            { id: "link", label: "連線" },
            { id: "startup", label: "啟動" },
            { id: "update", label: "更新" },
            { id: "log", label: "記錄" },
            { id: "about", label: "關於" },
            // ⚠ **「配置」是整個介面裡優先級最低的一格，而且預設看不見。**
            //
            // 它管的是多開（一個視窗管一個遊戲客戶端，要管兩個就開兩份）。
            // 預設的使用者不知道有這回事，也不需要知道 —— 裝完就是一個視窗，
            // 埠、中間人埠、「開新實例」對他全都是雜訊。
            //
            // 要打開它得自己去 關於 那頁最底下勾「進階：同時管兩個遊戲客戶端」。
            // 排在關於後面是刻意的：找得到的人本來就是在找它。
            { id: "profiles", label: "配置", advanced: true },
          ],
        },
      ];

      /** 這個大分頁現在該顯示哪幾格。進階的那幾格只有玩家自己打開才出現。 */
      function subsOf(t) {
        const multi = snap?.store?.multiProfile === true;
        return t.subs.filter((s) => !s.advanced || multi);
      }

      let tab = "battle";
      let sub = "ready";
      let snap = null;
      /** 拖動滑桿時不要被推播的狀態蓋回去，不然會一直跳。 */
      let dragging = false;
      /** 正在編輯某個欄位時同理 —— 每次推播重畫會把游標踢掉。 */
      let editing = null;

      const $ = (id) => document.getElementById(id);
      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
        );

      // =====================================================================
      // 外殼
      // =====================================================================
      function renderChrome() {
        $("tabs").innerHTML = TABS.map(
          (t) =>
            `<button data-tab="${t.id}" aria-selected="${t.id === tab}">${esc(t.label)}</button>`,
        ).join("");
        const current = TABS.find((t) => t.id === tab);
        $("side").innerHTML = subsOf(current)
          .map(
            (s) =>
              `<button data-sub="${s.id}" class="${s.todo ? "todo" : ""}" aria-selected="${
                s.id === sub
              }">${esc(s.label)}</button>`,
          )
          .join("");
      }

      $("tabs").addEventListener("click", (e) => {
        const id = e.target.closest("button")?.dataset.tab;
        if (!id || id === tab) return;
        tab = id;
        sub = subsOf(TABS.find((t) => t.id === id))[0].id;
        renderChrome();
        renderBody();
      });

      $("side").addEventListener("click", (e) => {
        const id = e.target.closest("button")?.dataset.sub;
        if (!id || id === sub) return;
        sub = id;
        renderChrome();
        renderBody();
      });

      // =====================================================================
      // 狀態列
      // =====================================================================
      const LINK_TEXT = {
        // ⚠ idle 不是錯誤，是「還不需要連」。跟 offline 分開講是刻意的 ——
        // 混成同一句的話，玩家在大廳看到「沒連上中間人」會以為壞了。
        idle: "還沒進對戰",
        offline: "沒連上中間人",
        solo: "還沒配到對手",
        paired: "已配到對手",
        incompatible: "⚠ 版本不合，已退回單邊",
      };

      /**
       * 對手是 NPC 的那幾種 rule（`status.rule`）。認不出來就不特別講。
       *
       * ⚠ 這幾種模式底下**準備與秒數整組不生效**（2026-08-09），所以每一處
       * 顯示「生效中／已配對」的地方都要先問過它，否則 UI 會宣稱一個不存在的保護。
       */
      const NPC_RULE_TEXT = { quest: "任務", raid: "渦", event: "活動" };

      function renderFooter() {
        const st = snap?.status;
        const p = snap?.profile;
        // ⚠ 埠號只在多開時出現。沒開多開的人只有一個客戶端，兩個數字對他而言
        // 是「我是不是該去設定什麼」的焦慮來源，不是資訊。
        const multi = snap?.store?.multiProfile === true;
        $("ver").textContent = snap?.version ? `v${snap.version}` : "";
        $("who").textContent =
          p && multi ? `${p.name}　遊戲 :${p.port}　中間人 ${esc(p.link)}` : "";
        $("fProfile").textContent = p ? (multi ? `${p.name} :${p.port}` : p.name) : "—";
        $("dot").className =
          "dot " + (!st || !st.connected ? "" : st.link === "paired" ? "paired" : "solo");
        $("fGame").textContent = !st
          ? "啟動中…"
          : !st.connected
            ? "等遊戲…"
            : st.armed
              ? // ⚠ 打任務／渦時也是 armed，但那不是「對戰中」。講成對戰中的話，
                // 玩家會合理地期待準備與秒數在管 —— 而它們刻意沒有。
                NPC_RULE_TEXT[st.rule]
                ? `${NPC_RULE_TEXT[st.rule]}中（對手是 NPC）`
                : `對戰中${st.seat ? `（座位 ${st.seat}）` : ""}`
              : "已接上，還沒進對戰";
        $("fLink").textContent = st
          ? st.connected && !st.pvp && NPC_RULE_TEXT[st.rule]
            ? "不生效（NPC）"
            : (LINK_TEXT[st.link] ?? st.link)
          : "—";
        $("fLast").textContent = st?.error ? "⚠ " + st.error : (st?.lastSend ?? "—");
      }

      // =====================================================================
      // 內容
      // =====================================================================
      const PAGES = {};

      function renderBody() {
        const fn = PAGES[`${tab}/${sub}`];
        $("content").innerHTML = fn ? fn() : "";
      }

      function head(title, lede, badge) {
        return (
          `<h2>${esc(title)}${badge ? `<span class="badge">${esc(badge)}</span>` : ""}</h2>` +
          `<div class="rule"></div>` +
          (lede ? `<p class="lede">${lede}</p>` : "")
        );
      }

      /** 未實作的頁長什麼樣。**要講清楚卡在哪**，不是只寫「敬請期待」。 */
      function todoPage(title, why, items) {
        return (
          head(title, "", "未實作") +
          `<div class="todo-box"><h3>${esc(why)}</h3><ul>` +
          items.map((i) => `<li>${i}</li>`).join("") +
          `</ul></div>`
        );
      }

      // --- 戰鬥 › 準備 ------------------------------------------------------
      /**
       * OK 鈕的顏色。**「官方原本」是預設值**（玩家指定）。
       *
       * 琥珀色跟系統匣圖示的「已接上、還沒配對」同一個值，不是隨手挑的。
       */
      const TINTS = [
        { label: "官方原本", value: null },
        { label: "琥珀色", value: 0xffc247 },
      ];
      const hex = (n) => "#" + n.toString(16).padStart(6, "0");

      /**
       * 準備功能現在到底有沒有在管，以及**為什麼沒有**。
       *
       * ⚠ 「否」一個字是不夠的。這個功能有四種不生效的理由，而玩家能自己處理的
       * 只有其中兩種（自己關掉、對手沒開）；另外兩種（在打 NPC、還沒握手）
       * 講不清楚的話，他會以為插件壞了而去重裝。
       */
      function readyWhy(st, on) {
        if (!on) return "否（我自己關掉了）";
        if (!st?.connected) return "否（還沒接上遊戲）";
        const npc = NPC_RULE_TEXT[st.rule];
        if (npc) return `否（正在打${npc}，對手是 NPC）`;
        if (st.link !== "paired") return "否（還沒握手到對手的插件）";
        if (!st.agreed.readyEnabled) return "否（對手把準備關掉了）";
        return "是（雙方都開，已握手）";
      }

      PAGES["battle/ready"] = () => {
        const st = snap?.status;
        const on = snap?.profile.prefs.readyEnabled;
        const tint = snap?.profile.readyTint ?? null;
        const live = on && st?.pvp && st?.link === "paired" && st?.agreed.readyEnabled;
        return (
          head("準備", "按下 OK 不立刻送出，等對手也按了才同時送出。") +
          `<div class="card">
             <label class="toggle">
               <input type="checkbox" id="ready" ${on ? "checked" : ""} />
               <span><b>啟用準備功能</b>
                 <div class="hint">
                   再按一次可以取消，對手一動也會解除。<br />
                   ⚠ <b>只在跟真人對戰、而且兩邊都握手成功時生效。</b>
                   打任務、打渦（對手是 NPC）以及對手沒裝插件時完全不介入 ——
                   單方面壓著自己的 OK 只會讓自己更早承諾。
                 </div>
               </span>
             </label>
           </div>
           <div class="card">
             <div class="row"><span><b>OK 鈕的顏色</b></span></div>
             <div class="presets" id="tints">${TINTS.map(
               (t) =>
                 `<button data-tint="${t.value === null ? "" : t.value}" aria-pressed="${
                   t.value === tint
                 }">${esc(t.label)}</button>`,
             ).join("")}</div>
             <label class="toggle" style="margin-top:10px">
               <input type="color" id="tintPick" value="${hex(tint ?? 0xffc247)}" />
               <span><b>自訂顏色</b>
                 <div class="hint">
                   準備中（壓著 OK 沒送出）時把按鈕染成這個顏色。<br />
                   ⚠ 選「官方原本」＝完全不改遊戲畫面，代價是少了「插件正在管這個階段」的視覺提示 ——
                   那時要改看系統匣圖示。
                 </div>
               </span>
             </label>
           </div>
           <div class="card">
             <div class="row"><span class="dim">我這邊</span><span>${on ? "已開啟" : "已關閉"}</span></div>
             <div class="row"><span class="dim">實際生效</span>
               <span class="${live ? "good" : "warn"}">${esc(readyWhy(st, on))}</span></div>
             <div class="row"><span class="dim">剛剛送出</span><span>${esc(st?.lastSend ?? "—")}</span></div>
           </div>`
        );
      };

      // --- 戰鬥 › 秒數上限 --------------------------------------------------
      PAGES["battle/seconds"] = () => {
        const st = snap?.status;
        const prefs = snap?.profile.prefs;
        const lim = snap?.limits ?? { minSeconds: 5, maxSeconds: 30 };
        // ⚠ 「配到對手」不等於「秒數會生效」—— 打任務／渦時對面是 NPC，
        // 這條規則整組不套用（2026-08-09）。兩件事混在同一個布林裡的話，
        // 玩家會在渦裡看到「共同值 15 秒」然後等一個永遠不會來的強制結束。
        const paired = st?.link === "paired" && st?.pvp === true;
        const npcRule = NPC_RULE_TEXT[st?.rule];
        return (
          head("秒數上限", "移動階段要多長。共同值取<b>雙方比較長的那個</b>。") +
          `<div class="card">
             <div class="row"><span><b>我希望的階段長度</b></span>
               <span class="big" id="secLabel">${prefs?.phaseSeconds ?? 30}</span></div>
             <input type="range" id="seconds" min="${lim.minSeconds}" max="${lim.maxSeconds}"
                    step="1" value="${prefs?.phaseSeconds ?? 30}" />
             <div class="ticks"><span>${lim.minSeconds} 秒</span><span>${lim.maxSeconds} 秒（不縮短）</span></div>
             <div class="hint ${paired ? "" : "warn"}" id="agreed">${
               paired
                 ? `共同值 ${st.agreed.phaseSeconds} 秒（取雙方較長的那個）` +
                   (st.hazard ? `，防止壓秒出聖水生效中 → ${st.capSeconds} 秒` : "")
                 : npcRule
                   ? `正在打${npcRule} —— 對手是 NPC，秒數不縮短（這條只對真人對戰）`
                   : "還沒握手到對手 —— 秒數不會縮短（單方面縮短只是自己更早承諾）"
             }</div>
           </div>
           <div class="card">
             <div class="row"><span><b>防止壓秒出聖水</b></span
               ><span class="good">握手後強制生效</span></div>
             <div class="hint">
               手牌有聖水／聖杯，而且場上有麻痺、降低移動或<b>剩一回合的自壞</b>時，
               這個階段再短 5 秒。<br />
               ⚠ <b>這條不需要雙方同意</b>，握手成功就一起套用 ——
               它對兩邊對稱（同一個局面各砍同樣的秒數），沒有人能靠關掉它拿到優勢。<br />
               ⚠ 階段長度<b>低於 10 秒時整條不套用</b>：9 秒再砍 5 秒只剩 4 秒，
               那連把牌拖到場上都來不及。
             </div>
           </div>
             <div class="hint">
               ⚠ <b>改埠要重開那個實例才生效</b> —— 引擎綁在啟動時的埠上。<br />
               ⚠ 兩份配置<b>不能用同一個遊戲埠</b>；撞到的話第二份會開不起來（Windows 的目錄鎖擋掉）。<br />
               <b>狀態</b>只說那個埠上<b>有沒有遊戲在回話</b>。別份配置看不到「插件有沒有在管它」——
               一個視窗只管一個客戶端。<br />
               中間人<b>不用改</b>：預設就是雲端那一個，跟所有玩家共用。<br />
               　留空＝雲端（預設）　<b>local</b>＝同一台電腦上的另一個插件（開發用）
             </div>
           </div>` +
          (snap.ephemeral
            ? `<div class="card"><div class="hint warn" style="margin-top:0">
                 這個視窗是用命令列的 <b>--port ${snap.profile.port}</b> 開的臨時配置，不在清單裡。
                 改它的設定不會存下來。要留著就在上面「新增配置」。
               </div></div>`
            : "")
        );
      };

      // --- 設置 › 連線 ------------------------------------------------------
      /**
       * 「怎麼讓插件接得到遊戲」。
       *
       * ⚠ **這一段必須留在畫面上，不能只寫在 docs 裡。** CDP 的
       * `--remote-debugging-port` **只能在啟動時指定**，沒辦法對已經在跑的遊戲
       * 補掛 —— 所以在托盤還沒有「幫你開遊戲」那個功能之前，玩家一定得自己去
       * Steam 設一次。而會需要這段話的人，正是那個對著「等遊戲…」不知道下一步
       * 要做什麼的人：他不會去翻 GitHub 上的文件。
       *
       * 桌面版與網頁版**設定的地方完全不同**，所以分開講 —— 混在一起的話，
       * 網頁版的玩家會去改一個對他毫無作用的欄位，然後以為插件壞了。
       */
      function howToConnect(p) {
        const port = p?.port ?? 9333;
        if (p?.kind === "web") {
          return `<div class="card">
             <div class="row"><span><b>接不上？網頁版的埠不在 Steam 設</b></span></div>
             <div class="hint">
               網頁版的遊戲外殼只做一件事：拿 Steam 票券 → 開瀏覽器 → <b>自己關掉</b>。
               所以能掛 CDP 的是<b>那個瀏覽器</b>，不是遊戲程序。
             </div>
             <ol class="steps">
               <li>找到遊戲開瀏覽器用的那支 <code>launch-chrome.cmd</code></li>
               <li>把裡面的 <code>--remote-debugging-port=…</code> 改成
                   <code>${port}</code>（<b>檢查埠的那一行也要一起改</b>）</li>
               <li><b>把 Chrome 完全關掉</b>，再從遊戲開一次</li>
             </ol>
             <div class="hint">
               ⚠ <b>Steam 的啟動選項要清空</b> —— 網頁版的外殼不吃那個參數。<br />
               ⚠ <b>Chrome 一定要先全部關掉。</b> 同一個 <code>--user-data-dir</code>
               已經有實例在跑時，新的那次只會開一個分頁，
               <b>debug port 參數會被整個忽略</b>，埠停在舊的值 —— 而畫面上沒有任何錯誤。
             </div>
           </div>`;
        }
        return `<div class="card">
           <div class="row"><span><b>接不上？在 Steam 設一次就好</b></span></div>
           <div class="hint">
             CDP 的 <b>debug port 只能在啟動時指定</b>，沒辦法對已經在跑的遊戲補掛。
             插件<b>不會替你關掉正在打的遊戲</b>，所以這件事要你自己做一次。
           </div>
           <ol class="steps">
             <li>Steam 遊戲庫 → 對 <b>UNLIGHT:Revive</b> 按右鍵 → <b>內容…</b></li>
             <li>在「一般」分頁裡找到 <b>啟動選項</b></li>
             <li>填入這一行（<b>整行就這樣，前後不要加別的</b>）：<br />
                 <code>--remote-debugging-port=${port}</code></li>
             <li>關掉那個視窗（Steam 會自己存）</li>
             <li><b>把遊戲完全關掉，再從 Steam 開一次</b></li>
           </ol>
           <div class="hint">
             ⚠ 這裡的數字要跟上面那個<b>遊戲 CDP 埠</b>一樣。改了一邊就要改另一邊。<br />
             ⚠ <b>遊戲一開就自己關掉？</b>那不是失敗，是<b>網頁版</b>的
             <code>app.asar</code> 正在生效（約 153 KB）。它的工作就是開瀏覽器然後退出。
             要用桌面版就得換回視窗版那份（約 404 MB）。<br />
             ⚠ <b>從 VS Code 的終端機開遊戲會 exit 9</b>（<code>ELECTRON_RUN_AS_NODE</code>
             被繼承，Electron 被當成純 Node 跑）。從 Steam 開不會有這個問題。
           </div>
         </div>`;
      }

      PAGES["settings/link"] = () => {
        const st = snap?.status;
        const p = snap?.profile;
        // ⚠ 中間人的那兩行只在多開時出現。目前的中間人**只聽 127.0.0.1**，
        // 也就是只把同一台電腦上的兩份插件配成一對 —— 沒開多開的人不管把它
        // 設成幾號都不會有任何效果，露出來只會讓他以為自己漏設了什麼。
        const multi = snap?.store?.multiProfile === true;
        return (
          head("連線", "這個視窗接的是哪一個客戶端。") +
          `<div class="card">
             <div class="row"><span class="dim">客戶端</span><span>${
               p?.kind === "web" ? "網頁版" : "桌面版"
             }</span></div>
             <div class="row"><span class="dim">遊戲 CDP 埠</span><span>:${p?.port}</span></div>
             ${
               multi
                 ? `<div class="row"><span class="dim">中間人</span><span>${esc(p?.link ?? "—")}</span></div>
                    <div class="row"><span class="dim">我是中間人</span><span>${
                      st?.hosting ? "是" : "否（連到別人開的）"
                    }</span></div>
                    <div class="hint">埠在「配置」那頁改。</div>`
                 : ""
             }
           </div>
           <div class="card">
             <div class="row"><span class="dim">遊戲</span><span>${
               !st ? "啟動中…" : st.connected ? "已接上" : "等遊戲…"
             }</span></div>
             <div class="row"><span class="dim">分頁</span><span>${esc(st?.title ?? "—")}</span></div>
             <div class="row"><span class="dim">攔截已掛上</span><span>${
               st?.armed ? "是" : "否（還在大廳）"
             }</span></div>
             <div class="row"><span class="dim">側通道</span><span>${
               st ? (LINK_TEXT[st.link] ?? st.link) : "—"
             }</span></div>
             ${st?.error ? `<div class="hint warn">⚠ ${esc(st.error)}</div>` : ""}
           </div>
           ${howToConnect(p)}`
        );
      };

      // --- 設置 › 啟動 ------------------------------------------------------
      PAGES["settings/startup"] = () => {
        const s = snap?.store;
        return (
          head("啟動", "開機時要不要自己起來。") +
          `<div class="card">
             <label class="toggle">
               <input type="checkbox" id="atLogin" ${snap?.launchAtLogin ? "checked" : ""} ${
                 snap?.packaged ? "" : "disabled"
               } />
               <span><b>隨 Windows 開機啟動</b>
                 <div class="hint">${
                   snap?.packaged
                     ? "開機後自動縮到系統匣，不跳視窗。"
                     : "⚠ 開發模式下不能設 —— 會把 node_modules 裡的 electron.exe 寫進登錄檔，之後開機跳出空白視窗且很難查。打包後才可用。"
                 }</div>
               </span>
             </label>
           </div>
           <div class="card">
             <label class="toggle">
               <input type="checkbox" id="startMin" ${s?.startMinimized ? "checked" : ""} />
               <span><b>啟動時只留托盤圖示</b>
                 <div class="hint">不跳設定視窗。點托盤圖示隨時叫得出來。</div>
               </span>
             </label>
           </div>
           <div class="card">
             <div class="hint" style="margin-top:0">
               <b>怎麼讓遊戲一開插件就接上</b><br />
               在 Steam 的啟動選項裡設一次 debug port —— 步驟在
               <b>設置 › 連線</b>那一頁。設好之後每次從 Steam 開遊戲，插件都會自己接上。<br />
               ⚠ 沒設的話 debug 埠不會開，插件<b>永遠</b>接不上，而畫面上只會寫「等遊戲…」。
             </div>
           </div>`
        );
      };

      // --- 設置 › 更新 ------------------------------------------------------
      PAGES["settings/update"] = () =>
        head("更新", "") +
        `<div class="card">
           <div class="row"><span class="dim">目前版本</span><span>${esc(snap?.version ?? "—")}</span></div>
           <div class="row"><span class="dim">執行方式</span><span>${
             snap?.packaged ? "已安裝" : "開發模式（未打包）"
           }</span></div>
         </div>
         <div class="card">
           <div class="hint" style="margin-top:0">
             更新流程本身是完整的（檢查 → 下載 → 驗 SHA-256 → 暫存 → 安全時機套用），
             但<b>還沒有預設的發布來源</b>，要設環境變數 <b>ULR_UPDATE_FEED</b> 才會啟動。<br />
             ⚠ <b>套用一定不在對戰中發生。</b>「靜默」指的是不打擾，不是未經同意就重啟 ——
             協定版本一變，中間人會回 incompatible，雙方當場退回單邊模式。
             那件事發生在移動階段中間的話，玩家會看到約定秒數突然消失而不知道為什麼。
           </div>
         </div>`;

      // --- 設置 › 記錄 ------------------------------------------------------
      PAGES["settings/log"] = () =>
        head("記錄", "最近的動作。查「剛剛到底發生了什麼」用的。") +
        `<div class="card"><pre class="log" id="log">${esc(
          (snap?.log ?? []).join("\n") || "（還沒有記錄）",
        )}</pre></div>
         <div class="card">
           <div class="hint" style="margin-top:0">
             這一頁只留最近 40 行，<b>完整記錄寫在檔案裡</b>（關掉插件也還在）：<br />
             <code>${esc(snap?.logPath ?? "—")}</code><br />
             回報問題時請附上它。<b>裡面不含任何遊戲內容</b> —— 沒有手牌、沒有牌組、
             沒有對手是誰，房號也是截短的雜湊，可以直接貼。
           </div>
         </div>`;

      // --- 設置 › 關於 ------------------------------------------------------
      PAGES["settings/about"] = () =>
        head("關於", "") +
        `<div class="card">
           <div class="row"><span class="dim">ULR Companion</span><span>${esc(snap?.version ?? "—")}</span></div>
           <div class="hint">UNLIGHT:Revive 自訂 COST 規則與對戰追蹤的執行端。MIT 授權。</div>
         </div>
         <div class="card">
           <div class="hint" style="margin-top:0">
             <b>公平性立場</b><br />
             這個插件只改<b>自己客戶端的顯示</b>，伺服器收到的東西一個字都沒變。<br />
             · 不修改伺服器端技能判定，不繞過官方戰鬥規則<br />
             · 自訂 COST 是<b>自我約束</b>：雙方同意才有意義<br />
             · 不顯示也不上傳對手未揭露的手牌、牌組或任何隱藏資訊<br />
             · 會改變節奏的功能（秒數、加速）一律<b>雙方同意才生效</b>
           </div>
         </div>
         <div class="card">
           <div class="hint" style="margin-top:0">
             <b>這個插件會連到哪裡、送什麼</b><br />
             只有兩個對外連線，兩個都連到同一台伺服器（Cloudflare Workers）：<br />
             · <b>中間人</b>（對戰中）—— 送<b>雜湊過的場次編號</b>與你的四個偏好設定<br />
             · <b>檢查更新</b>（每小時一次）—— 只問「最新版是哪一版」<br />
             <br />
             <b>不會送出去的東西：</b>你的名字、Steam 帳號或 token、對手是誰、
             任何一張手牌或牌組內容、對戰結果。<br />
             伺服器只回答一個問題：<b>「這兩條連線在不在同一場對戰」</b> ——
             場次編號是 SHA-256 截斷過的，它<b>認不出那是哪一場，也認不出你是誰</b>。<br />
             <br />
             ⚠ 沒進對戰時<b>完全不連線</b>。中間人連不上時自動退回單邊模式，
             功能會少，但不會壞。
           </div>
         </div>
         <div class="card">
           <button class="gene" data-link="https://github.com/UnlightPlugin/ulr-companion">原始碼與問題回報</button>
           <button class="gene" data-link="https://ulgg.online/">ULGG</button>
         </div>
         <div class="card">
           <label class="toggle">
             <input type="checkbox" id="multi" ${snap?.store?.multiProfile ? "checked" : ""} />
             <span><b>進階：同時管兩個遊戲客戶端</b>
               <div class="hint">
                 平常不需要。<b>一個視窗管一個遊戲</b>，裝好就是這樣，不必設定任何東西。<br />
                 打開之後左邊會多一格「配置」（在這一頁下面），托盤選單會多一個「開新實例」，
                 狀態列會開始顯示埠號 —— 那些是給要同時開兩個帳號的人用的。
               </div>
             </span>
           </label>
         </div>`;

      // =====================================================================
      // 事件（委派：內容是每次重畫的，不能直接綁在元素上）
      // =====================================================================
      $("content").addEventListener("change", (e) => {
        const t = e.target;
        if (t.id === "ready") return void set({ readyEnabled: t.checked });
        if (t.id === "seconds") {
          dragging = false;
          return void set({ phaseSeconds: Number(t.value) });
        }
        if (t.id === "tintPick") {
          return void window.ulr.setReadyTint(parseInt(t.value.slice(1), 16)).then(apply);
        }
        if (t.id === "atLogin") return void options({ launchAtLogin: t.checked });
        if (t.id === "startMin") return void options({ startMinimized: t.checked });
        if (t.id === "multi") return void options({ multiProfile: t.checked });

        const row = t.closest("tr[data-id]");
        if (row && t.dataset.field) {
          editing = null;
          const field = t.dataset.field;
          const value = field === "port" ? Number(t.value) : t.value;
          const patch = { [field]: value };
          // 換客戶端種類時順手把埠帶到那一種的預設，玩家少改一個欄位。
          if (field === "kind") {
            window.ulr.profiles.defaultPort(value).then((port) => {
              window.ulr.profiles.edit(row.dataset.id, { kind: value, port }).then(apply);
            });
            return;
          }
          return void window.ulr.profiles.edit(row.dataset.id, patch).then(apply);
        }
      });

      $("content").addEventListener("input", (e) => {
        const t = e.target;
        if (t.id === "seconds") {
          dragging = true;
          $("secLabel").textContent = t.value;
        }
        // 打字時記住是誰在被編輯，重畫後要把它還原（見 renderBody 的呼叫點）
        if (t.closest("tr[data-id]")) editing = t;
      });

      $("content").addEventListener("click", (e) => {
        const btn = e.target.closest("button");
        if (!btn) return;

        if (btn.dataset.tint !== undefined) {
          const v = btn.dataset.tint === "" ? null : Number(btn.dataset.tint);
          return void window.ulr.setReadyTint(v).then(apply);
        }
        if (btn.id === "addProfile") {
          return void window.ulr.profiles.add().then(apply);
        }
        if (btn.dataset.link) {
          return void window.ulr.openExternal(btn.dataset.link);
        }

        const row = btn.closest("tr[data-id]");
        if (!row) return;
        const id = row.dataset.id;
        if (btn.dataset.act === "launch") return void window.ulr.profiles.launch(id).then(apply);
        if (btn.dataset.act === "dup") return void window.ulr.profiles.add(id).then(apply);
        if (btn.dataset.act === "del") return void window.ulr.profiles.remove(id).then(apply);
      });

      function set(prefs) {
        return window.ulr.setPrefs(prefs).then(apply);
      }
      function options(patch) {
        return window.ulr.setOptions(patch).then(apply);
      }

      // =====================================================================
      // 套用一份快照
      // =====================================================================
      function apply(next) {
        if (!next) return;
        snap = next;
        renderFooter();
        // ⚠ 拖滑桿或打字時不要重畫內容區 —— 會把游標踢掉、滑桿跳回去。
        // 狀態列照更新（它跟輸入無關，而且那才是玩家在等的資訊）。
        if (dragging || (editing && document.activeElement === editing)) return;
        editing = null;
        // ⚠ 側邊那排會隨「進階：多開」增減，所以每次套用快照都要重畫，不能只在
        // 切分頁時畫。而關掉多開的那一刻若玩家正站在「配置」上，那一格已經不
        // 存在了 —— 退回第一格，不要把他留在一片空白上。
        const visible = subsOf(TABS.find((t) => t.id === tab));
        if (!visible.some((s) => s.id === sub)) sub = visible[0].id;
        renderChrome();
        renderBody();
      }

      renderChrome();
      window.ulr.onState(apply);
      window.ulr.state().then(apply);
    </script>
  </body>
</html>
