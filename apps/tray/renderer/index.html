<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <!--
      ⚠ CSP 這裡是**必要的**，不是加好玩的。這個視窗的內容全部是我們自己寫死的，
      所以連線來源可以鎖到只剩 'self'。§12 的原則：邊界擋一次，之後都安全。

      ⚠ **外觀是純 CSS 重現的，一張遊戲圖檔都沒有。** 色票是 2026-08-07 從跑著的
      客戶端量出來的（分頁 tab_chara/library_btn_*、底 option_bg、面板 edit_bg），
      不是憑印象調的。這個選擇讓上面那行 `default-src 'none'` 成立 ——
      要是改成載入遊戲的圖，就得放寬 img-src，而且離線時整個外觀會消失。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>ULR Companion</title>
    <style>
      :root {
        /* --- 從客戶端量到的色票（見上方註解） --- */
        --tab-off: #622b2f; /* edit/tab_chara.png frame 0 */
        --tab-off-lo: #4a2024;
        --tab-hover: #873136; /* frame 1 */
        --tab-on: #d5d5d5; /* 選中是淺灰，不是更亮的紅 */
        --tab-on-lo: #b4b4b4;
        /*
         * ⚠ 遊戲原本的分頁字幾乎是黑的（量到的暗部接近 #000），靠浮雕撐可讀性。
         * 這裡刻意調亮一階：遊戲的分頁是大圖示尺寸，這個視窗是 13.5px 的文字，
         * 照抄會變成看不清楚要點哪裡。像它，但不要像到不能用。
         */
        --ink-off: #d8b6b8;
        --ink-on: #241013;

        --bg: #1e2336; /* option_bg 的主色 */
        --bg-lo: #161a29;
        --panel: #272c3c;
        --panel-hi: #313749;
        --line: #0c0e16;
        --rule: #434a60;

        --text: #dfe2ea;
        --dim: #939bb0;
        --amber: #ffc247;
        --green: #4cc96a;
        --red: #b8434b;
        --grey: #7d8496;

        --serif: "Noto Serif TC", "Source Han Serif TC", "MS Mincho", "PMingLiU", Georgia, serif;
        --sans: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg-lo);
        color: var(--text);
        font: 13px/1.6 var(--sans);
        user-select: none;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* --- 頂條：遊戲每個畫面上緣那條直紋 --- */
      header {
        flex: none;
        height: 34px;
        display: flex;
        align-items: center;
        padding: 0 12px;
        border-bottom: 1px solid var(--line);
        background:
          repeating-linear-gradient(90deg, #2b3a42 0 3px, #26333a 3px 6px, #1d282e 6px 9px), #26282a;
      }
      header .brand {
        font-family: var(--serif);
        font-size: 13px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #b9c6cc;
        text-shadow: 0 1px 0 #000;
      }
      header .ver {
        margin-left: 10px;
        padding: 1px 7px;
        border: 1px solid #3a4a52;
        border-radius: 2px;
        font-size: 10.5px;
        letter-spacing: 0.06em;
        color: #8fa0a8;
      }
      header .who {
        margin-left: auto;
        font-size: 11.5px;
        color: #8fa0a8;
        letter-spacing: 0.04em;
      }

      /* --- 大分頁列 --- */
      nav.tabs {
        flex: none;
        display: flex;
        gap: 2px;
        padding: 6px 8px 0;
        background: var(--bg-lo);
        border-bottom: 1px solid var(--line);
      }
      nav.tabs button {
        appearance: none;
        min-width: 92px;
        padding: 6px 16px 5px;
        border: 1px solid var(--line);
        border-bottom: none;
        border-radius: 2px 2px 0 0;
        font-family: var(--serif);
        font-size: 13.5px;
        letter-spacing: 0.14em;
        cursor: pointer;
        color: var(--ink-off);
        background: linear-gradient(180deg, var(--tab-off) 0%, var(--tab-off-lo) 100%);
        /* 遊戲的分頁字是浮雕的，靠一暗一亮兩層陰影做出來 */
        text-shadow:
          0 1px 1px rgba(0, 0, 0, 0.75),
          0 -1px 0 rgba(0, 0, 0, 0.35);
      }
      nav.tabs button:hover {
        background: linear-gradient(180deg, var(--tab-hover) 0%, #6e282d 100%);
        color: #f4e2e3;
      }
      nav.tabs button[aria-selected="true"] {
        background: linear-gradient(180deg, var(--tab-on) 0%, var(--tab-on-lo) 100%);
        color: var(--ink-on);
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.6);
      }

      /* --- 主體：左側子分頁 + 內容 --- */
      main {
        flex: 1;
        display: flex;
        min-height: 0;
        background:
          radial-gradient(circle at 1px 1px, rgba(255, 255, 255, 0.028) 1px, transparent 1px) 0 0 /
            4px 4px,
          linear-gradient(180deg, var(--bg) 0%, var(--bg-lo) 100%);
      }

      aside {
        flex: none;
        width: 116px;
        padding: 10px 0;
        border-right: 1px solid var(--line);
        background: linear-gradient(90deg, rgba(0, 0, 0, 0.28), rgba(0, 0, 0, 0.06));
        overflow-y: auto;
      }
      aside button {
        appearance: none;
        display: block;
        width: 100%;
        padding: 7px 10px 7px 16px;
        border: none;
        border-left: 3px solid transparent;
        background: none;
        color: var(--dim);
        font-family: var(--serif);
        font-size: 13px;
        letter-spacing: 0.1em;
        text-align: left;
        cursor: pointer;
      }
      aside button:hover {
        color: var(--text);
        background: rgba(135, 49, 54, 0.22);
      }
      aside button[aria-selected="true"] {
        color: #fff;
        border-left-color: var(--red);
        background: linear-gradient(90deg, rgba(184, 67, 75, 0.36), transparent);
      }
      /* 未實作的子分頁：看得見，但一眼看得出還不能用 */
      aside button.todo::after {
        content: "…";
        color: var(--grey);
        margin-left: 4px;
      }

      section.body {
        flex: 1;
        padding: 14px 16px;
        overflow-y: auto;
        min-width: 0;
      }
      h2 {
        margin: 0 0 3px;
        font-family: var(--serif);
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0.08em;
      }
      /* 遊戲 Library 那條帶小飾釘的分隔線 */
      .rule {
        height: 1px;
        margin: 9px 0 13px;
        background: linear-gradient(90deg, var(--rule), rgba(67, 74, 96, 0.1));
        position: relative;
      }
      .rule::before {
        content: "";
        position: absolute;
        left: -3px;
        top: -2.5px;
        width: 6px;
        height: 6px;
        background: var(--rule);
        transform: rotate(45deg);
      }
      .lede {
        color: var(--dim);
        font-size: 12px;
        margin: 0;
      }

      .card {
        background: linear-gradient(180deg, var(--panel-hi), var(--panel));
        border: 1px solid var(--line);
        border-radius: 3px;
        padding: 11px 13px;
        margin-bottom: 10px;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.045);
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 10px;
      }
      .row + .row {
        margin-top: 5px;
      }
      .dim {
        color: var(--dim);
      }
      .big {
        font-family: var(--serif);
        font-size: 24px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .hint {
        color: var(--dim);
        font-size: 11.5px;
        margin-top: 6px;
        line-height: 1.65;
      }
      .warn {
        color: var(--amber);
      }
      .bad {
        color: var(--red);
      }
      .good {
        color: var(--green);
      }

      label.toggle {
        display: flex;
        align-items: flex-start;
        gap: 9px;
        cursor: pointer;
      }
      label.toggle input {
        margin: 4px 0 0;
        flex: none;
        accent-color: var(--red);
      }
      label.toggle b {
        font-family: var(--serif);
        letter-spacing: 0.05em;
      }

      input[type="range"] {
        width: 100%;
        margin: 10px 0 2px;
        accent-color: var(--amber);
      }
      .ticks {
        display: flex;
        justify-content: space-between;
        color: var(--dim);
        font-size: 11px;
      }

      input[type="text"],
      input[type="number"],
      select {
        background: #12151f;
        border: 1px solid var(--line);
        border-radius: 2px;
        color: var(--text);
        font: 12.5px var(--sans);
        padding: 4px 7px;
      }
      input:focus,
      select:focus {
        outline: 1px solid var(--red);
      }
      select option {
        background: #12151f;
      }

      /* 遊戲的通用按鈕（btn_gene）：淺灰漸層、按下去描紅邊 */
      button.gene {
        appearance: none;
        padding: 4px 12px;
        border: 1px solid #2a2c31;
        border-radius: 2px;
        background: linear-gradient(180deg, #cfd4da 0%, #9aa1ab 48%, #cdd2d8 52%, #eef1f4 100%);
        color: #23262c;
        font: 12px var(--sans);
        cursor: pointer;
      }
      button.gene:hover {
        border-color: var(--red);
      }
      button.gene:disabled {
        opacity: 0.4;
        cursor: default;
        border-color: #2a2c31;
      }
      button.gene.danger:hover {
        border-color: var(--red);
        color: #7a1f26;
      }

      /* =================================================================
         編輯 COST
         =================================================================
         ⚠ **這一頁不准出現卡片編號。** `cc001_01` 對玩家沒有意義，名冊
         （catalog）存在的唯一理由就是把它換成「艾伯李斯特 L1」。編號只留在
         `data-k`（給程式用）與 title（滑過去才看得到，用來回報問題）。 */

      /* 四張表的分頁。做成遊戲那排紅色頁籤的縮小版。 */
      .etabs {
        display: flex;
        gap: 2px;
        margin-bottom: 9px;
      }
      .etabs button {
        appearance: none;
        flex: 1;
        padding: 5px 4px;
        border: 1px solid var(--line);
        border-bottom: none;
        border-radius: 2px 2px 0 0;
        background: linear-gradient(180deg, var(--tab-off), var(--tab-off-lo));
        color: var(--ink-off);
        font-family: var(--serif);
        font-size: 12.5px;
        letter-spacing: 0.08em;
        cursor: pointer;
      }
      .etabs button:hover {
        background: var(--tab-hover);
        color: #fff;
      }
      .etabs button[aria-selected="true"] {
        background: linear-gradient(180deg, var(--tab-on), var(--tab-on-lo));
        color: var(--ink-on);
      }
      .etabs .n {
        margin-left: 5px;
        font-size: 10.5px;
        opacity: 0.7;
      }

      /* 一排卡：左邊是**名字**，右邊是那一排的格子。 */
      .erow {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 2px 0;
      }
      .erow + .erow {
        border-top: 1px solid rgba(67, 74, 96, 0.35);
      }
      .ename {
        flex: none;
        width: 6.6em;
        font-family: var(--serif);
        font-size: 12px;
        letter-spacing: 0.03em;
        color: var(--text);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* 欄頭（L1 L2 … R5）。**只印一次**，不要每一排都重複 —— 70 排的話那會
         變成畫面上最吵的東西，而它其實是固定不變的。 */
      .ehead {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        position: sticky;
        top: -14px;
        z-index: 2;
        padding: 4px 0 3px;
        margin-bottom: 2px;
        background: var(--panel);
        border-bottom: 1px solid var(--rule);
      }
      .ehead .ename {
        color: var(--dim);
        font-size: 11px;
      }
      .egrid {
        flex: 1;
        display: grid;
        gap: 3px;
        min-width: 0;
      }
      .egrid.c10 {
        grid-template-columns: repeat(10, minmax(0, 1fr));
      }
      .egrid.c9 {
        grid-template-columns: repeat(9, minmax(0, 1fr));
      }
      .egrid.c5 {
        grid-template-columns: repeat(5, minmax(0, 1fr));
      }
      .egrid.c3 {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .egrid .slot {
        font-size: 10px;
        color: var(--dim);
        text-align: center;
        letter-spacing: 0.04em;
      }

      /*
       * 一格 = 名字（索引型的表才有）＋ 數字欄位。
       *
       * 直排 + 數字欄位 `margin-top:auto`：同一排的格子高度本來就會被格線拉齊，
       * 把欄位頂到底部就等於**所有數字欄位對齊同一條線**，不必給每個文字區塊
       * 都寫死高度。名字幾行、有沒有效果說明都不影響。
       */
      .ecell {
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .ecell input {
        margin-top: auto;
      }
      .ecell .cn {
        display: block;
        font-size: 10px;
        line-height: 1.25;
        height: 2.5em;
        color: var(--dim);
        overflow: hidden;
        margin-bottom: 2px;
      }

      /*
       * 事件卡的插槽顏色。
       *
       * 一張事件卡只放得進角色卡上**同色**的事件插槽（灰色是萬用），所以顏色跟
       * 價格是同一件事的兩面 —— 一張紅卡再便宜，紅槽少的角色也帶不動。編 COST
       * 的時候看不到顏色，等於在沒有一半資訊的情況下定價。
       *
       * 色票是量遊戲自己的 `event_slot` 貼圖來的（2026-08-16，8 個 frame）。
       * 直接寫死而不是從名冊帶下來：貼圖不會因為玩家的規則檔而變，而把
       * 「顏色長什麼樣」放進快取只會讓舊快取多一種過期方式。
       */
      .ecell.ev {
        border-left: 3px solid var(--slot, transparent);
        padding-left: 4px;
      }
      /*
       * 效果說明。名字說得出效果的那些卡根本不會有這個元素（見 edEventEffect）。
       *
       * ⚠ **要讓它折兩行。** 一排九格 ≈ 65px，一行只放得下七個字，而
       * 「出牌後從卡組抽1張卡」被切成「出牌後從卡組…」等於沒寫。兩行放得下
       * 大部分，剩下的長句滑過去看 title。
       */
      .ecell .fx {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        font-size: 9.5px;
        line-height: 1.2;
        color: var(--grey);
        overflow: hidden;
        margin: -1px 0 2px;
      }

      /* 顏色圖例。事件卡的插槽色、編輯 COST 的價差色階都用這一條。 */
      .evlegend {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 10px;
        margin-bottom: 2px;
        font-size: 11px;
        color: var(--dim);
      }
      .evlegend b {
        display: inline-block;
        width: 8px;
        height: 12px;
        border-radius: 1px;
        vertical-align: -2px;
        margin-right: 4px;
        border: 1px solid rgba(0, 0, 0, 0.5);
      }
      .ecell input {
        width: 100%;
        padding: 2px 3px;
        font-size: 11.5px;
        text-align: center;
        font-variant-numeric: tabular-nums;
        background: #12151f;
        border: 1px solid var(--line);
        border-radius: 2px;
        color: var(--text);
      }
      /*
       * 改過的格子要一眼看得出來 —— 而且要看得出**改了多少、往哪邊改**。
       *
       * ⚠ 顏色帶的是「跟遊戲原價差幾 C」，不是「我剛剛動過它」。一份自訂規則
       * 本來就有一堆格子跟原價不同（那才是重點），玩家在意的是「這張我調貴了
       * 多少」。所以色階是**兩條相反方向的坡**：
       *
       *   便宜 5C ←──── 藍 ── 青 ──┤原價├── 琥珀 ── 紅 ────→ 貴 5C
       *
       * 兩條走**不同色系**（冷／暖）而不是同一個顏色的深淺 —— 差一階的深淺
       * 在 11.5px 的小格子上根本分不出來，但冷暖一眼就知道是哪一邊。
       * 冷暖也是紅綠色盲仍然分得開的一組（差在藍黃軸上）。
       *
       * 每一階的三個顏色掛在 `--dbg`/`--dfg`/`--dln` 上，下面 `.dirty` 一條
       * 規則統一取用；沒有階級（名冊查不到原價）時退回原本那身琥珀。
       */
      .ecell input.dirty {
        border-color: var(--dln, var(--amber));
        color: var(--dfg, var(--amber));
        background: var(--dbg, rgba(255, 194, 71, 0.08));
      }
      /* 貴了：琥珀 → 紅。第 5 階是**上限**，再貴也是這個顏色。 */
      .up1 {
        --dbg: rgba(255, 194, 71, 0.07);
        --dfg: #e3cda2;
        --dln: rgba(255, 194, 71, 0.35);
      }
      .up2 {
        --dbg: rgba(255, 186, 71, 0.13);
        --dfg: #ffca6a;
        --dln: rgba(255, 186, 71, 0.5);
      }
      .up3 {
        --dbg: rgba(255, 150, 55, 0.2);
        --dfg: #ffb057;
        --dln: rgba(255, 150, 55, 0.62);
      }
      .up4 {
        --dbg: rgba(250, 110, 55, 0.27);
        --dfg: #ff9153;
        --dln: rgba(250, 110, 55, 0.75);
      }
      .up5 {
        --dbg: rgba(232, 70, 60, 0.34);
        --dfg: #ff7a70;
        --dln: rgba(232, 70, 60, 0.9);
      }
      /* 便宜了：青 → 藍。 */
      .dn1 {
        --dbg: rgba(110, 205, 225, 0.07);
        --dfg: #a6cfda;
        --dln: rgba(110, 205, 225, 0.35);
      }
      .dn2 {
        --dbg: rgba(90, 190, 230, 0.13);
        --dfg: #7fd0ee;
        --dln: rgba(90, 190, 230, 0.5);
      }
      .dn3 {
        --dbg: rgba(75, 165, 235, 0.2);
        --dfg: #63b6f5;
        --dln: rgba(75, 165, 235, 0.62);
      }
      .dn4 {
        --dbg: rgba(75, 130, 240, 0.27);
        --dfg: #6e9bff;
        --dln: rgba(75, 130, 240, 0.75);
      }
      .dn5 {
        --dbg: rgba(95, 100, 240, 0.34);
        --dfg: #8b8dff;
        --dln: rgba(95, 100, 240, 0.9);
      }
      /*
       * 圖例的小色塊：拿那一階的**字色**（實色）。格子裡真正的填色是 `--dbg`，
       * 但那是給整格用的淡底 —— 畫在 8×12 的小方塊上會淡到看不見。
       *
       * 五塊之間留 2px：它們是**五個階級**，不是一條連續的漸層，中間斷開比較
       * 接近實際看到的東西。
       */
      .evlegend b.lv {
        background: var(--dfg);
        margin-right: 2px;
      }
      /*
       * 不合最小單位。
       *
       * ⚠ **一定要跟價差色階疊得起來，不能取代它。** 一格可以既「比原版貴 3C」
       * 又「不是 0.5 的倍數」，而作者兩件事都要看得到。色階吃的是 border-color
       * 與 background，所以這裡改吃 `outline` + 虛線描邊 —— 兩層畫在不同的地方，
       * 誰也蓋不掉誰。
       *
       * 洋紅是刻意的：整個色階是「冷←→暖」那條軸（藍青／琥珀紅），洋紅在那條
       * 軸之外，所以它不會被讀成「更貴的第六階」。
       */
      .ecell input.offunit {
        outline: 1px dashed #ff5cc8;
        outline-offset: -2px;
      }
      /*
       * 官方還沒出的卡。
       *
       * 藏起來時留一個**空格子**（`.nocard`）而不是把 `<div>` 拿掉 —— 版面是
       * 固定十欄的格線，而每位角色缺的等級不一樣，真的拿掉的話每一列會各自
       * 往左縮，`L1…R5` 的欄頭就對不上任何一列。
       *
       * 一條很淡的斜線：純空白會被讀成「這裡有一格但沒載入」，畫一筆才看得出
       * 是刻意留白的。
       */
      .ecell .nocard {
        height: 100%;
        min-height: 18px;
        border: 1px dashed rgba(255, 255, 255, 0.07);
        border-radius: 2px;
        background: repeating-linear-gradient(
          -45deg,
          transparent 0 4px,
          rgba(255, 255, 255, 0.045) 4px 5px
        );
      }
      /* 選擇顯示它們時：淡掉，但仍然改得動（作者可能想預先定價）。 */
      .ecell input.lockedcard {
        opacity: 0.45;
        font-style: italic;
      }
      .ecell input:focus {
        outline: 1px solid var(--red);
      }

      /* 怪物：一排放三種，每種自己一小塊（M1~M3） */
      .mrow {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        padding: 3px 0;
      }
      .mrow + .mrow {
        border-top: 1px solid rgba(67, 74, 96, 0.35);
      }
      .mblock .mname {
        font-family: var(--serif);
        font-size: 11.5px;
        color: var(--text);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        margin-bottom: 2px;
      }

      /* 群組標題：裝備的「這是誰的專武」、事件卡的族群 */
      .egroup {
        margin: 12px 0 5px;
        font-family: var(--serif);
        font-size: 12px;
        letter-spacing: 0.06em;
        color: var(--amber);
        border-bottom: 1px solid rgba(255, 194, 71, 0.22);
        padding-bottom: 2px;
      }
      .egroup .sub {
        color: var(--dim);
        font-size: 11px;
        letter-spacing: 0;
        margin-left: 6px;
      }

      /* 官方 COST 檔位的快速鍵。刻意做小 —— 它們是捷徑，不是主要的輸入方式，
         真正的值在旁邊那個數字欄位裡（自訂 COST 想填幾就填幾）。 */
      button.tier {
        appearance: none;
        margin-left: 4px;
        padding: 3px 8px;
        border: 1px solid var(--line);
        border-radius: 2px;
        background: #12151f;
        color: var(--dim);
        font: 11.5px var(--sans);
        cursor: pointer;
      }
      button.tier:hover {
        border-color: var(--red);
        color: var(--text);
      }
      /*
       * 選中的那一顆。配對那邊的檔位快速鍵**沒有**這個狀態（按了是把數字填進
       * 隔壁的輸入框，不是一個持續的選擇），編輯 COST 的幅度**有** —— 它就是
       * 現在的設定值，看不出「現在是哪一個」的話玩家只能靠隔壁那格數字猜。
       */
      button.tier[aria-selected="true"] {
        border-color: var(--amber);
        color: var(--amber);
        background: rgba(255, 194, 71, 0.1);
      }

      /* --- 編輯規則：一段壓 C 區間一排 --- */
      .bandrow {
        display: grid;
        grid-template-columns: 1.8em 2.6em 5.5em 1.2em 5.5em 2.6em 5.5em 1fr;
        align-items: center;
        gap: 6px;
        margin-top: 5px;
      }
      .bandrow input {
        width: 100%;
        padding: 3px 4px;
        font-size: 12px;
        text-align: center;
        font-variant-numeric: tabular-nums;
      }
      .bandrow .lbl {
        font-size: 11px;
        color: var(--dim);
        text-align: center;
      }
      .bandrow button {
        justify-self: start;
        padding: 1px 7px;
      }

      .presets {
        display: flex;
        gap: 6px;
        margin: 10px 0 2px;
        flex-wrap: wrap;
      }
      .presets button {
        appearance: none;
        padding: 5px 13px;
        border: 1px solid var(--line);
        border-radius: 2px;
        background: linear-gradient(180deg, var(--tab-off), var(--tab-off-lo));
        color: #e8d5d6;
        font-family: var(--serif);
        font-size: 13px;
        letter-spacing: 0.06em;
        cursor: pointer;
      }
      .presets button:hover {
        background: linear-gradient(180deg, var(--tab-hover), #6e282d);
      }
      .presets button[aria-pressed="true"] {
        background: linear-gradient(180deg, var(--tab-on), var(--tab-on-lo));
        color: var(--ink-on);
      }

      /* --- 配置清單 --- */
      table.profiles {
        width: 100%;
        border-collapse: collapse;
        font-size: 12.5px;
      }
      table.profiles th {
        text-align: left;
        font-weight: 500;
        color: var(--dim);
        font-size: 11.5px;
        padding: 0 6px 5px;
        border-bottom: 1px solid var(--rule);
      }
      table.profiles td {
        padding: 5px 6px;
        border-bottom: 1px solid rgba(67, 74, 96, 0.35);
        vertical-align: middle;
      }
      table.profiles tr.self td {
        background: rgba(184, 67, 75, 0.13);
      }
      table.profiles input[type="text"] {
        width: 100%;
      }
      table.profiles input[type="number"] {
        width: 72px;
      }
      /* 中間人那一欄是一整個網址（36 字元），不再是四位數的埠。
         窄於這個寬度會被切成 `wss://ulr-link.lldavuull.work`，而看不到尾巴的
         網址沒有辦法用眼睛核對 —— 那正是這一格唯一的用途。 */
      table.profiles td:nth-child(5) {
        min-width: 250px;
      }
      .self-mark {
        color: var(--amber);
        font-size: 11px;
      }

      /* 步驟教學：玩家要照著做的東西，行距要鬆、序號要看得見 */
      ol.steps {
        margin: 8px 0 0;
        padding-left: 20px;
        color: var(--text);
        font-size: 12px;
        line-height: 1.9;
      }
      ol.steps li {
        margin-bottom: 2px;
      }
      code {
        display: inline-block;
        padding: 1px 6px;
        margin: 1px 0;
        border: 1px solid var(--rule);
        border-radius: 2px;
        background: #12151f;
        color: var(--amber);
        font:
          11.5px ui-monospace,
          Consolas,
          monospace;
        /* 玩家要把這一行複製到 Steam 去 —— 選得起來是這個元素的全部用途 */
        user-select: text;
      }

      /* --- 未實作的頁 --- */
      .todo-box {
        border: 1px dashed var(--rule);
        border-radius: 3px;
        padding: 12px 14px;
        background: rgba(0, 0, 0, 0.16);
      }
      .todo-box h3 {
        margin: 0 0 6px;
        font-family: var(--serif);
        font-size: 13.5px;
        font-weight: 600;
        color: var(--text);
        letter-spacing: 0.06em;
      }
      .todo-box ul {
        margin: 6px 0 0;
        padding-left: 18px;
        color: var(--dim);
        font-size: 12px;
        line-height: 1.75;
      }
      .badge {
        display: inline-block;
        padding: 1px 7px;
        border: 1px solid var(--rule);
        border-radius: 2px;
        font-size: 10.5px;
        letter-spacing: 0.08em;
        color: var(--grey);
        vertical-align: 2px;
        margin-left: 8px;
      }

      pre.log {
        margin: 0;
        max-height: 320px;
        overflow: auto;
        color: var(--dim);
        font:
          11px/1.6 ui-monospace,
          Consolas,
          monospace;
        white-space: pre-wrap;
        word-break: break-all;
        user-select: text;
      }

      /* --- 底部狀態列：遊戲每個畫面下緣那條 --- */
      footer {
        flex: none;
        display: flex;
        align-items: center;
        gap: 0;
        height: 28px;
        border-top: 1px solid var(--line);
        background: linear-gradient(180deg, #0d0d0d, #050505);
        font-size: 11.5px;
      }
      footer .cell {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 18px;
        margin: 0 4px;
        padding: 0 10px;
        border: 1px solid #2a2a28;
        border-radius: 2px;
        background: linear-gradient(180deg, #6a6866, #4c4a48);
        color: #16181c;
        font-weight: 600;
        white-space: nowrap;
      }
      footer .cell.grow {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        display: block;
        line-height: 16px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--grey);
        flex: none;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.5);
      }
      .dot.solo {
        background: var(--amber);
      }
      .dot.paired {
        background: var(--green);
      }
    </style>
  </head>
  <body>
    <header>
      <span class="brand">Unlight&nbsp;Companion</span>
      <!--
        ⚠ 版本要**隨時看得見**，不能只藏在「設置 › 關於」。
        自動更新是靜默的（updater.ts）—— 玩家不會知道自己被換過版，而回報問題時
        第一個要問的就是版本。藏兩層深等於每次都要教他點去哪裡看。
      -->
      <span class="ver" id="ver"></span>
      <span class="who" id="who"></span>
    </header>

    <nav class="tabs" id="tabs"></nav>

    <main>
      <aside id="side"></aside>
      <section class="body" id="content"></section>
    </main>

    <footer>
      <span class="cell"><span class="dot" id="dot"></span><span id="fProfile">—</span></span>
      <span class="cell" id="fGame">等遊戲…</span>
      <span class="cell" id="fLink">—</span>
      <span class="cell grow" id="fLast">—</span>
    </footer>

    <script>
      "use strict";

      // =====================================================================
      // 分頁結構
      //
      // ⚠ 大分頁**照里程碑分**，不是照實作狀態分。牌組／渦／獎勵／任務四個
      // 這一輪不出現（範圍決定），但加回來只要在這裡多一筆 —— 畫面的其餘部分
      // 完全不必動。
      // =====================================================================
      const TABS = [
        {
          id: "battle",
          label: "戰鬥",
          subs: [
            { id: "ready", label: "準備" },
            { id: "seconds", label: "秒數上限" },
            // ⚠ 加速的引擎與協商都做好了，**刻意不開放**。理由見 battle/speed
            // 那一頁：它動的是節奏，而節奏牽涉公平性，還沒驗夠。
            {
              id: "speed",
              label: "加速",
              todo: true,
              why: "引擎與協商都做好了，刻意還沒開放。",
              items: [
                "它動的是<b>對戰節奏</b>，而節奏牽涉公平性 —— 還沒驗夠。",
                "⚠ 而且效果有限：<b>戰鬥長度是伺服器排程的</b>，加速客戶端動畫改不動伺服器那一端的節拍。",
                "開放的前提是兩邊協商一致，單邊加速沒有意義。",
              ],
            },
            { id: "count", label: "記牌", todo: true },
            { id: "replay", label: "牌譜", todo: true },
          ],
        },
        {
          id: "deck",
          label: "牌組",
          subs: [
            // ⚠ **自動配對排第一。** 它是玩家最常用的功能 —— 規則選一次就不太
            // 會再動，配對是每天要按的。放在編輯那幾頁後面等於天天多繞一格。
            { id: "match", label: "自動配對" },
            { id: "cost", label: "Cost 表" },
            // 編輯的三頁排在 Cost 表後面，那是實際的動線：先選一份規則
            // （Cost 表）→ 改它 → 拿去配對。
            //
            // ⚠ 三頁改的是**同一個檔案的三半**，分開是因為形狀差太多：
            // 1186 個數字格 / 十幾段區間 / 一疊文字欄位。
            { id: "costedit", label: "編輯 COST" },
            { id: "ruleedit", label: "編輯規則" },
            { id: "ruledesc", label: "編輯描述" },
            { id: "hidden", label: "隱藏地圖" },
          ],
        },
        {
          id: "vortex",
          label: "渦",
          subs: [
            { id: "vspeed", label: "速度加倍", todo: true },
            { id: "vteam", label: "推薦隊伍", todo: true },
            { id: "vrank", label: "排名與獎勵", todo: true },
          ],
        },
        { id: "bonus", label: "獎勵", subs: [{ id: "foresight", label: "未來視", todo: true }] },
        { id: "quest", label: "任務", subs: [{ id: "chest", label: "寶箱標註", todo: true }] },
        {
          id: "settings",
          label: "設置",
          subs: [
            { id: "link", label: "連線" },
            { id: "startup", label: "啟動" },
            { id: "update", label: "更新" },
            { id: "log", label: "記錄" },
            { id: "about", label: "關於" },
            // ⚠ **「配置」是整個介面裡優先級最低的一格，而且預設看不見。**
            //
            // 它管的是多開（一個視窗管一個遊戲客戶端，要管兩個就開兩份）。
            // 預設的使用者不知道有這回事，也不需要知道 —— 裝完就是一個視窗，
            // 埠、中間人埠、「開新實例」對他全都是雜訊。
            //
            // 要打開它得自己去 關於 那頁最底下勾「進階：同時管兩個遊戲客戶端」。
            // 排在關於後面是刻意的：找得到的人本來就是在找它。
            { id: "profiles", label: "配置", advanced: true },
          ],
        },
      ];

      /** 這個大分頁現在該顯示哪幾格。進階的那幾格只有玩家自己打開才出現。 */
      function subsOf(t) {
        const multi = snap?.store?.multiProfile === true;
        return t.subs.filter((s) => !s.advanced || multi);
      }

      let tab = "battle";
      let sub = "ready";
      let snap = null;
      /** 拖動滑桿時不要被推播的狀態蓋回去，不然會一直跳。 */
      let dragging = false;
      /** 正在編輯某個欄位時同理 —— 每次推播重畫會把游標踢掉。 */
      let editing = null;

      const $ = (id) => document.getElementById(id);

      /**
       * 使用者正在內容區的某個欄位裡打字／挑選項嗎。
       *
       * ⚠⚠ **重畫是換掉 `#content` 的 innerHTML** —— 正在打字的那個輸入框會
       * 連同游標、選取範圍、還有打到一半的字一起消失。所以每一條會重畫的路徑
       * 都要先問這一句。
       *
       * 這支存在的理由是一個實際的 bug：配對頁的輪詢有擋（它自己查
       * `document.activeElement`），但**狀態推播那條沒有** —— 而推播是連線
       * 心跳、對戰狀態、記錄檔每幾秒就來一次的東西。症狀是「房名打到一半游標
       * 就不見了」，而玩家完全不會把它跟「插件在更新狀態」連在一起。
       *
       * ⚠ 用 `document.activeElement` 而不是自己記「誰在被編輯」（原本那個
       * `editing` 變數）：每個頁面都要記得設它，而漏掉的頁面**看起來完全正常**
       * 直到有人在上面打字。問瀏覽器就不會漏。
       */
      function isEditing() {
        const el = document.activeElement;
        if (!el || typeof el.closest !== "function" || !el.closest("#content")) return false;
        return /^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName) || el.isContentEditable === true;
      }

      /**
       * 打字時錯過的重畫，等焦點離開再補一次。
       *
       * ⚠ 沒有這一段的話畫面會**停在玩家開始打字的那一刻** —— 配對狀態、房間
       * 清單、連線狀態全部凍在那裡，而他完全不知道那是因為自己游標還在輸入框裡。
       *
       * ⚠ 只掛一個（`pendingCatchUp` 這道閘）：每打一個字掛一個 listener 的話，
       * 打完二十個字就會連續重畫二十次。
       */
      let pendingCatchUp = false;
      function scheduleCatchUp() {
        if (pendingCatchUp) return;
        pendingCatchUp = true;
        document.addEventListener(
          "focusout",
          () => {
            pendingCatchUp = false;
            // ⚠ 要等一拍。`focusout` 時焦點還沒落到下一個元素上，立刻重畫的話
            // 「從房名 tab 到地點」會被判定成沒人在編輯，於是把玩家正要用的
            // 那個下拉選單也換掉。
            setTimeout(() => {
              if (isEditing() || dragging) return;
              editing = null;
              renderBody();
            }, 150);
          },
          { once: true },
        );
      }
      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
        );

      // =====================================================================
      // 外殼
      // =====================================================================
      function renderChrome() {
        $("tabs").innerHTML = TABS.map(
          (t) =>
            `<button data-tab="${t.id}" aria-selected="${t.id === tab}">${esc(t.label)}</button>`,
        ).join("");
        const current = TABS.find((t) => t.id === tab);
        $("side").innerHTML = subsOf(current)
          .map(
            (s) =>
              `<button data-sub="${s.id}" class="${s.todo ? "todo" : ""}" aria-selected="${
                s.id === sub
              }">${esc(s.label)}</button>`,
          )
          .join("");
      }

      $("tabs").addEventListener("click", (e) => {
        const id = e.target.closest("button")?.dataset.tab;
        if (!id || id === tab) return;
        tab = id;
        sub = subsOf(TABS.find((t) => t.id === id))[0].id;
        renderChrome();
        renderBody();
      });

      $("side").addEventListener("click", (e) => {
        const id = e.target.closest("button")?.dataset.sub;
        if (!id || id === sub) return;
        sub = id;
        renderChrome();
        renderBody();
      });

      // =====================================================================
      // 狀態列
      // =====================================================================
      const LINK_TEXT = {
        // ⚠ idle 不是錯誤，是「還不需要連」。跟 offline 分開講是刻意的 ——
        // 混成同一句的話，玩家在大廳看到「沒連上中間人」會以為壞了。
        idle: "還沒進對戰",
        offline: "沒連上中間人",
        solo: "還沒配到對手",
        paired: "已配到對手",
        incompatible: "⚠ 版本不合，已退回單邊",
      };

      /**
       * 對手是 NPC 的那幾種 rule（`status.rule`）。認不出來就不特別講。
       *
       * ⚠ 這幾種模式底下**準備與秒數整組不生效**（2026-08-09），所以每一處
       * 顯示「生效中／已配對」的地方都要先問過它，否則 UI 會宣稱一個不存在的保護。
       */
      const NPC_RULE_TEXT = { quest: "任務", raid: "渦", event: "活動" };

      function renderFooter() {
        const st = snap?.status;
        const p = snap?.profile;
        /**
         * ⚠ **右上角只寫「這個視窗是誰」，不寫埠、不寫中間人。**
         *
         * 那兩個東西以前掛在這裡，但它們回答的不是玩家會問的問題。埠是實例身分
         * （玩家現在一律用 `--remote-debugging-port=0`，那個數字根本沒有人在聽），
         * 中間人是預設值就會動的東西 —— 兩個都只會讓人停下來想「我是不是漏設了
         * 什麼」。要查的人在 設置 › 連線 找得到。
         *
         * 配置名稱**也只在多開打開時**才有意義：只有一個客戶端的人，那就是一個
         * 他沒取過的名字。
         */
        const multi = snap?.store?.multiProfile === true;
        $("ver").textContent = snap?.version ? `v${snap.version}` : "";
        $("who").textContent = p && multi ? p.name : "";
        // 只有一份實例時這一格留空 —— 旁邊那顆燈就是全部的資訊，
        // 補一個玩家沒取過的名字只是讓狀態列多一個要解讀的東西。
        $("fProfile").textContent = p && multi ? p.name : "";
        $("dot").className =
          "dot " + (!st || !st.connected ? "" : st.link === "paired" ? "paired" : "solo");
        $("fGame").textContent = !st
          ? "啟動中…"
          : !st.connected
            ? "等遊戲…"
            : st.armed
              ? // ⚠ 打任務／渦時也是 armed，但那不是「對戰中」。講成對戰中的話，
                // 玩家會合理地期待準備與秒數在管 —— 而它們刻意沒有。
                NPC_RULE_TEXT[st.rule]
                ? `${NPC_RULE_TEXT[st.rule]}中（對手是 NPC）`
                : `對戰中${st.seat ? `（座位 ${st.seat}）` : ""}`
              : // ⚠ 不要寫「還沒進對戰」。**打完之後也會走到這裡**（結算畫面、
                // 回大廳），而那時「還沒」是錯的 —— 玩家剛打完一場。
                "已接上，不在對戰中";
        $("fLink").textContent = st
          ? st.connected && !st.pvp && NPC_RULE_TEXT[st.rule]
            ? "不生效（NPC）"
            : (LINK_TEXT[st.link] ?? st.link)
          : "—";
        $("fLast").textContent = st?.error ? "⚠ " + st.error : (st?.lastSend ?? "—");
      }

      // =====================================================================
      // 內容
      // =====================================================================
      const PAGES = {};

      /** 這一格在 TABS 裡的定義。找不到回 null。 */
      function subDef(tabId, subId) {
        const t = TABS.find((x) => x.id === tabId);
        return t?.subs.find((s) => s.id === subId) ?? null;
      }

      /**
       * 沒有對應 PAGES 條目時畫什麼。
       *
       * ⚠ **絕對不要退回空字串。** 空白頁不會報錯、不會出現在 log 裡，看起來
       * 就只是「這個功能壞了」—— 配置頁與五個預告頁就是這樣安靜地消失了很久
       * （分頁註冊了、CSS 與事件都在，只有 render 函式沒寫）。
       */
      function missingPage(tabId, subId) {
        const def = subDef(tabId, subId);
        const label = def?.label ?? subId;
        if (def?.todo) {
          // 知道卡在哪就講明白（見 todoPage 的註解：不要只寫「敬請期待」）。
          return todoPage(
            label,
            def.why ?? "這個功能還沒做。",
            def.items ?? [
              "分頁先放著是為了讓你知道規劃了什麼，不是它壞了。",
              "做好之後這一頁會換成真正的內容。",
            ],
          );
        }
        // 不是預告卻沒有頁面 —— 那是真的漏了，要講出來而不是裝沒事。
        return (
          head(label, "", "缺頁") +
          `<div class="card"><div class="hint warn" style="margin-top:0">
             ⚠ 這一頁還沒接上（<code>${esc(tabId)}/${esc(subId)}</code> 沒有對應的畫面）。
             這是插件的問題，不是你的操作。
           </div></div>`
        );
      }

      function renderBody() {
        const fn = PAGES[`${tab}/${sub}`];
        $("content").innerHTML = fn ? fn() : missingPage(tab, sub);
        // 配對頁與隱藏地圖頁的資料不在 snapshot 裡，開著的時候才輪詢。
        if (onMatchPage()) startMatchPolling();
        else stopMatchPolling();
        if (onStagePage()) startStagePolling();
        else stopStagePolling();
      }

      function head(title, lede, badge) {
        return (
          `<h2>${esc(title)}${badge ? `<span class="badge">${esc(badge)}</span>` : ""}</h2>` +
          `<div class="rule"></div>` +
          (lede ? `<p class="lede">${lede}</p>` : "")
        );
      }

      /** 未實作的頁長什麼樣。**要講清楚卡在哪**，不是只寫「敬請期待」。 */
      function todoPage(title, why, items) {
        return (
          head(title, "", "未實作") +
          `<div class="todo-box"><h3>${esc(why)}</h3><ul>` +
          items.map((i) => `<li>${i}</li>`).join("") +
          `</ul></div>`
        );
      }

      // --- 戰鬥 › 準備 ------------------------------------------------------
      /**
       * OK 鈕的顏色。**「官方原本」是預設值**（玩家指定）。
       *
       * 琥珀色跟系統匣圖示的「已接上、還沒配對」同一個值，不是隨手挑的。
       */
      const TINTS = [
        { label: "官方原本", value: null },
        { label: "琥珀色", value: 0xffc247 },
      ];
      const hex = (n) => "#" + n.toString(16).padStart(6, "0");

      /**
       * 準備功能現在到底有沒有在管，以及**為什麼沒有**。
       *
       * ⚠ 「否」一個字是不夠的。這個功能有四種不生效的理由，而玩家能自己處理的
       * 只有其中兩種（自己關掉、對手沒開）；另外兩種（在打 NPC、還沒握手）
       * 講不清楚的話，他會以為插件壞了而去重裝。
       */
      function readyWhy(st, on) {
        if (!on) return "否（我自己關掉了）";
        if (!st?.connected) return "否（還沒接上遊戲）";
        const npc = NPC_RULE_TEXT[st.rule];
        if (npc) return `否（正在打${npc}，對手是 NPC）`;
        if (st.link !== "paired") return "否（還沒握手到對手的插件）";
        if (!st.agreed.readyEnabled) return "否（對手把準備關掉了）";
        return "是（雙方都開，已握手）";
      }

      PAGES["battle/ready"] = () => {
        const st = snap?.status;
        const on = snap?.profile.prefs.readyEnabled;
        const tint = snap?.profile.readyTint ?? null;
        const live = on && st?.pvp && st?.link === "paired" && st?.agreed.readyEnabled;
        return (
          head("準備", "按下 OK 不立刻送出，等對手也按了才同時送出。") +
          `<div class="card">
             <label class="toggle">
               <input type="checkbox" id="ready" ${on ? "checked" : ""} />
               <span><b>啟用準備功能</b>
                 <div class="hint">
                   再按一次可以取消，對手一動也會解除。<br />
                   ⚠ <b>只在跟真人對戰、而且兩邊都握手成功時生效。</b>
                   打任務、打渦以及對手沒裝插件時完全不介入。
                 </div>
               </span>
             </label>
           </div>
           <div class="card">
             <div class="row"><span><b>OK 鈕的顏色</b></span></div>
             <div class="presets" id="tints">${TINTS.map(
               (t) =>
                 `<button data-tint="${t.value === null ? "" : t.value}" aria-pressed="${
                   t.value === tint
                 }">${esc(t.label)}</button>`,
             ).join("")}</div>
             <label class="toggle" style="margin-top:10px">
               <input type="color" id="tintPick" value="${hex(tint ?? 0xffc247)}" />
               <span><b>自訂顏色</b>
                 <div class="hint">
                   準備中（壓著 OK 沒送出）時把按鈕染成這個顏色。<br />
                   ⚠ 選「官方原本」＝完全不改遊戲畫面，代價是少了「插件正在管這個階段」的視覺提示 ——
                   那時要改看系統圖示（見下方）。
                 </div>
               </span>
             </label>
           </div>
           <div class="card">
             <div class="row"><span class="dim">我這邊</span><span>${on ? "已開啟" : "已關閉"}</span></div>
             <div class="row"><span class="dim">實際生效</span>
               <span class="${live ? "good" : "warn"}">${esc(readyWhy(st, on))}</span></div>
             <div class="row"><span class="dim">剛剛送出</span><span>${esc(st?.lastSend ?? "—")}</span></div>
           </div>`
        );
      };

      // --- 戰鬥 › 秒數上限 --------------------------------------------------
      PAGES["battle/seconds"] = () => {
        const st = snap?.status;
        const prefs = snap?.profile.prefs;
        const lim = snap?.limits ?? { minSeconds: 5, maxSeconds: 30 };
        // ⚠ 「配到對手」不等於「秒數會生效」—— 打任務／渦時對面是 NPC，
        // 這條規則整組不套用（2026-08-09）。兩件事混在同一個布林裡的話，
        // 玩家會在渦裡看到「共同值 15 秒」然後等一個永遠不會來的強制結束。
        const paired = st?.link === "paired" && st?.pvp === true;
        const npcRule = NPC_RULE_TEXT[st?.rule];
        return (
          head("秒數上限", "移動階段要多長。共同值取<b>雙方比較長的那個</b>。") +
          `<div class="card">
             <div class="row"><span><b>我希望的階段長度</b></span>
               <span class="big" id="secLabel">${prefs?.phaseSeconds ?? 30}</span></div>
             <input type="range" id="seconds" min="${lim.minSeconds}" max="${lim.maxSeconds}"
                    step="1" value="${prefs?.phaseSeconds ?? 30}" />
             <div class="ticks"><span>${lim.minSeconds} 秒</span><span>${lim.maxSeconds} 秒（不縮短）</span></div>
             <div class="hint ${paired ? "" : "warn"}" id="agreed">${
               paired
                 ? `共同值 ${st.agreed.phaseSeconds} 秒（取雙方較長的那個）` +
                   (st.hazard ? `，防止壓秒出聖水生效中 → ${st.capSeconds} 秒` : "")
                 : npcRule
                   ? `正在打${npcRule} —— 對手是 NPC，秒數不縮短（這條只對真人對戰）`
                   : "還沒握手到對手 —— 秒數不會縮短（單方面縮短只是自己更早承諾）"
             }</div>
           </div>
           <div class="card">
             <div class="row"><span><b>防止壓秒出聖水</b></span
               ><span class="good">握手後強制生效</span></div>
             <div class="hint">
               手牌有聖水／聖杯，而且場上有麻痺、降低移動或<b>剩一回合的自壞</b>時，
               這個階段再短 5 秒。<br />
               ⚠ <b>這條不需要雙方同意</b>，握手成功就一起套用 ——
               它對兩邊對稱（同一個局面各砍同樣的秒數），沒有人能靠關掉它拿到優勢。<br />
               ⚠ <b>砍完不會低於 8 秒</b>（9→8、10→8、13→8、20→15）——
               砍到 4~5 秒連把牌拖到場上都來不及，而時間到是把<b>當下的場面</b>
               送出去，不是空手。
             </div>
           </div>`
        );
      };

      // --- 牌組 › Cost 表 ---------------------------------------------------
      /**
       * 自訂 COST。
       *
       * ⚠ 這一頁最重要的一件事是**講清楚「選了規則」跟「畫面上真的變了」是
       * 兩回事**。注入走 `addScriptToEvaluateOnNewDocument`，只對之後載入的
       * document 生效 —— 玩家選完規則盯著牌組畫面看不到變化是**正常的**，
       * 而如果 UI 只寫「已啟用」，他會以為插件壞了然後去重裝。
       */
      const COST_PHASE_TEXT = {
        off: "未啟用（顯示原版數字）",
        pending: "已裝上，等遊戲重新載入才會變",
        applied: "生效中",
        error: "注入失敗",
      };

      /**
       * 罰則的狀態跟價格分開。
       *
       * ⚠ 這不是多此一舉：罰則走 `Deck.prototype.getCost`，<b>立刻生效</b>；
       * 價格走載入時的資料改寫，要重載。合成一句話一定會對其中一邊說謊。
       */
      const COST_PENALTY_TEXT = {
        off: "用遊戲原本的（7~13 罰 5、14 以上罰 10）",
        applied: "生效中",
        error: "注入失敗",
      };

      /** 壓 C 區間寫成人話：`7 ~ 13 → +5`、`14 以上 → +10`。 */
      function bandText(b) {
        const range =
          b.maxGap === null
            ? `${b.minGap} 以上`
            : b.minGap === b.maxGap
              ? `${b.minGap}`
              : `${b.minGap} ~ ${b.maxGap}`;
        return `差距 ${range} → +${b.extraCost}`;
      }

      /**
       * 作者寫的說明與更新說明，**唯讀**。
       *
       * ⚠ 這兩段原本只有「編輯描述」那一頁看得到，而那是一頁**每一格都能打字**
       * 的編輯畫面 —— 等於要收到規則的人為了讀說明去冒改壞的風險。它們是規則裡
       * 唯一「作者對拿到規則的人說話」的地方（定價的理由、最小單位、哪些卡刻意
       * 不動），所以選規則的這一頁一定要讀得到。
       *
       * ⚠ 換行要自己轉成 `<br>`：作者是在 textarea 裡打的，分行是他排版的一部分。
       * 一律先 `esc()` 再換 —— 反過來的話那些 `<br>` 會被跳脫掉，而真正的標籤
       * 會活下來。
       */
      function ruleProse(rule) {
        const block = (label, text, hint) =>
          text === ""
            ? ""
            : `<div class="row" style="margin-top:8px"><span class="dim">${label}</span></div>
               <div class="hint" style="margin-top:0">${esc(text).replace(/\n/g, "<br />")}</div>` +
              (hint ?? "");
        const desc = block(
          "說明",
          rule.description ?? "",
          // 作者宣告最小單位的地方就是這裡（編輯器只做檢查，不寫進規則檔）。
          "",
        );
        const log = block("更新說明", rule.changelog ?? "", "");
        if (desc === "" && log === "") {
          return `<div class="hint">這份規則<b>沒有寫說明</b>。自己編的話，到「編輯描述」補上 ——
            定價的理由、最小單位、哪些卡刻意不動，收到規則的人只有那裡讀得到。</div>`;
        }
        return desc + log;
      }

      PAGES["deck/cost"] = () => {
        const st = snap?.status;
        const rule = snap?.costRule ?? null;
        const failure = snap?.costRuleError ?? null;
        const cost = st?.cost ?? {
          phase: "off",
          applied: null,
          unknownKeys: 0,
          penalty: "off",
          penaltyEverywhere: false,
          bands: null,
          error: null,
        };

        const chosen = rule
          ? `<div class="card">
               <div class="row"><span class="dim">規則</span><span><b>${esc(rule.name)}</b> ${esc(rule.version)}</span></div>
               <div class="row"><span class="dim">作者</span><span>${esc(rule.publisher)}</span></div>
               ${
                 // 四張表分開列。一個總數看不出「這份規則管不管裝備」，而那是
                 // 拿到別人的規則檔時第一個要知道的事。0 筆＝那種卡用原版價格。
                 [
                   ["角色", rule.tableEntries.characters],
                   ["怪物卡", rule.tableEntries.monsters],
                   ["裝備", rule.tableEntries.equipment],
                   ["事件卡", rule.tableEntries.eventCards],
                 ]
                   .map(
                     ([label, n]) =>
                       `<div class="row"><span class="dim">${label}</span><span>${
                         n === 0 ? '<span class="dim">沒定價，用原版</span>' : `${n} 筆`
                       }</span></div>`,
                   )
                   .join("")
               }
               <div class="row"><span class="dim">遊戲版本</span><span>${esc(rule.gameVersion)}</span></div>
               <div class="row"><span class="dim">核對碼</span><span>${
                 rule.shortHash
                   ? `<code>${esc(rule.shortHash)}</code>`
                   : '<span class="dim">裸規則，沒有核對碼</span>'
               }</span></div>
               <div class="row"><span class="dim">檔案</span><span>${esc(rule.fileName)}</span></div>
               ${
                 rule.shortHash
                   ? `<div class="hint">跟對手約戰時核對這 8 碼 —— 一樣才代表兩邊算的是同一份規則。
                        這個碼是<b>照檔案內容算出來的</b>，改一個數字它就會變。</div>`
                   : `<div class="hint warn">⚠ 這是裸規則檔，沒有內容雜湊，不能拿去跟對手核對。要分享請先跑 <code>companion pack</code>。</div>`
               }
               ${
                 rule.rehashedFrom
                   ? // 直接改包是支援的做法，所以這不是錯誤 —— 但一定要說，
                     // 否則玩家會拿著新數字去跟對手核對舊的碼。
                     `<div class="hint warn">⚠ 這個檔案被直接編輯過，核對碼已重算：
                        <code>${esc(rule.rehashedFrom)}</code> → <code>${esc(rule.shortHash ?? "")}</code><br />
                        對手手上那份還是舊的 —— <b>把這個檔案傳給他</b>，兩邊的碼才會一樣。</div>`
                   : ""
               }
               ${ruleProse(rule)}
             </div>`
          : failure
            ? // ⚠ 這張卡片是「選了沒反應」的解藥。載入失敗時 costRule 是 null，
              // 沒有它的話這一頁只會說「還沒選規則」—— 跟根本沒按過一模一樣。
              `<div class="card">
               <div class="row"><span class="dim">規則</span><span class="bad"><b>載入失敗，沒有套用</b></span></div>
               <div class="row"><span class="dim">檔案</span><span>${esc(failure.fileName)}</span></div>
               <div class="hint warn">⚠ ${esc(failure.message)}</div>
               ${
                 failure.hint
                   ? `<div class="hint">${esc(failure.hint).replace(/\n/g, "<br />")}</div>`
                   : ""
               }
               <div class="hint">遊戲顯示的仍然是原版 COST。修好之後再選一次。</div>
             </div>`
            : `<div class="card">
               <div class="hint">還沒選規則。遊戲顯示的是原版 COST。</div>
             </div>`;

        const state = `<div class="card">
             <div class="row"><span class="dim">卡片價格</span><span>${
               COST_PHASE_TEXT[cost.phase] ?? cost.phase
             }</span></div>
             <div class="row"><span class="dim">壓 C 罰則</span><span>${
               cost.penalty === "applied"
                 ? cost.penaltyEverywhere
                   ? "生效中（立即，全遊戲）"
                   : "生效中（⚠ 目前只有牌組畫面）"
                 : (COST_PENALTY_TEXT[cost.penalty] ?? cost.penalty)
             }</span></div>
             ${
               cost.applied !== null
                 ? `<div class="row"><span class="dim">已改寫</span><span>${cost.applied} 張卡</span></div>`
                 : ""
             }
             ${
               cost.unknownKeys > 0
                 ? `<div class="hint warn">⚠ 規則有 ${cost.unknownKeys} 個鍵這個客戶端沒有。規則可能是給別的遊戲版本用的 —— 那些卡會被當成 99C。</div>`
                 : ""
             }
             ${cost.error ? `<div class="hint warn">⚠ ${esc(cost.error)}</div>` : ""}
             ${
               cost.phase === "pending"
                 ? `<div class="hint">⚠ 這兩件事的生效時機<b>不一樣</b>。<br />
                      <b>壓 C 罰則</b>改的是遊戲的計算函式，<b>已經生效</b>了 ——
                      牌組畫面的罰則與總和現在就是規則裡的。<br />
                      <b>卡片價格</b>改的是載入時的資料，只對<b>之後載入</b>的畫面生效，
                      要按下面的重載或自己重開遊戲。</div>`
                 : ""
             }
           </div>`;

        const bands = rule
          ? rule.bands === null
            ? `<div class="card"><div class="hint">這份規則不壓 C。</div></div>`
            : `<div class="card">
                 <div class="row"><span class="dim">壓 C</span><span>${rule.bands.length} 段</span></div>
                 ${rule.bands
                   .map(
                     (b) =>
                       `<div class="row"><span class="dim">·</span><span>${esc(bandText(b))}</span></div>`,
                   )
                   .join("")}
                 <div class="hint">壓 C 是<b>隊內每一對出戰卡</b>各判一次，三張就是三對。
                   <b>怪物卡也算</b> —— 它跟角色共用同樣那三個槽位；
                   裝備與事件卡計入總和但<b>不</b>參與壓 C。<br />
                   遊戲畫面上的 <code>+N</code> 徽章與總和都會照這張表重算。<br />
                   ⚠ 對戰大廳的 <code>cost:</code> 是<b>進場時跟伺服器要的</b>，
                   換規則後要離開再進去一次才會重新抓。<br />
                   ⚠ 存牌組時送上伺服器的仍然是<b>原版數字</b> —— 插件不改變伺服器的判定。</div>
               </div>`
          : "";

        // ⚠ **這張卡要放在最上面。** 它是這一頁唯一「按了會發生事情」的地方，
        // 而下面那幾張（規則明細、狀態、壓 C 分段）加起來比視窗高得多 ——
        // 擺在最後的話每次想換規則都要先捲一大段。說明性的內容排在動作後面。
        // 規則從哪裡來。⚠ 這三個是**互斥的模式**，不是三顆各自做一件事的按鈕 ——
        // 畫面一定要看得出「現在是哪一個」，否則玩家按了「用預設」之後，
        // 那顆按鈕跟沒按過長得一模一樣。
        const mode = snap?.costRuleMode ?? "default";
        const origin = snap?.costRuleOrigin ?? null;
        // ⚠ 選中的那顆用 `aria-pressed`（CSS 已經有那條規則）而不是自訂 class ——
        // 這一頁的其他分段選擇器都是這樣，換一種寫法會讓它看起來不像同一組東西。
        const modeButton = (id, value, label) =>
          `<button id="${id}" aria-pressed="${mode === value}"${mode === value ? " disabled" : ""}>${label}</button>`;

        const actions = `<div class="card">
             <div class="presets">
               ${modeButton("costModeDefault", "default", "插件附的規則")}
               ${modeButton("costModeFile", "file", "自己的規則檔")}
               ${modeButton("costModeOff", "off", "不套用（原版數字）")}
             </div>
             <div class="presets">
               ${mode === "file" ? `<button id="costPick">選規則檔…</button>` : ""}
               ${rule && st?.connected ? `<button id="costReload">重載遊戲讓它生效</button>` : ""}
             </div>
             ${
               mode === "default"
                 ? `<div class="hint">插件附了一份預設規則，<b>裝上就會套用</b>，之後也會自己更新
                      （每小時檢查一次，簽章驗過才收）。${
                        origin === "feed"
                          ? "目前用的是<b>更新下來</b>的那一份。"
                          : origin === "bundled"
                            ? "目前用的是<b>安裝包裡</b>那一份。"
                            : ""
                      }</div>`
                 : mode === "file"
                   ? `<div class="hint">用你自己選的那個檔。⚠ 這個模式下<b>插件不會替你更新規則</b> ——
                        檔案是你的，我們一個位元組都不碰。</div>`
                   : `<div class="hint">遊戲顯示原版 COST。⚠ 自動配對在這個模式下用不了（沒有規則就沒有「約定」可言）。</div>`
             }
             <div class="hint">
               ⚠ 重載會<b>打斷正在進行的對戰</b>。
               ${st?.connected ? "" : "現在還沒接上遊戲，接上之後才按得到。"}
             </div>
           </div>`;

        return (
          head(
            "Cost 表",
            "套用自訂 COST —— 角色、怪物、裝備、事件卡四張表。只改本機顯示，不會改變伺服器的判定。",
          ) +
          actions +
          chosen +
          state +
          bands +
          `<div class="card">
             <div class="hint">
               規則檔怎麼來：<code>companion official-rule</code> 匯出一份原版表
               （四張表一次全帶），<b>直接改裡面的數字</b>就是你的版本了 ——
               核對碼會在載入時自動重算，不用先解包。改完把檔案傳給對手，
               兩邊的碼一樣就是同一份規則。<br />
               四張表的鍵：角色 <code>cc078_04</code>、怪物 <code>mc001_01</code>、
               裝備 <code>wp001</code>、事件卡 <code>ev091</code>。
               後兩者的數字是<b>補零到三位的卡片編號</b>，寫成 <code>wp1</code> 不算數。
             </div>
           </div>`
        );
      };

      // --- 設置 › 連線 ------------------------------------------------------
      /**
       * 「怎麼讓插件接得到遊戲」——**一行字加一顆複製按鈕，就這樣。**
       *
       * ⚠ **這一段以前有 5 個步驟加 4 條警告，那是寫給我自己看的，不是寫給玩家的。**
       * 玩家要的不是理解 CDP，是知道下一步按哪裡。那 4 條警告全部是「填固定埠時
       * 才會出事」的排錯知識 —— 改成叫大家填 `0` 之後，那些情況一個都不會發生，
       * 於是整段可以刪掉，而不是折疊起來。**指示變短的正確方式是讓它變得不必要。**
       *
       * 剩下的排錯（埠被保留、被別的程式佔走、asar 是網頁版）由
       * `explainDebugPort()` 在真的出事時講一句，而且是講**那一次**的原因 ——
       * 比預先把四種可能都攤在玩家面前準。
       *
       * ⚠ **網頁版沒有這一段。** 那條路要自己改 `app.asar`，玩家做不到 ——
       * 對他講等於叫他去撞牆。（我自己也不需要：我知道那支 cmd 在哪。）
       */
      function howToConnect(p) {
        if (p?.kind === "web") return "";
        return `<div class="card">
           <div class="row"><span><b>接不上遊戲？</b></span></div>
           <div class="hint">在 Steam 的啟動選項填這一行，然後重開遊戲：</div>
           <div class="row">
             <code>${esc(snap?.debugFlag ?? "")}</code>
             <button id="copyFlag">複製</button>
           </div>
         </div>`;
      }

      // --- 牌組 › 編輯 COST -------------------------------------------------
      //
      // 這一頁存在的理由只有一句：**規則檔裡是 `cc001_01`，玩家看得懂的是
      // 「艾伯李斯特 L1」。** 中間那份對照叫名冊（catalog），從玩家自己跑著的
      // 客戶端讀出來，存在家目錄重複使用。
      //
      // ⚠ 這一頁的資料**不在 snapshot 裡**：四張表加起來 1186 筆，而快照每次
      // 狀態變動都整份重送。開頁時用 `editor.load()` 拉一次就好。

      /** 編輯器的全部狀態。`null` = 還沒載入。 */
      let ed = null;
      /** 四張表哪一張開著。 */
      let edTab = "characters";
      /** 名字的篩選字串。700 位角色，沒有它找不到人。 */
      let edFilter = "";
      /** 上一次存檔的結果，畫在按鈕旁邊。 */
      let edMsg = null;
      /** 正在載入中，避免重複發 IPC。 */
      let edLoading = false;
      /**
       * 按一下上下鍵動多少。
       *
       * ⚠ **真實來源是設定檔**（`profile.editStep`），這裡只是畫面上那一份 ——
       * 跟開房設定同一套：改了要立刻送出去（`window.ulr.editor.step`），
       * 否則下一次重載 payload 就把它打回去了。
       *
       * 先給 1 是為了「payload 還沒回來時也畫得出格子」。
       */
      let edStep = 1;
      /**
       * 最小單位檢查的值。**0 = 不檢查**，預設。
       *
       * ⚠ 真實來源同樣是設定檔（`profile.editUnit`），而且它**跟著玩家走、不
       * 跟著規則走** —— 規則檔裡沒有這個欄位（見主程序 `normalizeEditUnit` 的
       * 說明）。換一份規則來編要自己重設。
       */
      let edUnit = 0;
      /** 只看不合單位的格子。⚠ 跟名字篩選是 AND，兩個可以一起用。 */
      let edOnlyOff = false;
      /**
       * 把官方還沒出的卡藏起來。**預設藏。**
       *
       * ⚠ 這一個**刻意不記進設定檔**，跟 `edStep`／`edUnit` 不一樣。那兩個是
       * 作者在調的「值」（每個人不同，重設一次很煩）；這個是純粹的檢視開關，
       * 而它的預設值對每個人都是對的 —— 開著插件的期間改了就一直是那樣，
       * 重開回到「藏」，那正是想要的。少一個設定欄位、少一條 IPC、少一次遷移。
       */
      let edHideLocked = true;

      const onEditPage = () => tab === "deck" && sub === "costedit";

      const ED_TABS = [
        { id: "characters", label: "角色卡" },
        { id: "eventCards", label: "事件卡" },
        { id: "equipment", label: "裝備卡" },
        { id: "monsters", label: "怪物卡" },
      ];

      /**
       * 換上下鍵的幅度，**並記進設定檔**。
       *
       * ⚠ 主程序夾過的那個值才是真的（0、負數、三位小數都會被夾），所以畫面
       * 用回傳值而不是用玩家打的那個 —— 否則「打了 0」會讓畫面寫著 0、實際上
       * 是 1，而那一格看起來就是壞的。
       *
       * ⚠ 只重畫這一頁。700 個格子的 `step` 全都要換，躲不掉整頁重畫 ——
       * 但玩家是按按鈕／改完那一格才會走到這裡，游標不在價格格子裡。
       */
      function applyEditStep(value) {
        return window.ulr.editor.step(Number(value)).then((saved) => {
          edStep = saved;
          if (ed !== null) ed.editStep = saved;
          renderBody();
        });
      }

      /**
       * 換最小單位，**並記進設定檔**。0 = 不檢查。
       *
       * ⚠ 這支跟 `applyEditStep` 一樣**不碰規則檔** —— 檢查是編輯器的功能，
       * 規則檔裡沒有「最小單位」這個欄位。
       */
      function applyEditUnit(value) {
        return window.ulr.editor.unit(Number(value)).then((saved) => {
          edUnit = saved;
          if (ed !== null) ed.editUnit = saved;
          // 關掉檢查的話「只看不合的」就沒有意義了，順手關掉 —— 留著的話畫面
          // 會變成一片空白（沒有任何格子不合），而玩家不會把那個空白跟這顆
          // 開關連在一起。
          if (saved === 0) edOnlyOff = false;
          renderBody();
        });
      }

      /**
       * 十進位 → 整數百分之一。**不做 `v * 100`。**
       *
       * ⚠ `21.35 * 100` 是 2134.9999999999998，而這個值等一下要拿去取餘數 ——
       * 浮點的餘數會讓「剛好合單位」的格子隨機被判成不合。改從十進位字串取
       * 數字，跟引擎的 `toCentiCost`（`@ulr/rule-schema` 的 cost-number.ts）
       * 是同一套算法，兩邊對同一個值一定得到同一個整數。
       *
       * 超過兩位小數回 `null` —— 那種值連規則檔都收不下（`toCentiCost` 會拋），
       * 呼叫端一律當成「不合單位」。
       */
      function edCenti(value) {
        const m = /^(-?)(\d+)(?:\.(\d{1,2}))?$/.exec(String(value));
        if (m === null) return null;
        const frac = Number((m[3] ?? "").padEnd(2, "0"));
        return (m[1] === "-" ? -1 : 1) * (Number(m[2]) * 100 + frac);
      }

      /** 這個數字是最小單位的整數倍嗎。`unit` 是 0 時永遠算合格。 */
      function edFitsUnit(value, unit) {
        if (!unit) return true;
        const v = edCenti(value);
        const u = edCenti(unit);
        if (v === null || u === null || u === 0) return true;
        return v % u === 0;
      }

      /**
       * 這個單位疊幾個才會變成整數，以及疊出來是幾 C。
       *
       * ⚠ **「除不盡 1」不等於「湊不出整數」**，這兩件事一定要分開講。任何單位
       * 疊夠多次都會撞上整數 —— `0.33 × 100 = 33C`。作者真正在意的是**湊不湊得出
       * 剛好 1C**（那是「三張卡合起來加 1C」那種設計要的東西），而那要的是
       * 「單位除得盡 1」，比前者嚴格。
       *
       * 幾個才夠：`k = 100 / gcd(單位的百分之一, 100)`。
       */
      function edUnitReach(unit) {
        const u = edCenti(unit);
        if (u === null || u <= 0) return null;
        const gcd = (a, b) => (b === 0 ? a : gcd(b, a % b));
        const k = 100 / gcd(u, 100);
        return { count: k, whole: (u * k) / 100, makesOne: u <= 100 && 100 % u === 0 };
      }

      /**
       * 官方還沒出這張卡（名冊算好的）。查不到就當它出了。
       *
       * ⚠ **方向不能反。** 名冊是舊版快取時 `locked` 根本不存在，那時要當成
       * 「都出了」—— 反過來的話按下「重讀名冊」之前整頁會是空的。
       */
      function edLocked(tableId, key) {
        return edLockedKeys()[tableId]?.[key] === true;
      }

      /**
       * 規則鍵 → locked，四張表各一份。
       *
       * ⚠ 建一次就留著。角色那一頁每畫一格都會問，而名冊有 1186 張卡 ——
       * 每次都線性掃一遍會變成平方級。名冊換掉時（重讀）整份丟掉重建。
       */
      let edLockCache = null;
      function edLockedKeys() {
        if (edLockCache !== null && edLockCache.cat === ed?.catalog) return edLockCache.map;
        const map = { characters: {}, monsters: {}, equipment: {}, eventCards: {} };
        const cat = ed?.catalog;
        if (cat) {
          for (const g of cat.characters ?? [])
            for (const c of g.cards) if (c.locked) map.characters[c.key] = true;
          for (const g of cat.monsters ?? [])
            for (const c of g.cards) if (c.locked) map.monsters[c.key] = true;
        }
        // 裝備與事件卡沒有升級圖，永遠是空的 —— 留著空物件讓呼叫端不必分case。
        edLockCache = { cat, map };
        return map;
      }

      /** 這一格現在畫不畫得出來（被藏起來的就摸不到）。 */
      function edVisible(tableId, key) {
        return !(edHideLocked && edLocked(tableId, key));
      }

      /** 這一格不合單位嗎。⚠ 看的是**草稿**，所以邊改邊亮。 */
      function edOffUnit(tableId, key) {
        if (!edUnit || ed === null) return false;
        return !edFitsUnit(ed.draft[tableId][key], edUnit);
      }

      /**
       * 各處有幾格不合單位。⚠ 要分開報 —— 不然玩家不知道要切到哪一頁。
       *
       * ⚠⚠ **壓 C 的 `extraCost` 也要算。** 它跟卡片價格一樣直接加進隊伍總和，
       * 所以一段 +0.3 的罰則會讓一張「每一格都是 0.5 的倍數」的表照樣算出
       * 非 0.5 倍數的總和。漏掉它的話這個檢查會給出**假的全部通過** ——
       * 那比沒有檢查更糟，因為作者會相信它。
       *
       * 壓 C 在另一頁（編輯規則），但 payload 本來就帶著它，所以這裡讀得到。
       *
       * ⚠ **被藏起來的卡另外算（`hidden`）。** 併進 `total` 的話會出現
       * 「說有 3 格不合，按『只看這些』卻一格都沒有」—— 因為那幾格正被藏著。
       * 分開報之後那句話變成可行動的：把「顯示還沒出的卡」打開就看得到。
       */
      function edOffCounts() {
        const out = { total: 0, bands: 0, hidden: 0 };
        for (const t of ED_TABS) {
          let n = 0;
          if (ed !== null && edUnit)
            for (const k of Object.keys(ed.draft[t.id])) {
              if (!edOffUnit(t.id, k)) continue;
              if (edVisible(t.id, k)) n++;
              else out.hidden++;
            }
          out[t.id] = n;
          out.total += n;
        }
        if (ed !== null && edUnit) {
          for (const b of ed.compression?.bands ?? [])
            if (!edFitsUnit(b.extraCost, edUnit)) out.bands++;
        }
        out.total += out.bands;
        return out;
      }

      /** 名冊裡有幾張是官方還沒出的。0 = 這份名冊判斷不了（或全出了）。 */
      function edLockedCount() {
        const map = edLockedKeys();
        return Object.keys(map.characters).length + Object.keys(map.monsters).length;
      }

      function edLoad(force) {
        if (edLoading) return;
        if (ed !== null && !force) return;
        edLoading = true;
        window.ulr.editor.load().then((payload) => {
          edLoading = false;
          ed = decorate(payload);
          if (onEditPage()) renderBody();
        });
      }

      /**
       * 把 IPC 送來的東西整理成畫面直接可用的樣子。
       *
       * 兩件事：
       * 1. **原價索引**（`base`）—— 每一格都要知道「原本是多少」，才畫得出
       *    「改過了」與「改回原價」。
       * 2. **草稿**（`draft`）—— 規則裡沒有的鍵先用原價填。那正是「舊規則只有
       *    角色表」的升級路徑：打開編輯器、按存檔，四張表就補齊了。
       */
      function decorate(payload) {
        const base = {};
        const draft = {};
        for (const t of ED_TABS) {
          base[t.id] = {};
          draft[t.id] = {};
        }
        const cat = payload.catalog;
        if (cat) {
          for (const g of cat.characters)
            for (const c of g.cards) base.characters[c.key] = c.baseCost;
          for (const g of cat.monsters) for (const c of g.cards) base.monsters[c.key] = c.baseCost;
          for (const g of cat.equipment)
            for (const i of g.items) base.equipment[i.key] = i.baseCost;
          for (const g of cat.eventCards)
            for (const i of g.items) base.eventCards[i.key] = i.baseCost;
        }
        for (const t of ED_TABS) {
          const fromRule = payload.tables?.[t.id] ?? {};
          for (const k of Object.keys(base[t.id])) draft[t.id][k] = base[t.id][k];
          // 規則寫了什麼就蓋上去。⚠ 規則有、名冊沒有的鍵也要留著 —— 那是
          // 「規則比客戶端新（或舊）」的訊號，默默丟掉等於偷改別人的規則。
          for (const k of Object.keys(fromRule)) draft[t.id][k] = fromRule[k];
        }
        // 載入當下的樣子。**跟 base 是兩回事**，見 edUnsaved()。
        const saved = JSON.parse(JSON.stringify(draft));
        // 幅度是設定檔裡那份。⚠ 這一行讓「重讀名冊」之後幅度不會被打回預設 ——
        // 那支也回一份完整的 payload。
        if (typeof payload.editStep === "number") edStep = payload.editStep;
        if (typeof payload.editUnit === "number") edUnit = payload.editUnit;
        return { ...payload, base, draft, saved };
      }

      /**
       * 這一格跟**遊戲原價**差幾 C。`null` = 不知道原價，或一模一樣。
       *
       * 名冊沒有原價時（規則比客戶端新）一律當成沒改：我們不知道原價是多少，
       * 標成「改過了」是在講一件自己也不確定的事。
       *
       * ⚠ 先夾到兩位小數再比。價格是玩家在輸入框打的，而 `13.1 - 13` 在浮點
       * 底下是 0.10000000000000053 —— 不夾的話色階會在邊界上抖。
       */
      function edDelta(tableId, key) {
        const b = ed?.base[tableId]?.[key];
        if (b === undefined) return null;
        const d = Math.round((ed.draft[tableId][key] - b) * 100) / 100;
        return d === 0 ? null : d;
      }

      function edChanged(tableId, key) {
        return edDelta(tableId, key) !== null;
      }

      /**
       * 這一格要穿哪一身顏色。
       *
       * 五階，**第 5 階是上限** —— 貴 5C 跟貴 50C 同一個顏色。理由是玩家在這
       * 張表上找的是「我把誰調貴了」，不是精確讀數；再往下分階只會讓相鄰的
       * 兩階在 11.5px 的格子裡分不出來。精確的數字就在格子裡，滑過去還有
       * `title` 寫著原價與差值。
       *
       * ⚠ 不滿 1C 也算第一階（`ceil`）。動了就是動了，13 → 13.5 不標的話
       * 那一格看起來跟沒改過一模一樣。
       */
      function edDeltaClass(tableId, key) {
        const d = edDelta(tableId, key);
        if (d === null) return "";
        const level = Math.min(5, Math.ceil(Math.abs(d) - 1e-9));
        return `dirty ${d > 0 ? "up" : "dn"}${level}`;
      }

      /**
       * 這一格跟**檔案裡存著的值**不一樣嗎 —— 決定存檔鈕與「未存檔」計數。
       *
       * ⚠ **這兩件事一定要分開。** 一份自訂規則本來就有一堆格子跟原價不同
       * （夾擠式那份就有兩格），拿「跟原價不同」當存檔鈕的條件的話，存完檔
       * 按鈕仍然亮著、上面還寫著「改動 4 格」—— 玩家會一直以為自己有東西沒存。
       */
      function edUnsaved(tableId, key) {
        return ed.draft[tableId][key] !== ed.saved[tableId][key];
      }

      function edUnsavedCount() {
        if (ed === null) return 0;
        let n = 0;
        for (const t of ED_TABS)
          for (const k of Object.keys(ed.draft[t.id])) if (edUnsaved(t.id, k)) n++;
        return n;
      }

      /** 跟原版不一樣的格數 —— 「這份規則到底動了多少東西」。 */
      function edCustomCount() {
        if (ed === null) return 0;
        let n = 0;
        for (const t of ED_TABS)
          for (const k of Object.keys(ed.draft[t.id])) if (edChanged(t.id, k)) n++;
        return n;
      }

      /** 篩選：名字對得上就留。空字串代表全部。 */
      function edMatch(name) {
        if (edFilter === "") return true;
        return name.toLowerCase().includes(edFilter.toLowerCase());
      }

      /**
       * 一個數字格。
       *
       * `data-k` 帶的是規則鍵（`cc001_01`）—— 程式要靠它定位，但**它不顯示**。
       * `title` 也帶著，是為了玩家回報問題時說得出是哪一張。
       */
      /**
       * 一整格（含外層 `ecell`）。**藏起來的卡留一個空格子，不是拿掉。**
       *
       * ⚠ 版面是固定十欄的格線（`egrid c10`），而每位角色缺的等級不一樣
       * （有人缺 R2~R5、有人只缺 R5）。真的把 `<div>` 拿掉的話，每一列會各自
       * 往左縮，`L1…R5` 的欄頭就對不上任何一列了 —— 那比不藏更難看。
       */
      function edCell(tableId, key, label) {
        if (!edVisible(tableId, key)) {
          return `<div class="ecell"><div class="nocard" title="${esc(label)}（${esc(key)}）&#10;官方還沒開放這張卡"></div></div>`;
        }
        return `<div class="ecell">${edInput(tableId, key, label)}</div>`;
      }

      function edInput(tableId, key, label) {
        const v = ed.draft[tableId][key];
        // ⚠ `step` 在瀏覽器眼裡不只是「上下鍵動多少」，它同時是一張**格線**：
        // step=1 時 13.5 會被判成 stepMismatch（`:invalid`）。這裡是刻意接受的
        // ——「解析度」要的正是那條格線（上下鍵會對齊到整數），而我們沒有替
        // `:invalid` 上任何樣式，玩家自己打的小數照樣收得下來（真正的驗證在
        // 主程序的 `sanitizeTable`，不是在瀏覽器）。
        // ⚠ 不合單位的框線加在 `class` 上而不是換掉價差色階 —— 兩件事要能
        // **同時**看得到：一格可以既「比原版貴 3C」又「不是 0.5 的倍數」，
        // 而作者兩個資訊都需要。色階吃背景色，這個吃外框。
        const off = edOffUnit(tableId, key) ? " offunit" : "";
        // 選擇「顯示還沒出的卡」時，它們仍然要看得出來 —— 淡化而不是拿掉。
        const lock = edLocked(tableId, key) ? " lockedcard" : "";
        return (
          `<input type="number" step="${edStep}" class="${edDeltaClass(tableId, key)}${off}${lock}" value="${v}" ` +
          `data-t="${tableId}" data-k="${esc(key)}" title="${esc(edTitle(tableId, key, label))}" />`
        );
      }

      /**
       * 這一組（一位角色、一個武器族群…）要不要畫出來。
       *
       * 名字篩選與「只看不合單位的」是 **AND** —— 兩個一起用才找得到
       * 「艾伯那一排裡不合單位的那幾格」。
       */
      function edKeepGroup(tableId, matched, keys) {
        if (!matched) return false;
        if (!edOnlyOff) return true;
        // ⚠ 只算**畫得出來**的那些。被藏起來的卡就算不合單位也碰不到，把整列
        // 留下來只會給出一列每一格都空白的東西。
        return keys.some((k) => edVisible(tableId, k) && edOffUnit(tableId, k));
      }

      /** 篩到一個都不剩時說的話。⚠ 要分得出是哪一個條件篩掉的。 */
      function edEmptyText() {
        if (edOnlyOff && edFilter === "") return "這一頁每一格都合最小單位。";
        if (edOnlyOff) return `「${edFilter}」裡沒有不合最小單位的格子。`;
        return `沒有名字對得上「${edFilter}」。`;
      }

      /** 「原價多少、現在差多少」。色階只分到五階，精確的差值在這裡。 */
      function edDeltaText(tableId, key) {
        const base = ed?.base[tableId]?.[key];
        if (base === undefined) return "⚠ 名冊裡沒有這張，不知道原價";
        const d = edDelta(tableId, key);
        if (d === null) return `原價 ${base}，沒改`;
        return `原價 ${base} → ${d > 0 ? `貴 ${d}C` : `便宜 ${-d}C`}`;
      }

      /**
       * 滑鼠停著時的說明：這是哪一張、原價多少、差多少、合不合單位。
       *
       * ⚠ 不合單位那一行要寫**現在的值**與**單位**。光看一圈洋紅虛線，作者知道
       * 「這格有問題」卻不知道問題是什麼 —— 而 1186 格裡他多半已經忘記自己設的
       * 單位是多少了。
       */
      function edTitle(tableId, key, label) {
        const off = edOffUnit(tableId, key)
          ? `\n⚠ ${ed.draft[tableId][key]} 不是最小單位 ${edUnit} 的整數倍`
          : "";
        const lock = edLocked(tableId, key) ? "\n⚠ 官方還沒開放這張卡（沒有配方做得出來）" : "";
        return `${label}（${key}）\n${edDeltaText(tableId, key)}${off}${lock}`;
      }

      /** 角色：一位一排，L1~L5 R1~R5。欄頭只印一次。 */
      function edCharacters(cat) {
        const groups = cat.characters.filter((g) =>
          edKeepGroup(
            "characters",
            edMatch(g.name),
            g.cards.map((c) => c.key),
          ),
        );
        if (groups.length === 0) return `<div class="hint">${esc(edEmptyText())}</div>`;
        const slots = groups[0].cards.map((c) => `<div class="slot">${esc(c.slot)}</div>`).join("");
        const head = `<div class="ehead"><div class="ename">角色</div><div class="egrid c10">${slots}</div></div>`;
        const rows = groups
          .map(
            (g) =>
              `<div class="erow"><div class="ename" title="${esc(g.name)}">${esc(g.name)}</div>` +
              `<div class="egrid c10">${g.cards
                .map((c) => edCell("characters", c.key, `${g.name} ${c.slot}`))
                .join("")}</div></div>`,
          )
          .join("");
        return head + rows;
      }

      /** 怪物：M1~M3，一排放三種不同的怪物。 */
      function edMonsters(cat) {
        const groups = cat.monsters.filter((g) =>
          edKeepGroup(
            "monsters",
            edMatch(g.name),
            g.cards.map((c) => c.key),
          ),
        );
        if (groups.length === 0) return `<div class="hint">${esc(edEmptyText())}</div>`;
        const blocks = groups.map(
          (g) =>
            `<div class="mblock"><div class="mname" title="${esc(g.name)}">${esc(g.name)}</div>` +
            `<div class="egrid c3">${g.cards
              .map((c) => `<div class="slot">${esc(c.slot)}</div>`)
              .join("")}</div>` +
            `<div class="egrid c3">${g.cards
              .map((c) => edCell("monsters", c.key, `${g.name} ${c.slot}`))
              .join("")}</div></div>`,
        );
        const rows = [];
        for (let i = 0; i < blocks.length; i += 3) {
          rows.push(`<div class="mrow">${blocks.slice(i, i + 3).join("")}</div>`);
        }
        return rows.join("");
      }

      /**
       * 裝備：照「這是誰的專武」分組，一排 5 件。
       *
       * ⚠ 角色限制一定要標出來 —— 一件只有某位角色帶得動的武器，跟通用武器的
       * 定價考量完全不同。實測 238 件裡有 212 件是專武。
       */
      function edEquipment(cat) {
        const groups = cat.equipment
          .map((g) => ({
            ...g,
            items: g.items.filter((i) =>
              edKeepGroup("equipment", edMatch(i.name) || edMatch(g.name), [i.key]),
            ),
          }))
          .filter((g) => g.items.length > 0);
        if (groups.length === 0) return `<div class="hint">${esc(edEmptyText())}</div>`;
        return groups
          .map(
            (g) =>
              `<div class="egroup">${esc(g.name)}` +
              `<span class="sub">${g.charaId === null ? "誰都能帶" : "專武"} · ${g.items.length} 件</span></div>` +
              `<div class="egrid c5">${g.items
                .map(
                  (i) =>
                    `<div class="ecell"><span class="cn" title="${esc(i.name)}">${esc(i.name)}</span>` +
                    `${edInput("equipment", i.key, i.name)}</div>`,
                )
                .join("")}</div>`,
          )
          .join("");
      }

      /**
       * 事件卡的插槽顏色，索引就是名冊裡的 `slotType`（＝遊戲資料的 `type`）。
       *
       * 色票量自遊戲自己的 `event_slot` 貼圖（2026-08-16，八個 frame）。
       * ⚠ 「黑」取的是貼圖的**鏡邊**顏色而不是填色（填色量到 `#0b0a08`）——
       * 純黑貼在這個深色面板上等於沒畫。同一個取捨在上面 `--ink-off` 也做過：
       * 像它，但不要像到看不見。
       */
      const EV_SLOT = [
        { c: "#d82a4e", name: "紅", family: "劍" },
        { c: "#61ca3b", name: "綠", family: "槍" },
        { c: "#038ae9", name: "藍", family: "防禦" },
        { c: "#b403e9", name: "紫", family: "移動" },
        { c: "#ddb13c", name: "黃", family: "特殊" },
        { c: "#f3f4f6", name: "白", family: "機會" },
        { c: "#595142", name: "黑", family: "詛咒" },
        { c: "#bdbdbd", name: "灰", family: "萬用" },
      ];

      /** 名冊沒帶顏色（讀不到那一欄）時回 `null`，呼叫端要能接受沒有顏色。 */
      function edSlot(item) {
        return EV_SLOT[item.slotType] ?? null;
      }

      /**
       * 這張卡的效果說明 —— **名字已經說完的就回空字串**。
       *
       * 110 張裡有 90 張的說明是「此卡當作劍4使用」這種把名字再講一次的樣板，
       * 全部印出來只會讓真正需要讀的那 20 張淹沒在裡面。
       *
       * 判斷方式是「說明裡有沒有出現名字本身」，不是比對那句樣板 —— 樣板的寫法
       * 會隨語言與改版變，而「名字有沒有被複述」在哪一版都成立。認錯的代價也
       * 只是多印一行，不會印錯東西。
       *
       * | 卡          | 說明                     | 顯示   |
       * | ----------- | ------------------------ | ------ |
       * | 劍3·盾3卡   | 此卡當作劍3·盾3使用      | 不顯示 |
       * | Hp恢復      | 回復1點Hp                | 顯示   |
       * | 聚焦卡      | 出牌時,移動階段…加算20點 | 顯示   |
       */
      function edEventEffect(item) {
        const info = item.info ?? "";
        if (info === "") return "";
        const stem = item.name.replace(/(卡|カード)$/, "");
        return stem !== "" && info.includes(stem) ? "" : info;
      }

      /** 事件卡篩選：名字、效果、顏色都算數（打「紅」找得到所有紅卡）。 */
      function edEventMatch(item) {
        if (edFilter === "") return true;
        const slot = edSlot(item);
        return (
          edMatch(item.name) ||
          edMatch(item.info ?? "") ||
          (slot !== null && (edMatch(slot.name) || edMatch(slot.family)))
        );
      }

      /** 左邊那條色帶是什麼意思。**規則寫出來** —— 光看顏色猜不到灰色是萬用。 */
      function edEventLegend() {
        const swatches = EV_SLOT.map(
          (s) =>
            `<span><b style="background:${s.c}"></b>${esc(s.name)}<span class="dim">·${esc(
              s.family,
            )}</span></span>`,
        ).join("");
        return (
          `<div class="evlegend"><span>插槽色</span>${swatches}</div>` +
          `<div class="hint" style="margin-top:0">一張事件卡只放得進角色卡上<b>同色</b>的事件插槽 ——
             <b>灰是萬用</b>，哪一格都放得進去。⚠ 顏色跟名字上的等級<b>沒有</b>對應關係
             （「劍3·盾3卡」是紅的，「劍5·槍5卡」卻是萬用），所以定價前先看這條色帶：
             紅卡再便宜，紅槽少的角色也帶不動。</div>`
        );
      }

      /** 事件卡：族群一塊，一排 9 張（劍1~劍9、劍3·槍1~劍5·移動1…）。 */
      function edEvents(cat) {
        const groups = cat.eventCards
          .map((g) => ({
            ...g,
            items: g.items.filter((i) => edKeepGroup("eventCards", edEventMatch(i), [i.key])),
          }))
          .filter((g) => g.items.length > 0);
        if (groups.length === 0) return `<div class="hint">${esc(edEmptyText())}</div>`;
        return (
          edEventLegend() +
          groups
            .map(
              (g) =>
                `<div class="egroup">${esc(g.name)}<span class="sub">${g.items.length} 張</span></div>` +
                `<div class="egrid c9">${g.items
                  .map((i) => {
                    const slot = edSlot(i);
                    const fx = edEventEffect(i);
                    // 滑過去看得到完整資訊 —— 名字被切掉、或想確認顏色時要用。
                    const label =
                      i.name +
                      (fx === "" ? "" : ` —— ${fx}`) +
                      (slot === null ? "" : `　[${slot.name}·${slot.family}]`);
                    return (
                      `<div class="ecell ev"${slot === null ? "" : ` style="--slot:${slot.c}"`}>` +
                      `<span class="cn" title="${esc(label)}">${esc(i.name)}</span>` +
                      (fx === "" ? "" : `<span class="fx" title="${esc(fx)}">${esc(fx)}</span>`) +
                      `${edInput("eventCards", i.key, label)}</div>`
                    );
                  })
                  .join("")}</div>`,
            )
            .join("")
        );
      }

      /** 沒有名冊時這一頁做不了事 —— 要講清楚為什麼，以及下一步按哪裡。 */
      function edNoCatalog() {
        const why = ed?.catalogError
          ? `<div class="hint warn">⚠ ${esc(ed.catalogError)}</div>`
          : `<div class="hint">這一頁要先有一份<b>卡片名冊</b>才畫得出來 ——
               規則檔裡是 <code>cc001_01</code>，名冊才知道那是「艾伯李斯特 L1」。
               名冊從<b>你自己跑著的遊戲</b>讀，讀一次就會存起來，之後沒開遊戲也用得了。</div>`;
        return `<div class="card">
             <div class="row"><span class="dim">卡片名冊</span><span class="bad"><b>還沒有</b></span></div>
             ${why}
             <div class="presets" style="margin-top:8px">
               <button id="edCatalog" ${ed?.connected ? "" : "disabled"}>從遊戲讀取名冊</button>
             </div>
             <div class="hint">${
               ed?.connected
                 ? "遊戲已接上，按下去就會讀。"
                 : "現在還沒接上遊戲 —— 先把遊戲開起來（見「設置 › 連線」）。"
             }</div>
           </div>`;
      }

      PAGES["deck/costedit"] = () => {
        const title = head(
          "編輯 COST",
          "改自己的規則檔。<b>看到的是卡片名稱，不是編號</b> —— 中間那份對照從你自己的遊戲讀。",
        );
        if (ed === null) {
          edLoad(false);
          return title + `<div class="card"><div class="hint">載入中…</div></div>`;
        }
        if (ed.rule === null) {
          return (
            title +
            `<div class="card">
               <div class="row"><span class="dim">規則</span><span class="bad"><b>還沒選</b></span></div>
               <div class="hint">編輯 COST 是<b>改一份既有的規則檔</b>，所以要先有檔案。
                 到「牌組 › Cost 表」選一份 —— 沒有自己的規則就先選
                 <code>unlight-official</code>，那是原版數字的完整四張表，改它就是你的版本了。</div>
             </div>`
          );
        }

        const cat = ed.catalog;
        const unsaved = edUnsavedCount();
        const custom = edCustomCount();
        const size = cat
          ? {
              characters: cat.characters.reduce((n, g) => n + g.cards.length, 0),
              monsters: cat.monsters.reduce((n, g) => n + g.cards.length, 0),
              equipment: cat.equipment.reduce((n, g) => n + g.items.length, 0),
              eventCards: cat.eventCards.reduce((n, g) => n + g.items.length, 0),
            }
          : null;

        const header = `<div class="card">
             <div class="row"><span class="dim">正在編輯</span>
               <span><b>${esc(ed.rule.name)}</b>
                 <input type="text" id="edVersion" value="${esc(ed.rule.version)}" style="width:5.5em;margin-left:6px" />
               </span></div>
             <div class="row"><span class="dim">檔案</span><span>${esc(ed.rule.fileName)}</span></div>
             <div class="row"><span class="dim">未存檔</span><span>${
               unsaved === 0
                 ? '<span class="dim">沒有，都存好了</span>'
                 : `<b class="warn">${unsaved} 格</b>`
             }</span></div>
             <div class="row"><span class="dim">跟原版不同</span><span>${
               custom === 0 ? '<span class="dim">完全照原版</span>' : `${custom} 格`
             }</span></div>
             <div class="presets" style="margin-top:8px">
               <button id="edSave" ${unsaved === 0 ? "disabled" : ""}>存回這個檔</button>
               <button id="edResetTab" class="danger">這一頁全部改回原價</button>
             </div>
             ${edMsg ? `<div class="hint ${edMsg.bad ? "warn" : "good"}">${esc(edMsg.text)}</div>` : ""}
             <div class="hint">存檔會<b>就地覆寫同一個檔</b>，不會多生一份 ——
               核對碼每次都重算。<b>要傳給對手之前記得把版本號改掉</b>（上面那格），
               不然對手會拿舊版本號配到不同內容的規則。</div>
           </div>`;

        if (cat === null) return title + header + edNoCatalog();

        const tabs =
          `<div class="etabs">` +
          ED_TABS.map(
            (t) =>
              `<button data-edtab="${t.id}" aria-selected="${t.id === edTab}">${esc(t.label)}` +
              `<span class="n">${size[t.id]}</span></button>`,
          ).join("") +
          `</div>`;

        const tools = `<div class="row" style="margin-bottom:8px">
             <input type="text" id="edFilter" placeholder="${
               edTab === "eventCards"
                 ? "打名字、效果或顏色找卡（例：聖水、回復、紅）"
                 : "打名字找卡（例：艾伯、聖水、短劍）"
             }" value="${esc(edFilter)}" style="flex:1" />
             <span class="dim" style="font-size:11px">名冊 ${esc(cat.gameVersion)} · ${esc(
               cat.readAt.slice(0, 10),
             )} 讀的</span>
             <button id="edCatalog" ${ed.connected ? "" : "disabled"}>重讀名冊</button>
           </div>`;

        // 價差色階的圖例。⚠ 沒有這一條的話那些顏色只是「有顏色」—— 玩家看得出
        // 兩格不一樣，卻不知道哪一邊是變貴的。放在表格正上方，跟著捲不走。
        const swatch = (cls) => `<b class="lv ${cls}"></b>`;
        const legend = `<div class="evlegend">
             <span>跟原版差</span>
             <span>${["dn5", "dn4", "dn3", "dn2", "dn1"].map(swatch).join("")}&nbsp;便宜 5C 起 ← 1C</span>
             <span>1C → 貴 5C 起&nbsp;${["up1", "up2", "up3", "up4", "up5"].map(swatch).join("")}</span>
           </div>
           <div class="hint" style="margin-top:0">冷色是<b>調便宜</b>、暖色是<b>調貴</b>，
             越深差越多。<b>第五階是上限</b> —— 差 5C 跟差 50C 同一個顏色，
             精確的數字滑過那一格就看得到。沒上色＝跟原版一模一樣。</div>`;

        // 上下鍵的幅度。⚠ 快速鍵的清單**從主程序來**（`editSteps`），畫面不自己
        // 寫死一份 —— 兩份清單遲早會走散。
