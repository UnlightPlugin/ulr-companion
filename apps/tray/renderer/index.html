              edKeepGroup("equipment", edMatch(i.name) || edMatch(g.name), [i.key]),
            ),
          }))
          .filter((g) => g.items.length > 0);
        if (groups.length === 0) return `<div class="hint">${esc(edEmptyText())}</div>`;
        return groups
          .map(
            (g) =>
              `<div class="egroup">${esc(g.name)}` +
              `<span class="sub">${g.charaId === null ? "誰都能帶" : "專武"} · ${g.items.length} 件</span></div>` +
              `<div class="egrid c5">${g.items
                .map(
                  (i) =>
                    `<div class="ecell"><span class="cn" title="${esc(i.name)}">${esc(i.name)}</span>` +
                    `${edInput("equipment", i.key, i.name)}</div>`,
                )
                .join("")}</div>`,
          )
          .join("");
      }

      /**
       * 事件卡的插槽顏色，索引就是名冊裡的 `slotType`（＝遊戲資料的 `type`）。
       *
       * 色票量自遊戲自己的 `event_slot` 貼圖（2026-08-16，八個 frame）。
       * ⚠ 「黑」取的是貼圖的**鏡邊**顏色而不是填色（填色量到 `#0b0a08`）——
       * 純黑貼在這個深色面板上等於沒畫。同一個取捨在上面 `--ink-off` 也做過：
       * 像它，但不要像到看不見。
       */
      const EV_SLOT = [
        { c: "#d82a4e", name: "紅", family: "劍" },
        { c: "#61ca3b", name: "綠", family: "槍" },
        { c: "#038ae9", name: "藍", family: "防禦" },
        { c: "#b403e9", name: "紫", family: "移動" },
        { c: "#ddb13c", name: "黃", family: "特殊" },
        { c: "#f3f4f6", name: "白", family: "機會" },
        { c: "#595142", name: "黑", family: "詛咒" },
        { c: "#bdbdbd", name: "灰", family: "萬用" },
      ];

      /** 名冊沒帶顏色（讀不到那一欄）時回 `null`，呼叫端要能接受沒有顏色。 */
      function edSlot(item) {
        return EV_SLOT[item.slotType] ?? null;
      }

      /**
       * 這張卡的效果說明 —— **名字已經說完的就回空字串**。
       *
       * 110 張裡有 90 張的說明是「此卡當作劍4使用」這種把名字再講一次的樣板，
       * 全部印出來只會讓真正需要讀的那 20 張淹沒在裡面。
       *
       * 判斷方式是「說明裡有沒有出現名字本身」，不是比對那句樣板 —— 樣板的寫法
       * 會隨語言與改版變，而「名字有沒有被複述」在哪一版都成立。認錯的代價也
       * 只是多印一行，不會印錯東西。
       *
       * | 卡          | 說明                     | 顯示   |
       * | ----------- | ------------------------ | ------ |
       * | 劍3·盾3卡   | 此卡當作劍3·盾3使用      | 不顯示 |
       * | Hp恢復      | 回復1點Hp                | 顯示   |
       * | 聚焦卡      | 出牌時,移動階段…加算20點 | 顯示   |
       */
      function edEventEffect(item) {
        const info = item.info ?? "";
        if (info === "") return "";
        const stem = item.name.replace(/(卡|カード)$/, "");
        return stem !== "" && info.includes(stem) ? "" : info;
      }

      /** 事件卡篩選：名字、效果、顏色都算數（打「紅」找得到所有紅卡）。 */
      function edEventMatch(item) {
        if (edFilter === "") return true;
        const slot = edSlot(item);
        return (
          edMatch(item.name) ||
          edMatch(item.info ?? "") ||
          (slot !== null && (edMatch(slot.name) || edMatch(slot.family)))
        );
      }

      /** 左邊那條色帶是什麼意思。**規則寫出來** —— 光看顏色猜不到灰色是萬用。 */
      function edEventLegend() {
        const swatches = EV_SLOT.map(
          (s) =>
            `<span><b style="background:${s.c}"></b>${esc(s.name)}<span class="dim">·${esc(
              s.family,
            )}</span></span>`,
        ).join("");
        return (
          `<div class="evlegend"><span>插槽色</span>${swatches}</div>` +
          `<div class="hint" style="margin-top:0">一張事件卡只放得進角色卡上<b>同色</b>的事件插槽 ——
             <b>灰是萬用</b>，哪一格都放得進去。⚠ 顏色跟名字上的等級<b>沒有</b>對應關係
             （「劍3·盾3卡」是紅的，「劍5·槍5卡」卻是萬用），所以定價前先看這條色帶：
             紅卡再便宜，紅槽少的角色也帶不動。</div>`
        );
      }

      /** 事件卡：族群一塊，一排 9 張（劍1~劍9、劍3·槍1~劍5·移動1…）。 */
      function edEvents(cat) {
        const groups = cat.eventCards
          .map((g) => ({
            ...g,
            items: g.items.filter((i) => edKeepGroup("eventCards", edEventMatch(i), [i.key])),
          }))
          .filter((g) => g.items.length > 0);
        if (groups.length === 0) return `<div class="hint">${esc(edEmptyText())}</div>`;
        return (
          edEventLegend() +
          groups
            .map(
              (g) =>
                `<div class="egroup">${esc(g.name)}<span class="sub">${g.items.length} 張</span></div>` +
                `<div class="egrid c9">${g.items
                  .map((i) => {
                    const slot = edSlot(i);
                    const fx = edEventEffect(i);
                    // 滑過去看得到完整資訊 —— 名字被切掉、或想確認顏色時要用。
                    const label =
                      i.name +
                      (fx === "" ? "" : ` —— ${fx}`) +
                      (slot === null ? "" : `　[${slot.name}·${slot.family}]`);
                    return (
                      `<div class="ecell ev"${slot === null ? "" : ` style="--slot:${slot.c}"`}>` +
                      `<span class="cn" title="${esc(label)}">${esc(i.name)}</span>` +
                      (fx === "" ? "" : `<span class="fx" title="${esc(fx)}">${esc(fx)}</span>`) +
                      `${edInput("eventCards", i.key, label)}</div>`
                    );
                  })
                  .join("")}</div>`,
            )
            .join("")
        );
      }

      /** 沒有名冊時這一頁做不了事 —— 要講清楚為什麼，以及下一步按哪裡。 */
      function edNoCatalog() {
        const why = ed?.catalogError
          ? `<div class="hint warn">⚠ ${esc(ed.catalogError)}</div>`
          : `<div class="hint">這一頁要先有一份<b>卡片名冊</b>才畫得出來 ——
               規則檔裡是 <code>cc001_01</code>，名冊才知道那是「艾伯李斯特 L1」。
               名冊從<b>你自己跑著的遊戲</b>讀，讀一次就會存起來，之後沒開遊戲也用得了。</div>`;
        return `<div class="card">
             <div class="row"><span class="dim">卡片名冊</span><span class="bad"><b>還沒有</b></span></div>
             ${why}
             <div class="presets" style="margin-top:8px">
               <button id="edCatalog" ${ed?.connected ? "" : "disabled"}>從遊戲讀取名冊</button>
             </div>
             <div class="hint">${
               ed?.connected
                 ? "遊戲已接上，按下去就會讀。"
                 : "現在還沒接上遊戲 —— 先把遊戲開起來（見「設置 › 連線」）。"
             }</div>
           </div>`;
      }

      PAGES["rule/costedit"] = () => {
        const title = head(
          "編輯 COST",
          "改自己的規則檔。<b>看到的是卡片名稱，不是編號</b> —— 中間那份對照從你自己的遊戲讀。",
        );
        if (ed === null) {
          edLoad(false);
          return title + `<div class="card"><div class="hint">載入中…</div></div>`;
        }
        if (ed.rule === null) {
          return (
            title +
            `<div class="card">
               <div class="row"><span class="dim">規則</span><span class="bad"><b>還沒選</b></span></div>
               <div class="hint">編輯 COST 是<b>改一份既有的規則檔</b>，所以要先有檔案。
                 到「自訂COST › Cost 表」選一份 —— 沒有自己的規則就先選
                 <code>unlight-official</code>，那是原版數字的完整四張表，改它就是你的版本了。</div>
             </div>`
          );
        }

        const cat = ed.catalog;
        const unsaved = edUnsavedCount();
        const custom = edCustomCount();
        const size = cat
          ? {
              characters: cat.characters.reduce((n, g) => n + g.cards.length, 0),
              monsters: cat.monsters.reduce((n, g) => n + g.cards.length, 0),
              equipment: cat.equipment.reduce((n, g) => n + g.items.length, 0),
              eventCards: cat.eventCards.reduce((n, g) => n + g.items.length, 0),
            }
          : null;

        const header = `<div class="card">
             <div class="row"><span class="dim">正在編輯</span>
               <span><b>${esc(ed.rule.name)}</b>
                 <input type="text" id="edVersion" value="${esc(ed.rule.version)}" style="width:5.5em;margin-left:6px" />
               </span></div>
             <div class="row"><span class="dim">檔案</span><span>${esc(ed.rule.fileName)}</span></div>
             <div class="row"><span class="dim">未存檔</span><span>${
               unsaved === 0
                 ? '<span class="dim">沒有，都存好了</span>'
                 : `<b class="warn">${unsaved} 格</b>`
             }</span></div>
             <div class="row"><span class="dim">跟原版不同</span><span>${
               custom === 0 ? '<span class="dim">完全照原版</span>' : `${custom} 格`
             }</span></div>
             <div class="presets" style="margin-top:8px">
               <button id="edSave" ${unsaved === 0 ? "disabled" : ""}>存回這個檔</button>
               <button id="edResetTab" class="danger">這一頁全部改回原價</button>
             </div>
             ${edMsg ? `<div class="hint ${edMsg.bad ? "warn" : "good"}">${esc(edMsg.text)}</div>` : ""}
             <div class="hint">存檔會<b>就地覆寫同一個檔</b>，不會多生一份 ——
               核對碼每次都重算。<b>要傳給對手之前記得把版本號改掉</b>（上面那格），
               不然對手會拿舊版本號配到不同內容的規則。</div>
           </div>`;

        if (cat === null) return title + header + edNoCatalog();

        const tabs =
          `<div class="etabs">` +
          ED_TABS.map(
            (t) =>
              `<button data-edtab="${t.id}" aria-selected="${t.id === edTab}">${esc(t.label)}` +
              `<span class="n">${size[t.id]}</span></button>`,
          ).join("") +
          `</div>`;

        const tools = `<div class="row" style="margin-bottom:8px">
             <input type="text" id="edFilter" placeholder="${
               edTab === "eventCards"
                 ? "打名字、效果或顏色找卡（例：聖水、回復、紅）"
                 : "打名字找卡（例：艾伯、聖水、短劍）"
             }" value="${esc(edFilter)}" style="flex:1" />
             <span class="dim" style="font-size:13px">名冊 ${esc(cat.gameVersion)} · ${esc(
               cat.readAt.slice(0, 10),
             )} 讀的</span>
             <button id="edCatalog" ${ed.connected ? "" : "disabled"}>重讀名冊</button>
           </div>`;

        // 價差色階的圖例。⚠ 沒有這一條的話那些顏色只是「有顏色」—— 玩家看得出
        // 兩格不一樣，卻不知道哪一邊是變貴的。放在表格正上方，跟著捲不走。
        const swatch = (cls) => `<b class="lv ${cls}"></b>`;
        const legend = `<div class="evlegend">
             <span>跟原版差</span>
             <span>${["dn5", "dn4", "dn3", "dn2", "dn1"].map(swatch).join("")}&nbsp;便宜 5C 起 ← 1C</span>
             <span>1C → 貴 5C 起&nbsp;${["up1", "up2", "up3", "up4", "up5"].map(swatch).join("")}</span>
           </div>
           <div class="hint" style="margin-top:0">冷色是<b>調便宜</b>、暖色是<b>調貴</b>，
             越深差越多。<b>第五階是上限</b> —— 差 5C 跟差 50C 同一個顏色，
             精確的數字滑過那一格就看得到。沒上色＝跟原版一模一樣。</div>`;

        // 上下鍵的幅度。⚠ 快速鍵的清單**從主程序來**（`editSteps`），畫面不自己
        // 寫死一份 —— 兩份清單遲早會走散。
        const stepKeys = ed.editSteps ?? [1, 0.5, 0.1, 0.05, 0.01];
        const stepButtons = stepKeys
          .map(
            (n) =>
              `<button class="tier" data-step="${n}"${edStep === n ? ' aria-selected="true"' : ""}>${n}</button>`,
          )
          .join("");
        const steps = `<div class="row" style="margin:2px 0 8px">
             <span class="dim">上下鍵每次 ±</span>
             <span>${stepButtons}
               <input id="edStep" type="number" min="0.01" max="100" step="0.01"
                      style="width:5em;margin-left:6px" value="${edStep}" />
             </span>
           </div>
           <div class="hint" style="margin-top:0">按鍵盤上下鍵、或滑鼠在格子上滾輪時一次動多少。
             預設 <b>1</b>：COST 幾乎都是整數，0.01 的意思是「13 調到 14 要按一百次」。
             要更細的自己打一個數字（壓 C 邊界那種 x.99 就會用到）。<b>記在設定裡</b>。</div>`;

        // ── 官方還沒出的卡 ───────────────────────────────────────────────
        //
        // ⚠ **只藏顯示，草稿與存檔照樣含那些鍵。** 從資料裡拿掉的話，官方哪天
        // 開放了（凱倫貝克 R5 就是 2026-08-17 開的），那份規則會安靜地把它算成
        // 99C（`UNKNOWN_COST`），而玩家帶著一張合法的卡會被自己的規則判超標。
        const lockedN = edLockedCount();
        const locks =
          lockedN === 0
            ? ""
            : `<div class="row" style="margin:2px 0 8px">
                 <span class="dim">官方還沒出的卡</span>
                 <span>${lockedN} 張
                   <button id="edHideLocked" class="tier"${edHideLocked ? ' aria-selected="true"' : ""}>${
                     edHideLocked ? "已藏起來" : "顯示中"
                   }</button>
                 </span></div>
               <div class="hint" style="margin-top:0">資產裡有完整資料（數值、技能、插槽都是好的），但
                 <b>沒有任何配方做得出來</b> —— 沒有人帶得上場，所以定價也沒有意義。
                 判準是遊戲自己的升級圖，<b>官方一開放就會自己跟上</b>（不必更新插件，按一次「重讀名冊」即可）。<br />
                 ⚠ 藏起來的只是<b>畫面</b>：它們照樣留在草稿裡、存檔照樣寫進規則檔。
                 從規則裡拿掉的話，官方開放的那天你的規則會把它算成 <b>99C</b>。</div>`;

        // 最小單位檢查。⚠ 這是**檢查**，不是限制 —— 它不擋存檔、也不會去改你的
        // 數字，只把不合的格子找出來。1186 格裡混進一個 18.5 用眼睛是找不到的。
        const off = edOffCounts();
        const unitKeys = ed.editUnits ?? [1, 0.5, 0.25, 0.2, 0.1];
        const unitButtons = unitKeys
          .map(
            (n) =>
              `<button class="tier" data-unit="${n}"${edUnit === n ? ' aria-selected="true"' : ""}>${n}</button>`,
          )
          .join("");
        const breakdown = ED_TABS.filter((t) => off[t.id] > 0)
          .map((t) => `${esc(t.label)} ${off[t.id]}`)
          // 壓 C 在另一頁，所以要標出來 —— 不然「只看這些」按下去會什麼都沒有，
          // 而計數還寫著有幾格不合。
          .concat(off.bands > 0 ? [`壓 C ${off.bands} 段（在「編輯規則」那一頁）`] : [])
          .join("、");
        const unit = `<div class="row" style="margin:2px 0 8px">
             <span class="dim">最小單位</span>
             <span><button class="tier" data-unit="0"${edUnit === 0 ? ' aria-selected="true"' : ""}>不檢查</button>
               ${unitButtons}
               <input id="edUnit" type="number" min="0" max="100" step="0.01"
                      style="width:5em;margin-left:6px" value="${edUnit}" />
             </span></div>
           ${
             edUnit === 0
               ? `<div class="hint" style="margin-top:0">選一個單位，插件就會把<b>不是它整數倍</b>的格子框起來 ——
                    1186 格裡混進一個 18.5，用眼睛是找不到的。<b>不擋存檔、也不會動你的數字</b>，只是找出來。</div>`
               : `<div class="row"><span class="dim">不合單位</span><span>${
                   off.total === 0
                     ? // ⚠ 這句涵蓋四張表**加上壓 C**。只查表的話它是假的全部通過。
                       '<span class="good">沒有，四張表與壓 C 都是 ' +
                       esc(String(edUnit)) +
                       " 的倍數</span>"
                     : `<b class="warn">${off.total} 格</b>${
                         breakdown === "" ? "" : `<span class="dim">（${breakdown}）</span>`
                       }
                        <button id="edOnlyOff" class="tier"${
                          edOnlyOff ? ' aria-selected="true"' : ""
                        }>${edOnlyOff ? "看全部" : "只看這些"}</button>`
                 }${
                   // ⚠ 藏起來的那些**分開報**。併進上面那個數字的話，會出現
                   // 「說有 3 格不合，按『只看這些』卻一格都沒有」。
                   off.hidden > 0
                     ? `<div class="hint" style="margin:4px 0 0">另有 <b>${off.hidden} 格</b>在<b>官方還沒出的卡</b>上（正被藏著，改不到）。
                          要處理的話先把上面那顆切成「顯示中」。</div>`
                     : ""
                 }</span></div>
                  <div class="hint" style="margin-top:0">${
                    // ⚠ 湊不出剛好 1C 的單位要**當場講**。作者設 0.33 多半是想要
                    // 「三張湊 1C」，而 0.33×3 = 0.99 —— 那個 0.01 的缺口不講的話，
                    // 他會在整張表定完價、甚至傳給對手之後才發現。
                    (() => {
                      const r = edUnitReach(edUnit);
                      if (r === null) return "";
                      const head = `${r.count} 個 ${esc(String(edUnit))} 湊得出剛好 ${r.whole}C。`;
                      return r.makesOne
                        ? head
                        : `${head} ⚠ 但<b>湊不出剛好 1C</b> —— 引擎的最小刻度是 0.01，
                             而 ${esc(String(edUnit))} 除不盡 1。想要「三張合起來剛好 1C」的話，
                             三分之一在兩位小數裡表達不出來，最接近的做法是把那三張定成
                             <code>0.33 / 0.33 / 0.34</code>。`;
                    })()
                  }
                    這個值<b>記在設定裡，但不會寫進規則檔</b> —— 規則檔沒有「最小單位」這個欄位。
                    要讓拿到規則的人知道，請自己寫進「<b>編輯描述</b>」的說明欄（那一段在「Cost 表」那一頁讀得到）。</div>`
           }`;

        const body =
          edTab === "characters"
            ? edCharacters(cat)
            : edTab === "monsters"
              ? edMonsters(cat)
              : edTab === "equipment"
                ? edEquipment(cat)
                : edEvents(cat);

        return (
          title +
          header +
          tabs +
          tools +
          `<div class="card">${legend}${steps}${locks}${unit}${body}</div>`
        );
      };

      // --- 自訂COST › 編輯規則 -----------------------------------------------
      //
      // 「編輯 COST」改的是**價格**（1186 個數字格），這一頁改的是**規則本身**。
      // 目前規則裡除了價格以外唯一有行為意義的欄位就是壓 C（`compressionRule`），
      // 所以這一頁現在只有壓 C。原版那份與自訂那份都改得動 —— 它們是同一種檔案，
      // 差別只在裡面的數字。
      //
      // ⚠ 隊伍 COST 上限**刻意不在這裡**。它是<b>對戰環境</b>的屬性而不是規則的
      // 屬性（伺服器按頻道下發，客戶端裡根本沒有這個常數），約定值填在「配對」
      // 那一頁 —— 見 docs/official-cost-rule.md 的「上限不在規則裡」。

      /** 這一頁的全部狀態。`null` = 還沒載入。 */
      let rl = null;
      let rlMsg = null;
      let rlLoading = false;

      const onRulePage = () => tab === "rule" && sub === "ruleedit";

      /** 官方的兩段。「改回原版壓 C」那顆按的就是它。 */
      const RL_OFFICIAL = [
        { minGap: 7, maxGap: 13, extraCost: 5 },
        { minGap: 14, maxGap: null, extraCost: 10 },
      ];

      function rlLoad(force) {
        if (rlLoading) return;
        if (rl !== null && !force) return;
        rlLoading = true;
        window.ulr.editor.load().then((payload) => {
          rlLoading = false;
          const bands = (payload.compression?.bands ?? []).map((b) => ({
            minGap: b.minGap,
            // ⚠ 主程序那邊「沒有上界」是**欄位不存在**，這裡一律正規化成 null。
            // 留著 undefined 的話 `b.maxGap === null` 那些判斷會全部漏掉它。
            maxGap: b.maxGap === undefined || b.maxGap === null ? null : b.maxGap,
            extraCost: b.extraCost,
          }));
          rl = { rule: payload.rule, bands, saved: JSON.stringify(bands) };
          if (onRulePage()) renderBody();
        });
      }

      /** 跟檔案裡存著的不一樣嗎 —— 決定存檔鈕。 */
      function rlDirty() {
        return rl !== null && JSON.stringify(rl.bands) !== rl.saved;
      }

      /**
       * 存不下去的錯。**跟主程序那邊是同一套判準**（`validateCostRule` 的
       * `band.*`），先在畫面上擋是為了讓玩家看到是哪一段，而不是存檔時收到
       * 一句 JSON Pointer。
       */
      function rlIssues(bands) {
        const bad = [];
        bands.forEach((b, i) => {
          if (!Number.isFinite(b.minGap) || !Number.isFinite(b.extraCost)) {
            bad.push(`第 ${i + 1} 段有欄位空著或不是數字。`);
          }
          if (b.maxGap !== null && b.maxGap < b.minGap) {
            bad.push(`第 ${i + 1} 段的上界 ${b.maxGap} 比下界 ${b.minGap} 小。`);
          }
        });
        if (bands.filter((b) => b.maxGap === null).length > 1) {
          bad.push("只能有一段留空上界（＝無上界），否則兩段一定重疊。");
        }
        const sorted = bands.map((b, i) => ({ ...b, i })).sort((a, b) => a.minGap - b.minGap);
        for (let n = 1; n < sorted.length; n++) {
          const prev = sorted[n - 1];
          const cur = sorted[n];
          const end = prev.maxGap === null ? Infinity : prev.maxGap;
          if (cur.minGap <= end) {
            bad.push(
              `第 ${prev.i + 1} 段與第 ${cur.i + 1} 段重疊 —— 同一個差距會對應到兩個追加值。`,
            );
          }
        }
        return bad;
      }

      /**
       * 兩段之間的縫隙。**這是警告不是錯誤**，但它是這個表最容易踩的坑。
       *
       * 點狀區間（`[7,7]`、`[8,8]`…）碰到**小數差距**會整段落空：角色 COST 一旦
       * 有小數，差距就是小數，而 7.5 在 [7,7] 與 [8,8] 之間一段都不中 →
       * 完全不罰，而且完全沒有提示。2026-08-15 的 `shinon/squeeze-band` 就是
       * 這樣整條曲線消失的，所以規則檔的上界才寫成 x.99。
       */
      function rlHoles(bands) {
        const sorted = bands
          .filter((b) => Number.isFinite(b.minGap))
          .map((b, i) => ({ ...b, i }))
          .sort((a, b) => a.minGap - b.minGap);
        const holes = [];
        for (let n = 1; n < sorted.length; n++) {
          const prev = sorted[n - 1];
          const cur = sorted[n];
          if (prev.maxGap === null) continue;
          if (cur.minGap > prev.maxGap) holes.push([prev.maxGap, cur.minGap]);
        }
        return holes;
      }

      /** 一個差距落在哪一段 → 追加多少。跟引擎同一套語義（照陣列順序取第一個命中的）。 */
      function rlExtraFor(bands, gap) {
        for (const b of bands) {
          if (!Number.isFinite(b.minGap)) continue;
          if (gap < b.minGap) continue;
          if (b.maxGap !== null && gap > b.maxGap) continue;
          return b.extraCost;
        }
        return 0;
      }

      function rlNum(v) {
        return v === null || v === undefined || Number.isNaN(v) ? "" : String(v);
      }

      /** 警告區塊的內容（重疊、縫隙）。改一格數字要立刻跟著變。 */
      function rlWarnHtml(bands) {
        const issues = rlIssues(bands);
        const holes = rlHoles(bands);
        return (
          (issues.length > 0
            ? `<div class="hint warn">⚠ ${issues.map(esc).join("<br />⚠ ")}</div>`
            : "") +
          (holes.length > 0
            ? `<div class="hint warn">⚠ 這幾段之間有縫隙：${holes
                .map(([a, b]) => `${a} ~ ${b}`)
                .join("、")}。<br />
                 整數差距不會掉進去，但<b>小數會</b> —— 角色 COST 只要有一個 13.2，
                 差距就是小數，落在縫隙裡就是<b>完全不罰</b>，而且沒有任何提示。
                 按上面那顆會把每一段的上界頂到下一段起點的前 0.01。</div>`
            : "")
        );
      }

      /** 試算表：差距 0~29 各追加多少。 */
      function rlPreviewHtml(bands) {
        return (
          `<div class="egrid c10" style="margin-top:6px">
             ${Array.from({ length: 30 }, (_, g) => `<div class="slot">${g}</div>`).join("")}
           </div>` +
          `<div class="egrid c10">
             ${Array.from({ length: 30 }, (_, g) => {
               const x = rlExtraFor(bands, g);
               return `<div class="ecell"><input type="text" readonly class="${
                 x > 0 ? "dirty" : ""
               }" value="${x === 0 ? "" : `+${x}`}" /></div>`;
             }).join("")}
           </div>`
        );
      }

      /**
       * 改一格數字之後把**衍生的那幾塊**重畫。
       *
       * ⚠ **不能整頁重畫。** `renderBody()` 是換掉 `#content` 的 innerHTML，
       * 玩家正在打字的那個輸入框會連同焦點一起消失 —— 每按一個鍵就要重新點一次。
       * 編輯 COST 那一頁踩過同一件事（700 個欄位），這裡只是欄位少而已。
       */
      function rlRefresh() {
        if (rl === null) return;
        const warn = $("rlWarn");
        if (warn) warn.innerHTML = rlWarnHtml(rl.bands);
        const preview = $("rlPreview");
        if (preview) preview.innerHTML = rlPreviewHtml(rl.bands);
        const dirty = rlDirty();
        const save = $("rlSave");
        if (save) save.disabled = !dirty || rlIssues(rl.bands).length > 0;
        const cell = $("rlDirtyCell");
        if (cell) {
          cell.innerHTML = dirty
            ? '<b class="warn">有改動</b>'
            : '<span class="dim">沒有，都存好了</span>';
        }
      }

      PAGES["rule/ruleedit"] = () => {
        const title = head(
          "編輯規則",
          "改規則檔裡<b>不是價格</b>的那一半。目前是壓 C —— 差距多少罰多少，一段一排。",
        );
        if (rl === null) {
          rlLoad(false);
          return title + `<div class="card"><div class="hint">載入中…</div></div>`;
        }
        if (rl.rule === null) {
          return (
            title +
            `<div class="card">
               <div class="row"><span class="dim">規則</span><span class="bad"><b>還沒選</b></span></div>
               <div class="hint">編輯規則是<b>改一份既有的規則檔</b>，所以要先有檔案。
                 到「自訂COST › Cost 表」選一份 —— 沒有自己的規則就先選
                 <code>unlight-official</code>，那份的壓 C 就是原版的兩段。</div>
             </div>`
          );
        }

        const bands = rl.bands;
        const issues = rlIssues(bands);
        const dirty = rlDirty();

        const header = `<div class="card">
             <div class="row"><span class="dim">正在編輯</span>
               <span><b>${esc(rl.rule.name)}</b>
                 <input type="text" id="rlVersion" value="${esc(rl.rule.version)}" style="width:5.5em;margin-left:6px" />
               </span></div>
             <div class="row"><span class="dim">檔案</span><span>${esc(rl.rule.fileName)}</span></div>
             <div class="row"><span class="dim">壓 C</span><span>${
               bands.length === 0 ? '<span class="dim">這份規則不壓 C</span>' : `${bands.length} 段`
             }</span></div>
             <div class="row"><span class="dim">未存檔</span><span id="rlDirtyCell">${
               dirty ? '<b class="warn">有改動</b>' : '<span class="dim">沒有，都存好了</span>'
             }</span></div>
             <div class="presets" style="margin-top:8px">
               <button id="rlSave" ${dirty && issues.length === 0 ? "" : "disabled"}>存回這個檔</button>
               <button id="rlOfficial">改回原版兩段</button>
               <button id="rlClear" class="danger">清空（不壓 C）</button>
             </div>
             ${rlMsg ? `<div class="hint ${rlMsg.bad ? "warn" : "good"}">${esc(rlMsg.text)}</div>` : ""}
             <div class="hint">存檔會<b>就地覆寫同一個檔</b>，核對碼重算 ——
               跟「編輯 COST」是同一個檔案的兩半，兩邊互不影響。
               <b>要傳給對手之前記得改版本號</b>（上面那格）。<br />
               ⚠ 壓 C 改完<b>立刻生效</b>，不用重載遊戲（它攔的是遊戲的計算函式）；
               價格才要重載。</div>
           </div>`;

        const rows = bands
          .map(
            (b, i) => `<div class="bandrow">
               <span class="lbl">${i + 1}.</span>
               <span class="lbl">差距</span>
               <input type="number" step="0.01" data-rb="${i}" data-rf="minGap" value="${esc(rlNum(b.minGap))}" />
               <span class="lbl">～</span>
               <input type="number" step="0.01" data-rb="${i}" data-rf="maxGap" value="${esc(rlNum(b.maxGap))}" placeholder="無上界" />
               <span class="lbl">追加</span>
               <input type="number" step="0.01" data-rb="${i}" data-rf="extraCost" value="${esc(rlNum(b.extraCost))}" />
               <button data-rbdel="${i}" title="刪掉這一段">✕</button>
             </div>`,
          )
          .join("");

        const table = `<div class="card">
             <div class="row"><span class="dim">壓 C 區間</span>
               <span class="dim">上界留空＝無上界</span></div>
             ${
               bands.length === 0
                 ? `<div class="hint">一段都沒有 —— 這份規則<b>完全不壓 C</b>。
                      那跟「用原版」是兩回事：原版是 7~13 罰 5、14 以上罰 10。</div>`
                 : rows
             }
             <div class="presets">
               <button id="rlAdd">新增一段</button>
               <button id="rlSort">照差距排序</button>
               <button id="rlSnap">把上界頂到下一段（補小數縫隙）</button>
             </div>
             <div id="rlWarn">${rlWarnHtml(bands)}</div>
             <div class="hint">壓 C 是<b>隊內每一對出戰卡</b>各判一次，三張就是三對。
               <b>怪物卡也算</b>（它跟角色共用那三個槽位）；裝備與事件卡計入總和但不參與壓 C。<br />
               遊戲畫面上每張卡底下的 <code>+N</code> 會貼在<b>那一對裡比較便宜的那張</b>
               —— 壓 C 罰的就是被夾帶進來的低 C 卡。三格的和等於總罰則。</div>
           </div>`;

        // 對照表：一眼看出這條曲線長什麼樣。
        const preview = `<div class="card">
             <div class="row"><span class="dim">試算</span><span class="dim">差距 → 追加</span></div>
             <div id="rlPreview">${rlPreviewHtml(bands)}</div>
             <div class="hint">上排是<b>兩張卡的 COST 差距</b>，下排是這條曲線要追加多少。
               空白＝不罰。小數差距請看上面的縫隙警告 —— 這張表只列整數。</div>
           </div>`;

        return title + header + table + preview;
      };

      // --- 自訂COST › 編輯描述 -----------------------------------------------
      //
      // 規則檔的第三半：不是價格、也不是壓 C 的那些欄位 —— 名字、作者、版本、
      // 適用範圍、更新說明。
      //
      // ⚠ **每一個欄位都會進 contentHash。** 整個 rule 物件就是雜湊的對象，所以
      // 改個作者名字核對碼就會變，而核對碼正是玩家拿去跟對手核對的東西。這件事
      // 一定要寫在畫面上，否則會有人以為「只有數字算數」。
      //
      // ⚠ `restrictions`（限制條款）**不在這裡**：schemaVersion 1 的它是
      // `agreement-only` 的自由文字，引擎永遠不解析（§12）。做一個編輯器給一個
      // 沒有任何行為的欄位，只會讓人以為插件會強制它。

      let rd = null;
      let rdMsg = null;
      let rdLoading = false;
      const onDescPage = () => tab === "rule" && sub === "ruledesc";

      const RD_FIELDS = [
        {
          key: "name",
          label: "名稱",
          hint: "玩家在「Cost 表」那一頁看到的名字。",
          max: 80,
        },
        {
          key: "version",
          label: "版本",
          hint: "SemVer（<code>1.2.0</code>）。⚠ <b>發出去過的版本號不要重用</b> —— 對手手上那份會頂著同樣的號碼、不同的內容。",
          max: 20,
        },
        {
          key: "ruleSetId",
          label: "規則族",
          hint: "<code>作者代號/規則代號</code>，只能小寫英數與連字號。⚠ <b>配對是照這個分隊的</b>：改了它，你就跟原本那條隊伍上的所有人分開了。",
          max: 79,
        },
        {
          key: "publisherId",
          label: "作者代號",
          hint: "⚠ 必須跟「規則族」的<b>前半段一模一樣</b>，不然存不進去（那是作者歸屬的依據）。",
          max: 39,
        },
        { key: "publisherName", label: "作者名稱", hint: "顯示用的名字，中文可以。", max: 60 },
        {
          key: "publisherContact",
          label: "聯絡方式",
          hint: "選填。Discord 之類，讓拿到規則的人找得到你。",
          max: 120,
        },
        {
          key: "gameVersion",
          label: "遊戲版本",
          hint: "這份表是照哪一版的遊戲做的，格式 <code>2026.08</code>。",
          max: 7,
        },
      ];

      function rdLoad(force) {
        if (rdLoading) return;
        if (rd !== null && !force) return;
        rdLoading = true;
        window.ulr.editor.load().then((payload) => {
          rdLoading = false;
          rd = {
            rule: payload.rule,
            meta: payload.meta ? { ...payload.meta } : null,
            saved: payload.meta ? JSON.stringify(payload.meta) : null,
          };
          if (onDescPage()) renderBody();
        });
      }

      function rdDirty() {
        return rd?.meta !== null && JSON.stringify(rd?.meta) !== rd?.saved;
      }

      PAGES["rule/ruledesc"] = () => {
        const title = head(
          "編輯描述",
          "規則檔裡<b>不是數字</b>的那些欄位 —— 名字、作者、版本、說明。",
        );
        if (rd === null) {
          rdLoad(false);
          return title + `<div class="card"><div class="hint">載入中…</div></div>`;
        }
        if (rd.meta === null) {
          return (
            title +
            `<div class="card">
               <div class="row"><span class="dim">規則</span><span class="bad"><b>還沒選</b></span></div>
               <div class="hint">要先有檔案才改得動。到「自訂COST › Cost 表」選一份 ——
                 沒有自己的規則就先選 <code>unlight-official</code>，改完它就是你的版本了。</div>
             </div>`
          );
        }

        const m = rd.meta;
        const dirty = rdDirty();

        const rows = RD_FIELDS.map(
          (fd) => `<div class="row"><span class="dim">${esc(fd.label)}</span>
               <span><input type="text" data-rd="${fd.key}" maxlength="${fd.max}"
                      value="${esc(m[fd.key] ?? "")}" style="width:16em" /></span></div>
             <div class="hint">${fd.hint}</div>`,
        ).join("");

        const appliesOpts = [
          ["duel", "duel（約戰）"],
          ["quest", "quest（任務）"],
          ["any", "any（都可以）"],
        ]
          .map(
            ([v, label]) =>
              `<option value="${v}"${m.appliesTo === v ? " selected" : ""}>${esc(label)}</option>`,
          )
          .join("");

        return (
          title +
          `<div class="card">
             <div class="row"><span class="dim">檔案</span><span>${esc(rd.rule.fileName)}</span></div>
             <div class="row"><span class="dim">目前核對碼</span><span>${
               rd.rule.shortHash
                 ? `<code>${esc(rd.rule.shortHash)}</code>`
                 : '<span class="dim">裸規則，沒有核對碼</span>'
             }</span></div>
             <div class="row"><span class="dim">未存檔</span><span id="rdDirtyCell">${
               dirty ? '<b class="warn">有改動</b>' : '<span class="dim">沒有，都存好了</span>'
             }</span></div>
             <div class="presets" style="margin-top:8px">
               <button id="rdSave" ${dirty ? "" : "disabled"}>存回這個檔</button>
             </div>
             ${rdMsg ? `<div class="hint ${rdMsg.bad ? "warn" : "good"}">${esc(rdMsg.text)}</div>` : ""}
             <div class="hint">⚠ <b>這一頁的每個欄位都會改變核對碼</b> ——
               整份規則（含名字與作者）就是雜湊的對象。改完記得把檔案傳給對手，
               不然兩邊核對碼對不起來。</div>
           </div>
           <div class="card">
             ${rows}
             <div class="row"><span class="dim">適用範圍</span>
               <span><select data-rd="appliesTo">${appliesOpts}</select></span></div>
             <div class="hint">給人看的宣告，引擎不會拿它擋任何事。</div>
             <div class="row"><span class="dim">隊伍 COST 上限</span>
               <span><input type="number" step="0.01" min="0" data-rd="teamCostLimit"
                      value="${esc(String(m.teamCostLimit))}" style="width:6em" /></span></div>
             <div class="hint"><b>0 = 不設限</b>，而那是正常的 —— UNLIGHT 的 COST 上限是
               <b>伺服器按頻道下發</b>的，客戶端裡根本沒有這個常數。
               <b>快速比賽的檔位也不看這一格</b>，它是照牌組算的。</div>
           </div>
           <div class="card">
             <div class="row"><span class="dim">說明</span></div>
             <textarea data-rd="description" rows="4" maxlength="2000"
               style="width:100%">${esc(m.description ?? "")}</textarea>
             <div class="hint">這份規則想解決什麼問題。清空就是「沒有說明」。</div>
             <div class="row" style="margin-top:10px"><span class="dim">更新說明</span></div>
             <textarea data-rd="changelog" rows="4" maxlength="2000"
               style="width:100%">${esc(m.changelog ?? "")}</textarea>
             <div class="hint">這一版改了什麼。拿到規則的人靠它知道要不要跟著更新。</div>
           </div>`
        );
      };

      // --- 自訂COST › 對戰地點 -----------------------------------------------
      //
      // ⚠⚠ **這一頁曾經是「自動配對」，整整六張卡。** 排隊狀態、頻道資訊、兩份
      // COST 對照、開房設定、規則卡、房間清單 —— 要滑三個畫面才看得完，而玩家
      // 坐下來只想按一顆按鈕打一場。
      //
      // 那一整套搬回遊戲裡了：WP-17 在迪城大廳畫的那顆「快速比賽」跟亞城那顆
      // 長得一樣，人數、等待視窗、錯誤對話框全都是遊戲自己的。托盤這邊只留下
      // **遊戲裡按不到的那一格**：這一場開在哪。
      //
      // ⚠ **這一頁不輪詢，也沒有任何會操作遊戲的東西。** 它讀快照、寫設定檔，
      // 就這樣。
      //
      // ⚠ 長話一律進 ⓘ（`info()`）。留在畫面上的只有「你現在選的這個會怎樣」
      // 那一句 —— 玩家是來放鬆的，一頁的字要一眼看得完。

      /**
       * 畫面上還沒被下一份快照蓋回去的那一格。
       *
       * ⚠ 真實來源是設定檔（`snap.profile.match`）。這裡留一份是因為 `select`
       * 的 change 與快照回來之間隔著一趟 IPC —— 中間重畫一次的話選單會彈回舊值。
       */
      let mform = null;

      /** 認得的地點代號 → 「007 峰亥盧遺跡」。清單從主程序來（見 `Snapshot`）。 */
      function stageName(value) {
        const hit = (snap?.selectableStages ?? []).find((g) => g.value === value);
        return hit ? `${hit.value} ${hit.name}` : String(value);
      }

      // ⚠ 這三段是**這一頁唯一的長文**，而它們住在 `title=` 裡。畫面上看得到的
      // 字要短到一眼看完；要細節的人按 ⓘ。
      const STAGE_TIP =
        "優先權：亞城隨機 ＞ 官方隨機 ＞ 指定的地圖\n" +
        "· 一個人選亞城隨機 → 整場走亞城隨機\n" +
        "· 沒人選亞城隨機、有人選官方隨機 → 官方隨機\n" +
        "· 兩邊各指定一張且不一樣 → 擲骰子二選一\n" +
        "\n" +
        "亞城池是官方選單的 000～009 再加上 011（魔女山谷）。011 在官方開房選單裡選不到，" +
        "插件只驗過客戶端有它的背景圖，沒有在上面打完一整場。\n" +
        "⚠ 選官方隨機或指定地圖也躲不掉它 —— 對手選亞城隨機時整場就走亞城池。";

      const PICK_TIP =
        "開房的只有一方，所以「我指定 007」對另一邊永遠是被決定的。\n" +
        "兩邊指同一張就開那一張；指不同張時擲骰子二選一 —— 那是唯一不偏袒任何一方的解法。";

      const AUTO_TIP =
        "檔位照你的牌組算，你填不到，也不必填：\n" +
        "· 落在這個頻道的官方檔位裡 → 就是那一檔（跟亞城一樣）\n" +
        "· 落在外面 → 這副牌自己那一檔，一檔寬 1.00C 而且有下限（壓 C 才有意義）\n" +
        "· 自訂檔在大廳左下沒有官方的那一行，插件會另外加一列（前面有 ★），沒人在等就不畫\n" +
        "· 排隊中那個等待視窗上會寫著你排的是哪一檔\n" +
        "\n" +
        "房名由系統取（規則名 + [COST:n]），玩家改不了 —— 大廳裡的人要一眼看得出是哪一檔。\n" +
        "固定 3vs3、固定不設遊戲自己的「牌組Cost限制 ±N」。\n" +
        "\n" +
        "⚠ 配到人會直接消耗 AP 並開打。再按一次那顆按鈕就是取消。\n" +
        "⚠ 排隊時每 5 秒確認你還在那個頻道：跑去打別場、退出頻道、換頻道都會自動停止排隊。";

      PAGES["rule/match"] = () => {
        const stage = mform?.stage ?? snap?.profile?.match?.stage ?? "arcadia";

        // ⚠ **選單的順序就是協商的優先權**（見 `@ulr/arbiter-engine` 的
        // `negotiateStage`）。兩者不一致的話這個選單會騙人：玩家會以為排在最
        // 上面的只是「預設」，而它其實是「一個人選就整場照它走」。
        const opts = [
          ["arcadia", "亞城隨機（插件從 11 張裡抽）"],
          ["official", "官方隨機（交給伺服器抽）"],
          ...(snap?.selectableStages ?? []).map((g) => [g.value, `${g.value} ${g.name}`]),
        ]
          .map(
            ([v, label]) =>
              `<option value="${esc(v)}"${stage === v ? " selected" : ""}>${esc(label)}</option>`,
          )
          .join("");

        // 選了這個會怎樣，一句話。⚠ 指定某一張時一定要接那句「對手也要選同一張」
        // —— 少了它，玩家會以為自己選的就是這一場的地點。
        const line =
          stage === "arcadia"
            ? "插件從亞城那 11 張裡抽一張。"
            : stage === "official"
              ? "交給遊戲伺服器抽。"
              : `想開在 ${esc(stageName(stage))}。<b>對手也要選同一張才一定開得成</b>${info(PICK_TIP)}`;

        return (
          head("對戰地點", "配到人之後，這一場開在哪。") +
          `<div class="card">
             <div class="row"><span class="dim">對戰地點</span>
               <span><select id="mStage">${opts}</select>${info(STAGE_TIP)}</span></div>
             <div class="hint">${line}</div>
           </div>
           <div class="card">
             <div class="row"><span class="dim">怎麼開始一場</span>
               <span>在遊戲裡按<b>快速比賽</b></span></div>
             <div class="hint">迪特赫姆與布萊德克洛伊茲的大廳有一顆<b>快速比賽</b> ——
               那是插件放的，跟亞歷山卓城那顆一樣：按下去排隊，配到用同一套規則的人就
               自動開房、自動開打。檔位、房名、3vs3 都是自動的${info(AUTO_TIP)}</div>
           </div>`
        );
      };

      // --- 迪特赫姆 › 隱藏地圖 -----------------------------------------------
      //
      // ⚠ 這一頁跟配對頁一樣，狀態**不在 snapshot 裡** —— 它要跟遊戲要一次
      // （一次 CDP 往返）。開著才輪詢，離開就停。
      let sstate = null;
      let stageTimer = null;
      const onStagePage = () => tab === "diet" && sub === "hidden";

      function startStagePolling() {
        if (stageTimer !== null) return;
        const tick = () =>
          window.ulr.stages.state().then((s) => {
            sstate = s;
            if (!onStagePage()) return;
            // 同配對頁：打字時不重畫，等焦點離開再補（見 `isEditing`）。
            if (isEditing()) {
              scheduleCatchUp();
              return;
            }
            renderBody();
          });
        void tick();
        // 3 秒：這頁唯一會自己變的是「玩家開了一次開房對話框」與「遊戲進大廳了」，
        // 兩件事都不急，但都要在玩家切回來的時候是對的。
        stageTimer = setInterval(tick, 3000);
      }
      function stopStagePolling() {
        if (stageTimer !== null) clearInterval(stageTimer);
        stageTimer = null;
      }

      /**
       * 補丁現在到底怎樣，寫成一句人話。
       *
       * ⚠ 這一頁最重要的一件事，是**分清楚「開關打開」跟「遊戲那邊真的變了」**。
       * 中間隔著三段：遊戲有沒有開、有沒有載到對戰大廳、玩家有沒有開過一次開房
       * 對話框。只寫「已啟用」的話，玩家會打開遊戲、發現選單只有 11 項，然後以為
       * 插件壞了。
       */
      function stageStatusText(enabled, st) {
        if (!enabled) return "未啟用 —— 遊戲的選單維持官方那 11 項";
        if (st === null) return "還沒接上遊戲 —— 開了遊戲就會自己裝上";
        if (!st.installed) {
          return st.waiting ? "等遊戲載到對戰大廳…（不用做任何事，到了就會自己補上）" : "還沒裝上";
        }
        if (!st.dropdownPatched) {
          return "地圖已經加進去了，選單等你在遊戲裡開一次「創建對戰房間」";
        }
        return "生效中";
      }

      // --- 渦 › 獎勵標記 / 結算通知 ----------------------------------------
      //
      // 狀態不在 snapshot 裡（兩支注入腳本各要一次 CDP 往返），開著才輪詢。
      let rstate = null;
      let raidTimer = null;
      const onRaidPage = () =>
        tab === "vortex" &&
        (sub === "vrank" || sub === "vreward" || sub === "vitem" || sub === "vfeed");

      function startRaidPolling() {
        if (raidTimer !== null) return;
        const tick = () =>
          window.ulr.raid.state().then((s) => {
            rstate = s;
            if (!onRaidPage()) return;
            if (isEditing()) {
              scheduleCatchUp();
              return;
            }
            renderBody();
          });
        void tick();
        raidTimer = setInterval(tick, 3000);
      }
      function stopRaidPolling() {
        if (raidTimer !== null) clearInterval(raidTimer);
        raidTimer = null;
      }
      function applyRaidRewardMode(mode) {
        return window.ulr.raid.rewardMode(mode).then((s) => {
          rstate = s;
          renderBody();
        });
      }

      function raidViewText(v) {
        if (v === null) return "還沒接上遊戲 —— 開了遊戲就會自己裝上";
        if (!v.installed) return "還沒裝上" + (v.reason ? "：" + v.reason : "");
        if (!v.inRaid) return "已裝上，等你進渦房";
        return "生效中：" + v.rows + " 列清單、" + v.vortices + " 顆地圖渦";
      }

      const RAID_MARK_TIP =
        "2026-09-23 改版後渦清單不再給 TL。碎片色（黃＝記憶、綠＝時間、藍＝靈魂、紅＝生命、紫＝死亡；圓的是渦幣）" +
        "看渦的 stage 套公式：你打過的渦用那場戰鬥的 stage、自己發現的渦用發現時的 stage，其次是 ulgg 觀測站給的；" +
        "都沒有就看插件自己學到的：" +
        "每收到一次渦的結算，把那個渦實際發的東西依「怪物＋渦階＋★＋地圖區塊」記下來（本機 raid-learned.json），" +
        "同一種渦之後直接畫；兩次對不上就不拿來畫。都沒有的渦不畫任何標記 —— 不猜。";
      const RAID_SHARE_TIP =
        "開著的話，你渦清單上的渦（TL、BOSS 狀態、HP）會傳到 Cloudflare Workers（插件作者架的），別人在 SUPPORT 看到同一個渦就查得到；" +
        "你也查得到別人傳的。上面只存渦碼的雜湊，不存渦碼本身、不存分數榜與玩家名字 —— 不知道渦碼的人查不到。" +
        "ulgg 是主要來源，這個是它掛掉或還沒掃到時的備援；同一個渦取比較新的那份。";
      const RAID_TEAM_TIP =
        "每打完一場渦，插件記下用的那副牌、選的回合、花的 AP、戰鬥中打掉的傷害，回到渦房後看排行榜上自己的分數漲了多少。" +
        "開著的話這些會傳到 Cloudflare Workers（插件作者架的），同一個渦裡開插件的人在渦的詳細畫面點排行榜上你的名字就看得到；你也看得到別人的。" +
        "上面的渦（發現者＋發現時刻）與名字都只存雜湊（名字是跟渦一起算的），不在那個渦裡的人查不到，也串不起你打過哪些渦。" +
        "關掉後下一輪會把 Cloudflare Workers 上你的隊伍撤掉；自己的隊伍在自己的畫面上照樣看得到。";
      const RAID_PUBLIC_TIP =
        "SUPPORT 那份公開渦清單伺服器不給 TL，圖示是靠 ulgg.online 的觀測站對渦碼查來的，" +
        "只在你人在渦房時每 30 秒問一次；ulgg 掛了就只是沒圖示，其他功能照常。";

      PAGES["vortex/vrank"] = () => {
        const s = rstate;
        const v = s?.view ?? null;
        const state = `<div class="card">
            <div class="row"><span class="dim">狀態</span><span>${esc(raidViewText(v))}</span></div>
            <div class="row"><span class="dim">公開渦表${info(RAID_PUBLIC_TIP)}</span><span>${v?.publicCount ?? 0} 筆</span></div>
            ${v?.reason && v.installed ? `<div class="hint warn">⚠ ${esc(v.reason)}</div>` : ""}
          </div>`;
        const what = `<div class="card">
            <div class="hint" style="margin-top:0">
              <b>渦房裡會多出來的東西</b>${info(RAID_MARK_TIP)}<br />
              · 清單：名字右邊接碎片色，排名獎勵有魔之素材／書籤的再接那張圖<br />
              · 地圖：渦照碎片色上色，還不知道的是灰色；素材渦上方掛圖，自己開的渦紅框<br />
              · 點進渦之後多一顆「獎勵一覽」：發現／參加／每一檔排名／擊破，自己現在那一檔亮一點<br />
              · Profound 計數下面的「Refresh」：等於重進渦房（渦清單、AP、死渦的結算一起重讀），順便馬上重查 Cloudflare Workers<br />
              · 詳細畫面的排行榜：有隊伍紀錄的名字後面多一顆牌組圖示，點名字看那個人打這個渦用的隊伍<br />
              · SUPPORT 清單：已經通報過、碎片知道了的渦，名字右邊接碎片色（見「渦通報」）
            </div>
            <div class="hint">
              改版後客戶端不再給每個人的傷害，傷害統計先停用（打渦隊伍的傷害改成插件在戰鬥中自己算）。
            </div>
          </div>`;
        const share = `<div class="card">
            <label class="toggle">
              <input type="checkbox" id="raidShareOn" ${s?.share !== false ? "checked" : ""} />
              <span><b>和其他插件玩家互傳渦狀態</b>${info(RAID_SHARE_TIP)}
                <div class="hint">
                  ulgg 掛了或還沒掃到的公開渦，靠其他開插件的玩家補上。Discord 的公開渦通報也靠這個（見「渦通報」）。
                </div>
              </span>
            </label>
            <label class="toggle">
              <input type="checkbox" id="raidTeamShareOn" ${s?.teamShare !== false ? "checked" : ""} ${s?.share === false ? "disabled" : ""} />
              <span><b>分享打渦用的隊伍</b>${info(RAID_TEAM_TIP)}
                <div class="hint">
                  別人點你的名字看得到你用哪副牌、打了幾場、幾回合、幾 AP、多少傷害 —— 給不知道該帶什麼、該花多少 AP 的新手參考。
                  ${s?.share === false ? "（要先打開上面的互傳）" : ""}
                </div>
              </span>
            </label>
          </div>`;
        return head("獎勵標記", "渦打倒後發什麼，直接畫在渦房裡。") + state + share + what;
      };

      function raidRewardText(r) {
        if (r === null) return "還沒接上遊戲 —— 開了遊戲就會自己裝上";
        if (!r.installed) return "還沒裝上" + (r.reason ? "：" + r.reason : "");
        // 腳本跑了但掛不上（客戶端改版把方法改名）——不能說生效中
        if (r.reason) return "沒作用：" + r.reason;
        return r.open ? "摘要面板開著" : "生效中";
      }
      const AUTO_DELETE_TIP =
        "刪渦走的是官方「放棄」同一個動作。死渦在結算發下來之前刪掉會不會吃掉獎勵沒人驗過，所以有你一份的會等結算收到才刪。" +
        "死渦的詳細面板上也有開關；在遊戲裡關掉之後，要再開只能在這裡。";
      const REWARD_TIP =

        "原版「抽出」下拉照常能用，兩邊看的是同一個篩選。" +
        "手上沒有指定的那一張時，用等級最接近的（例如選 L5 但只有 L4，就顯示 L4）；一張都沒有的角色不顯示。";
      const FAVORITE_TIP =
        "預覽區右下的「最愛卡片」鈕：把正在看的那一張卡加入／移出最愛（只算那一張，例如 R1 史特靈）。" +
        "「1 Page」右邊的 Favorite 鈕：按下去只顯示最愛卡片，再按一次回到全部。" +
        "Event 分頁也一樣：預覽事件卡時右下的「最愛卡片」收進最愛，格線右下的 Favorite 鈕只顯示最愛的事件卡（跟角色卡的最愛分開記）。" +
        "最愛存在牌組庫裡，有開跨電腦同步的話跟牌組一起同步到其他電腦（牌組替換選「關閉」時用不到）。";
      const CHARA_WEAPON_TIP =
        "Equipment 分頁一律把通用武排在最前面、素材（異化礦材、魔之系列）排最後。" +
        "「抽出」位置的 Chara Weapon 鈕：按下去只顯示通用武與目前牌組角色的專武，素材與手動隱藏的不顯示；再按一次回到全部。" +
        "預覽武器時右下的「隱藏裝備」鈕：把很少用的（叮噹星、可可果之類）藏起來，只在 Chara Weapon 開著時生效。" +
        "隱藏清單跟最愛一樣存在牌組庫、跟著跨電腦同步。";

      PAGES["deck/chara"] = () => {
        const mode = snap?.profile.charaPicker ?? "L5";
        const opt = (value, label) => `<label class="toggle">
            <input type="radio" name="charaPicker" value="${value}" ${mode === value ? "checked" : ""} />
            <span><b>${label}</b></span>
          </label>`;
        return (
          head("人物篩選") +
          `<div class="card">
             <div class="dim" style="margin-bottom:6px">角色一覽用哪一張卡代表${info(CHARA_PICKER_TIP)}</div>
             ${opt("L1", "L1")}
             ${opt("L2", "L2")}
             ${opt("L3", "L3")}
             ${opt("L4", "L4")}
             ${opt("L5", "L5")}
             ${opt("R", "最高等 R 卡")}
             ${opt("off", "關閉")}
           </div>
           <div class="card">
             <div class="dim">最愛卡片${info(FAVORITE_TIP)}</div>
           </div>
           <div class="card">
             <div class="dim">Chara Weapon 與隱藏裝備${info(CHARA_WEAPON_TIP)}</div>
           </div>`
        );
      };

      // --- 牌組 › 等候套用 --------------------------------------------------
      //
      // ⚠ **這一頁刻意只有一格。** 說明全部走 tooltip（ⓘ）—— 面板上多一段字
      // 的代價不是那一段字本身，是它會把「這裡只有一個東西可以調」變成
      // 「這裡有一堆東西要讀」。
      const APPLY_TIP =
        "切了牌組之後等這麼久，才把它寫進伺服器。" +
        "人在牌組編輯畫面時看到的變化是即時的 —— 等的只有伺服器那一份。" +
        "按下開戰／開始任務時會無視這個秒數：那一下會先攔下來，套好牌組才放行。" +
        "0 = 切了馬上寫。";

      PAGES["deck/apply"] = () => {
        const seconds = snap?.profile.applyDelaySeconds ?? 3;
        const lim = snap?.limits ?? {};
        const min = lim.minApplyDelay ?? 0;
        const max = lim.maxApplyDelay ?? 30;
        return (
          head("等候套用") +
          `<div class="card">
             <div class="row">
               <span class="dim">切換牌組後等待${info(APPLY_TIP)}</span>
               <span>
                 <input id="applyDelay" type="number" min="${min}" max="${max}" step="0.5"
                        style="width:5em" value="${seconds}" /> 秒
               </span>
             </div>
           </div>` +
          deckSyncCard()
        );
      };

      const DECK_SYNC_TIP =
        "牌組庫存到 Cloudflare Workers（插件作者架的），同一個角色在另一台電腦登入時自動同步（新增、改牌、改名、刪除、排序都會過去）。" +
        "上面的鍵是角色 id 的雜湊，文件裡沒有玩家名字；每一台電腦「這一房上次選哪一副」各自記。" +
        "兩台同時改同一副時，後改的那一邊贏。連不上就只用這台電腦的，不會把牌組清掉。";

      function deckSyncCard() {
        const on = snap?.profile.deckCloudSync !== false;
        const st = snap?.deckSync ?? null;
        const when = st ? new Date(st.at).toLocaleTimeString() : "";
        const line = !on
          ? "已關閉"
          : st === null
            ? "等牌組庫接上"
            : `${st.ok ? "✓" : "⚠"} ${esc(st.text)}（${when}）`;
        return `<div class="card">
            <label class="toggle">
              <input type="checkbox" id="deckCloudSyncOn" ${on ? "checked" : ""} />
              <span><b>牌組跨電腦同步</b>${info(DECK_SYNC_TIP)}
                <div class="hint">${line}</div>
              </span>
            </label>
          </div>`;
      }

      // --- 設置 › 配置 ------------------------------------------------------
      //
      // ⚠ 這一頁的表格、IPC（window.ulr.profiles.*）與按鈕事件本來就在了，
      // 缺的一直是這支 render 函式 —— 分頁註冊了但 PAGES 沒有對應的鍵，
      // renderBody() 就畫出一片空白。空白頁不會報錯，所以很難發現。
      PAGES["settings/profiles"] = () => {
        const list = snap?.store.profiles ?? [];
        const meId = snap?.profile.id;
        const ports = snap?.gamePorts ?? {};

        const row = (p) => {
          const self = p.id === meId;
          // ⚠ 別份配置只敢說「那個埠上有沒有遊戲在回話」。一個視窗只管一個
          // 客戶端，它沒辦法知道另一份配置的插件狀態。
          const alive = ports[p.port];
          const state = self
            ? snap?.status?.connected
              ? "這個視窗（已接上）"
              : "這個視窗（等遊戲…）"
            : alive === true
              ? "遊戲開著"
              : alive === false
                ? "沒有回應"
                : "—";
          // ⚠ 中間人那一列拿掉了（玩家 2026-10-04）：一律是雲端，畫面上不給改。
          // 輸入與按鈕的事件都是 closest("tr[data-id]") 找配置。
          const cls = self ? " self" : "";
          return `<tr data-id="${esc(p.id)}" class="${cls.trim()}">
              <td><input type="text" data-field="name" value="${esc(p.name)}" /></td>
              <td><select data-field="kind">
                    ${Object.entries(KIND_TEXT)
                      .map(
                        ([k, label]) =>
                          `<option value="${k}"${p.kind === k ? " selected" : ""}>${label}</option>`,
                      )
                      .join("")}
                  </select></td>
              <td><input type="number" data-field="port" value="${p.port}" /></td>
              <td class="state">${esc(state)}</td>
              <td class="acts">
                ${self ? "" : `<button data-act="launch">開新實例</button>`}
                <button data-act="dup">複製</button>
                ${list.length > 1 && !self ? `<button data-act="del">刪除</button>` : ""}
              </td>
            </tr>`;
        };

        const table = list.length
          ? `<table class="profiles">
               <thead><tr><th>名稱</th><th>客戶端</th><th>遊戲埠</th><th>狀態</th><th></th></tr></thead>
               <tbody>${list.map(row).join("")}</tbody>
             </table>`
          : `<div class="hint">清單是空的。按下面的「新增配置」建一份 ——
               第一份預設是桌面版，第二份會自動變成 Chrome 並換一個埠。
               要接 Edge 的話在「客戶端」那一格改成 Edge 即可（它有自己的
               瀏覽器 profile 與埠，跟 Chrome 可以同時開）。</div>`;

        return (
          head("配置", "一個視窗管一個遊戲客戶端。要同時管兩個就建兩份配置，各開一個實例。") +
          `<div class="card">
             ${table}
             <div class="row"><span></span><span><button id="addProfile">新增配置…</button></span></div>
             <!--
               ⚠ 這裡以前有五行說明。留下的兩行是「不知道就會壞掉」的：改埠不重開
               沒有任何反應（引擎綁在啟動時的埠上）、兩份撞同一個埠時第二份是
               **開不起來**而不是報錯。其餘三行（狀態欄的語意、中間人留空＝雲端、
               local 是什麼）都是「看得懂欄位就猜得到」的，刪掉不會有人卡住。
             -->
             <div class="hint">
               ⚠ 改埠要<b>重開那個實例</b>才生效。<br />
               ⚠ 兩份不能用同一個埠 —— 撞到的話第二份會<b>安靜地開不起來</b>。
             </div>
           </div>` +
          (snap?.ephemeral
            ? `<div class="card"><div class="hint warn" style="margin-top:0">
                 這個視窗是命令列開的臨時配置（<b>:${snap.profile.port}</b>），<b>不在清單裡</b>。
                 改它的設定不會存下來 —— 要留著就按上面的「新增配置」。
               </div></div>`
            : "")
        );
      };

      /**
       * 這份配置接哪一種客戶端。換了插件會自己重開（引擎綁在啟動時的客戶端上）。
       *
       * ⚠ 命令列開的臨時配置不給換：它不在清單裡，重開會落到別份配置上。
       */
      function clientKindRow(p) {
        if (!p) return "";
        const opts = Object.entries(KIND_TEXT)
          .map(
            ([k, label]) =>
              `<option value="${k}"${p.kind === k ? " selected" : ""}>${label}</option>`,
          )
          .join("");
        return `<div class="row"><span class="dim">客戶端</span>${
          snap?.ephemeral
            ? `<span>${esc(kindText(p.kind))}</span>`
            : `<select id="clientKind" title="換了之後插件會重開一次">${opts}</select>`
        }</div>`;
      }

      /**
       * ⚠ **這一頁只回答一個問題：插件跟遊戲接上了沒。**（玩家 2026-10-04 指定精簡）
       *
       * 拿掉的東西都有別的地方看得到，或只是排錯用的：
       *   分頁標題、攔截已掛上、側通道 → 狀態列與 戰鬥 › 準備 已經講了
       *   CDP 埠、中間人、我是中間人   → 設置 › 配置 的表格裡有，狀態列最後一句也會報錯
       *
       * 「怎麼接上」的教學**只在還沒接上時出現** —— 接上了還掛著兩張說明卡，
       * 玩家會以為自己哪裡沒做完。
       */
      PAGES["settings/link"] = () => {
        const st = snap?.status;
        const p = snap?.profile;
        const connected = st?.connected === true;
        return (
          head("連線", "插件跟遊戲接上了沒。") +
          `<div class="card">
             <div class="row"><span class="dim">遊戲</span><span class="${
               connected ? "good" : "warn"
             }">${!st ? "啟動中…" : connected ? "已接上" : "等遊戲…"}</span></div>
             ${clientKindRow(p)}
             ${st?.error ? `<div class="hint warn">⚠ ${esc(st.error)}</div>` : ""}
           </div>
           ${connected ? "" : howToConnect(p)}`
        );
      };

      // --- 設置 › 網頁版 ----------------------------------------------------
      /**
       * 用瀏覽器玩的整套，照玩家要做的順序排：① 帶除錯埠的瀏覽器 ② ULR Boot ③ 書籤。
       *
       * ① 的捷徑目標是主程序照**這台機器**組出來的（`snap.browsers`：找到的執行檔＋
       * 這個人的家目錄），跟「開啟」按鈕、「建桌面捷徑」寫進 .lnk 的是同一行 ——
       * 玩家照抄的、按鈕開的、捷徑開的永遠是同一個瀏覽器同一個設定檔。
       *
       * ULR Boot 原始檔跟著安裝包走，按一下放到固定的資料夾（`snap.bootExt.dir`）——
       * 之後插件更新時再按一次就是原地更新。
       *
       * ⚠ 遊戲改版不用更新擴充：它每次開頁會去雲端拿這一版的檔名清單。
       * 只有官方外殼本身改了（像 9/23 那次）才需要新版擴充，那時插件會一起更新。
       */
      PAGES["settings/web"] = () => {
        const b = snap?.bootExt;
        const br = snap?.browsers ?? {};
        const stale = b?.installed && b?.bundled && b.installed !== b.bundled;
        const action = !b?.installed ? "放好" : stale ? `更新到 ${b.bundled}` : "重新放一次";
        const fams = [
          ["chrome", "Chrome"],
          ["edge", "Edge"],
        ];
        const openRows = fams
          .map(([f, name]) =>
            br[f]?.exe
              ? `<div class="row"><span>${name}</span><span>
                   <button data-browser="${f}">開啟</button>
                   <button data-shortcut="${f}">建桌面捷徑</button></span></div>`
              : `<div class="row"><span>${name}</span><span class="dim">沒找到</span></div>`,
          )
          .join("");
        const targets = fams
          .filter(([f]) => br[f]?.target)
          .map(
            ([f, name]) =>
              `<div class="row"><span>${name}</span><span><button data-copytarget="${f}">複製</button></span></div>
               <code class="line">${esc(br[f].target)}</code>`,
          )
          .join("");
        return (
          head("網頁版", "用瀏覽器玩，插件一樣接得上。") +
          `<div class="card">
             <div class="row"><span><b>① 帶除錯埠的瀏覽器</b></span></div>
             <div class="hint">插件靠除錯埠接遊戲。這裡開的是專用設定檔，跟你平常的瀏覽器分開 ——
               書籤、登入、擴充各一份，平常那個不用關也不受影響。</div>
             ${openRows}
             ${webMsgLine("browser")}
             <div class="hint">建好的捷徑叫「ULR Chrome」「ULR Edge」，之後雙擊它就好，不用先開插件。
               Edge 開的時候會順便掛上 ULR Boot（②放好的話）。</div>
           </div>
           <div class="card">
             <div class="row"><span><b>自己做捷徑</b></span></div>
             <ol class="steps">
               <li>桌面按右鍵 › 新增 › 捷徑</li>
               <li>「項目位置」貼上下面那一行（已經照你這台電腦填好）</li>
               <li>名字隨便取，按完成</li>
             </ol>
             ${targets || `<div class="hint warn">沒找到 Chrome 或 Edge。</div>`}
             ${webMsgLine("copy")}
             <div class="hint">⚠ 只在平常那個瀏覽器的捷徑後面加 <code>--remote-debugging-port=0</code> 沒用：
               Chrome 136 起預設設定檔不開除錯埠，而且瀏覽器開著時再點只會多開視窗、參數整串被丟掉。
               一定要連 <code>--user-data-dir</code> 一起。</div>
           </div>
           <div class="card">
             <div class="row"><span><b>② ULR Boot 擴充</b></span></div>
             <div class="hint">讓瀏覽器不經 Steam、點書籤就進遊戲。插件內建，不用另外下載。</div>
             <div class="row"><span class="dim">資料夾</span><span><code>${esc(b?.dir ?? "—")}</code></span></div>
             <div class="row"><span class="dim">版本</span><span>${
               b?.installed ? esc(b.installed) : "還沒放"
             }</span></div>
             <div class="row"><span></span><span><button id="bootExtInstall">${esc(action)}</button></span></div>
             ${webMsgLine("boot")}
             <ol class="steps">
               <li>按上面的「${esc(action)}」，資料夾會打開</li>
               <li>開擴充功能頁：
                 <button data-extpage="chrome">Chrome</button> <button data-extpage="edge">Edge</button>
                 ，右上角打開「開發人員模式」</li>
               <li>「載入未封裝項目」→ 選那個資料夾</li>
             </ol>
             <div class="hint">Edge 用 ① 的按鈕或捷徑開會自動掛上，可以跳過 2、3 步。<br />
               <b>更新</b>：插件更新後這裡會出現「更新到 …」，按它，再到擴充功能頁按 ⟳。
               遊戲每週改版不用更新 —— 擴充自己去 Cloudflare Workers 拿新的檔名清單。</div>
           </div>
           <div class="card">
             <div class="row"><span><b>③ 書籤</b></span></div>
             <div class="hint">在 ① 開的瀏覽器裡，把這個網址存成書籤，<code>你的SteamID</code> 換成自己的：</div>
             <code class="line">https://www.playunlight.online/?steamid=你的SteamID</code>
             <div class="hint">SteamID 是 17 位數字（7656 開頭），Steam 個人檔案網址裡那串；改過自訂網址的話
               到 Steam › 帳戶明細 看。<br />
               不想裝擴充的話，用竄改猴腳本也行：<button data-link="${esc(b?.guideUrl ?? "")}">安裝說明</button></div>
           </div>`
        );
      };

      // --- 設置 › 啟動 ------------------------------------------------------
      PAGES["settings/startup"] = () => {
        const s = snap?.store;
        return (
          head("啟動", "開機時要不要自己起來。") +
          `<div class="card">
             <label class="toggle">
               <input type="checkbox" id="atLogin" ${snap?.launchAtLogin ? "checked" : ""} ${
                 snap?.packaged ? "" : "disabled"
               } />
               <span><b>隨 Windows 開機啟動</b>
                 <div class="hint">${
                   snap?.packaged
                     ? "開機後自動縮到系統匣，不跳視窗。"
                     : "⚠ 開發模式下不能設 —— 會把 node_modules 裡的 electron.exe 寫進登錄檔，之後開機跳出空白視窗且很難查。打包後才可用。"
                 }</div>
               </span>
             </label>
           </div>
           <div class="card">
             <label class="toggle">
               <input type="checkbox" id="startMin" ${s?.startMinimized ? "checked" : ""} />
               <span><b>啟動時只留托盤圖示</b>
                 <div class="hint">不跳設定視窗。點托盤圖示隨時叫得出來。</div>
               </span>
             </label>
           </div>
           <div class="card">
             <div class="hint" style="margin-top:0">
               遊戲要帶除錯埠開，插件才接得上 —— 做法在 <b>設置 › 連線</b>。<br />
               ⚠ 沒帶的話插件<b>永遠</b>接不上，畫面上只會寫「等遊戲…」。
             </div>
           </div>`
        );
      };

      // --- 設置 › 記錄 ------------------------------------------------------
      PAGES["settings/log"] = () =>
        head("記錄", "最近的動作。查「剛剛到底發生了什麼」用的。") +
        `<div class="card"><pre class="log" id="log">${esc(
          (snap?.log ?? []).join("\n") || "（還沒有記錄）",
        )}</pre></div>
         <div class="card">
           <div class="hint" style="margin-top:0">
             這一頁只留最近 40 行，<b>完整記錄寫在檔案裡</b>（關掉插件也還在）：<br />
             <code>${esc(snap?.logPath ?? "—")}</code><br />
             回報問題時請附上它。<b>裡面不含任何遊戲內容</b> —— 沒有手牌、沒有牌組、
             沒有對手是誰，房號也是截短的雜湊，可以直接貼。
           </div>
         </div>`;

      // --- 設置 › 關於 ------------------------------------------------------
      /**
       * 「會連到哪裡、送什麼」—— **一條連線一列，照實寫，包含預設開著的分享。**
       *

        if (t.id === "raidItemShortcutOn") {
          return void window.ulr.raid.itemShortcut(t.checked).then((s) => {
            rstate = s;

        if (t.name === "bonusItemMode" && t.checked) {

            bstate = s;
            renderBody();
          });
        }
        if (t.name === "bonusItemOrder" && t.checked) {
          return void window.ulr.bonus.order(t.value).then((s) => {
            bstate = s;
            renderBody();
          });
        }
        if (t.id === "dietStackOn" || t.id === "dietGemUpOn") {
          const part = t.id === "dietStackOn" ? "dietStack" : "gemUp";
          return void window.ulr.diet.toggle(part, t.checked).then((s) => {
            dstate = s;
            renderBody();
          });
        }
        if ((t.name === "surrenderConfirm" || t.name === "surrenderPlace") && t.checked) {
          const part = t.name === "surrenderConfirm" ? "noConfirm" : "outside";
          const on = t.value === "direct" || t.value === "outside";
          return void window.ulr.diet.surrender(part, on).then((s) => {
            dstate = s;
            renderBody();

        if (t.id === "stagesOn") {
          return void window.ulr.stages.set(t.checked).then((s) => {
            sstate = s;

        // 自己打的幅度。⚠ 走 `change` 而不是 `input`：打「0.05」的中途會經過

        // 的話，主程序會把中途那些夾成 1 再回推，玩家看到輸入框自己跳。
        // 同 `edStep` 走 `change`：打「0.5」的中途會經過 0，而 0 的意思是
        // 「切了馬上寫」—— 每打一個字就送一次會讓輸入框自己跳。
        if (t.id === "applyDelay") return void applyDeckDelay(t.value);

        if (t.id === "edUnit") return void applyEditUnit(t.value);
        if (t.id === "atLogin") return void options({ launchAtLogin: t.checked });
        if (t.id === "startMin") return void options({ startMinimized: t.checked });
        if (t.id === "multi") return void options({ multiProfile: t.checked });
        if (t.id === "clientKind") {

        if (row && t.dataset.field) {
          editing = null;

      $("content").addEventListener("input", (e) => {
        const t = e.target;
        if (t.id === "seconds") {
          dragging = true;
          $("secLabel").textContent = t.value;
        }
        // 打字時記住是誰在被編輯，重畫後要把它還原（見 renderBody 的呼叫點）
        if (t.closest("tr[data-id]")) editing = t;

        // --- 編輯 COST ---
        //
        // ⚠ **改一格不重畫整頁。** 角色那一頁有 700 個欄位，重畫會把游標踢掉、
        // 捲軸跳回頂端，而玩家正在一個一個調數字。只更新那一格的樣式與計數。
        if (t.dataset.t !== undefined && t.dataset.k !== undefined) {
          editing = t;
          const n = Number(t.value);
          if (t.value !== "" && Number.isFinite(n)) ed.draft[t.dataset.t][t.dataset.k] = n;
          // ⚠ 整組換掉，不能只 toggle 一個 class —— 顏色是**價差的階級**，
          // 打字時每按一個鍵都可能換一階（或換一邊）。舊的階級留在身上的話，
          // 兩個 `--dfg` 會同時中，格子的顏色由 CSS 的先後順序決定而不是數字。
          // 這幾個 class 是這個 input 身上唯一的 class，整個蓋掉是安全的。
          t.className = edDeltaClass(t.dataset.t, t.dataset.k);
          // 說明也要跟著改 —— 色階只分五階，「到底差幾 C」看的是這一行，
          // 留著上一次的數字比沒有還糟。第一行（是哪一張）不會變，留著。
          t.title = `${t.title.split("\n")[0]}\n${edDeltaText(t.dataset.t, t.dataset.k)}`;
          edMsg = null;
          const save = $("edSave");
          if (save) save.disabled = edUnsavedCount() === 0;
          return;
        }
        // --- 編輯規則（壓 C 區間）---
        //
        // 改一格就要重算重疊、縫隙與試算表 —— 但**只重畫那幾塊**（`rlRefresh`），
        // 不整頁重畫，否則正在打字的輸入框會連焦點一起被換掉。
        if (t.dataset.rb !== undefined && rl !== null) {
          editing = t;
          const band = rl.bands[Number(t.dataset.rb)];
          if (band) {
            const raw = t.value.trim();
            const n = Number(raw);
            if (t.dataset.rf === "maxGap") {
              // ⚠ 空白＝無上界，**不是 0**。`Number("")` 是 0，那會把
              // 「14 以上」變成「14 到 0」—— 一段不可能命中的區間。
              band.maxGap = raw === "" ? null : Number.isFinite(n) ? n : band.maxGap;
            } else if (raw !== "" && Number.isFinite(n)) {
              band[t.dataset.rf] = n;
            }
          }
          rlMsg = null;
          return rlRefresh();
        }
        if (t.id === "rlVersion") {
          editing = t;
          return;
        }
        // --- 編輯描述 ---
        //
        // ⚠ 只更新草稿與存檔鈕，**不重畫** —— 這一頁全是輸入框，重畫會把游標
        // 連同打到一半的字一起換掉。
        if (t.dataset.rd !== undefined && rd?.meta) {
          editing = t;
          const key = t.dataset.rd;
          rd.meta[key] = key === "teamCostLimit" ? Number(t.value) : t.value;
          rdMsg = null;
          const save = $("rdSave");
          if (save) save.disabled = !rdDirty();
          const cell = $("rdDirtyCell");
          if (cell) {
            cell.innerHTML = rdDirty()
              ? '<b class="warn">有改動</b>'
              : '<span class="dim">沒有，都存好了</span>';
          }
          return;
        }
        if (t.id === "edFilter") {
          edFilter = t.value;
          editing = t;
          // 篩選要立刻反映，但只重畫清單那一塊，不動上面的表頭與輸入焦點。
          const cat = ed?.catalog;
          const box = $("content").querySelector(".card:last-child");
          if (cat && box) {
            box.innerHTML =
              edTab === "characters"
                ? edCharacters(cat)
                : edTab === "monsters"
                  ? edMonsters(cat)
                  : edTab === "equipment"
                    ? edEquipment(cat)
                    : edEvents(cat);
          }
          return;
        }
      });

      $("content").addEventListener("click", (e) => {
        const btn = e.target.closest("button");
        if (!btn) return;

        // --- 模組 › 卡面替換 ---
        if (btn.id === "modsOpen") return void window.ulr.mods.cardsOpen();
        if (btn.id === "modsReload") {
          btn.disabled = true;
          return void window.ulr.mods.cardsReload().then((s) => {
            mstate = s;
            renderBody();
          });
        }
        if (btn.id === "modsOpenBlanks") {
          return void window.ulr.mods.cardsOpenBlanks().then((s) => {
            mstate = s;
            renderBody();
          });
        }

        // --- 編輯 COST ---
        if (btn.dataset.edtab !== undefined) {
          edTab = btn.dataset.edtab;
          edFilter = "";
          return renderBody();
        }
        if (btn.id === "edCatalog") {
          btn.disabled = true;
          btn.textContent = "讀取中…";
          return void window.ulr.editor.refreshCatalog().then((payload) => {
            // ⚠ 重讀名冊會換掉「原價」的基準，所以草稿要跟著重建 —— 但**玩家
            // 已經改過的值不能丟**。decorate() 是從規則檔重建的，而規則檔就是
            // 上一次存檔的內容，所以這裡把還沒存的改動疊回去。
            const keep = ed?.draft ?? null;
            ed = decorate(payload);
            if (keep !== null) {
              for (const t of ED_TABS)
                for (const k of Object.keys(keep[t.id] ?? {}))
                  if (ed.draft[t.id][k] !== undefined) ed.draft[t.id][k] = keep[t.id][k];
            }
            renderBody();
          });
        }
        if (btn.id === "edSave") {
          const version = $("edVersion")?.value.trim() ?? ed.rule.version;
          // ⚠⚠ **檔名要在這裡先抓下來，不能等 then 裡面才讀 `ed.rule`。**
          // 存檔成功會讓主程序推一份新狀態過來，而 apply() 看到核對碼變了就把
          // `ed` 設成 null —— 那份推播**比 invoke 的回覆先到**。在 then 裡讀
          // `ed.rule.fileName` 會拋 TypeError，而 promise 會把它吞掉：檔案存好了，
          // 玩家卻什麼提示都沒有。2026-08-16 實測踩到，兩次都以為是時序問題。
          const fileName = ed.rule.fileName;
          btn.disabled = true;
          return void window.ulr.editor.save({ tables: ed.draft, version }).then((r) => {
            edMsg = r.ok
              ? { text: `已存回 ${fileName}（${r.version}，核對碼 ${r.shortHash}）`, bad: false }
              : { text: r.error ?? "存檔失敗", bad: true };
            // ⚠ 不自己 `edLoad(true)`：狀態推播已經把 `ed` 丟掉了，重畫時
            // 會自然重拉一次。這裡再拉一次只會兩份 payload 賽跑。
            // 但**一定要重畫** —— 兩個 promise 的先後沒有保證，少了這一行時
            // 訊息可能落在最後一次重畫之後，變成存了檔卻沒有任何回應。
            renderBody();
          });
        }
        if (btn.dataset.step !== undefined) return void applyEditStep(btn.dataset.step);
        if (btn.dataset.unit !== undefined) return void applyEditUnit(btn.dataset.unit);
        if (btn.id === "edOnlyOff") {
          edOnlyOff = !edOnlyOff;
          return void renderBody();
        }
        if (btn.id === "edHideLocked") {
          edHideLocked = !edHideLocked;
          return void renderBody();
        }
        if (btn.id === "edResetTab") {
          const label = ED_TABS.find((t) => t.id === edTab)?.label ?? edTab;
          // ⚠ 只動當前這一頁。四張表一起清掉是很難反悔的操作，而玩家按的是
          // 「這一頁」那顆按鈕。
          for (const k of Object.keys(ed.base[edTab])) ed.draft[edTab][k] = ed.base[edTab][k];
          edMsg = { text: `${label}已全部改回原價（還沒存檔）`, bad: false };
          return renderBody();
        }

        // --- 編輯規則（壓 C 區間）---
        if (btn.dataset.rbdel !== undefined && rl !== null) {
          rl.bands.splice(Number(btn.dataset.rbdel), 1);
          rlMsg = null;
          return renderBody();
        }
        if (btn.id === "rlAdd" && rl !== null) {
          // 接在最後一段後面起跳，玩家少改一個欄位。最後一段沒有上界時就從
          // 它的下界 +1 起 —— 那一定會重疊，而重疊會立刻被上面的檢查點名，
          // 比安靜地插一段 0 進去好懂。
          const last = rl.bands[rl.bands.length - 1];
          const start = last ? (last.maxGap === null ? last.minGap + 1 : last.maxGap + 1) : 7;
          rl.bands.push({ minGap: start, maxGap: null, extraCost: 0 });
          rlMsg = null;
          return renderBody();
        }
        if (btn.id === "rlSort" && rl !== null) {
          // ⚠ 順序**有意義**：引擎取第一個命中的區間。沒重疊時排序不改變任何
          // 結果，有重疊時排序會改變 —— 所以排完要讓玩家自己看那個警告。
          rl.bands.sort((a, b) => a.minGap - b.minGap);
          rlMsg = null;
          return renderBody();
        }
        if (btn.id === "rlSnap" && rl !== null) {
          // 每一段的上界頂到下一段起點的前 0.01（`shinon/squeeze-band` 的 x.99
          // 就是這樣來的）。最後一段不動 —— 它要嘛本來就無上界，要嘛作者是
          // 刻意讓超大差距不罰。
          const order = rl.bands.map((b, i) => ({ b, i })).sort((x, y) => x.b.minGap - y.b.minGap);
          for (let n = 0; n < order.length - 1; n++) {
            const cur = order[n].b;
            const next = order[n + 1].b;
            if (cur.maxGap === null) continue;
            if (next.minGap > cur.maxGap) cur.maxGap = Math.round((next.minGap - 0.01) * 100) / 100;
          }
          rlMsg = { text: "已把每一段的上界頂到下一段（還沒存檔）", bad: false };
          return renderBody();
        }
        if (btn.id === "rlOfficial" && rl !== null) {
          rl.bands = RL_OFFICIAL.map((b) => ({ ...b }));
          rlMsg = { text: "已換成原版的兩段（還沒存檔）", bad: false };
          return renderBody();
        }
        if (btn.id === "rlClear" && rl !== null) {
          rl.bands = [];
          rlMsg = { text: "已清空 —— 存檔之後這份規則完全不壓 C", bad: false };
          return renderBody();
        }
        if (btn.id === "rdSave" && rd?.meta) {
          // ⚠ 檔名先抓下來 —— 存檔會讓主程序推一份新狀態過來，而 apply() 看到
          // 核對碼變了就把 `rd` 設成 null（那份推播比 invoke 的回覆先到）。
          const fileName = rd.rule.fileName;
          btn.disabled = true;
          return void window.ulr.editor
            // ⚠ 只送 `meta`。少送 `tables` / `compression` 的意思是「別動它們」，
            // 不是「清空」（主程序的 saveEditedRule 會沿用檔案裡那份）。
            .save({ meta: rd.meta })
            .then((r) => {
              rdMsg = r.ok
                ? { text: `已存回 ${fileName}（${r.version}，核對碼 ${r.shortHash}）`, bad: false }
                : { text: r.error ?? "存檔失敗", bad: true };
              renderBody();
            });
        }
        if (btn.id === "rlSave" && rl !== null) {
          // ⚠ 檔名先抓下來。存檔會讓主程序推一份新狀態過來，而 apply() 看到
          // 核對碼變了就把 `rl` 設成 null —— 那份推播比 invoke 的回覆先到。
          // 編輯 COST 那邊踩過同一件事。
          const fileName = rl.rule.fileName;
          const version = $("rlVersion")?.value.trim() ?? rl.rule.version;
          const bands = rl.bands.map((b) => ({
            minGap: b.minGap,
            // 主程序那邊 null 就是「沒有上界」（`sanitizeBand`）。
            maxGap: b.maxGap,
            extraCost: b.extraCost,
          }));
          btn.disabled = true;
          return void window.ulr.editor
            .save({
              // ⚠ **不送 `tables`。** 主程序看到沒有這個欄位就沿用檔案裡的四張
              // 表；送一份空的等於把 1186 筆價格全洗掉（而空表是合法規則，
              // 不會報錯，只會讓每張卡變成 99C）。
              compression: bands.length === 0 ? { type: "none" } : { type: "gap-band-v1", bands },
              version,
            })
            .then((r) => {
              rlMsg = r.ok
                ? { text: `已存回 ${fileName}（${r.version}，核對碼 ${r.shortHash}）`, bad: false }
                : { text: r.error ?? "存檔失敗", bad: true };
              renderBody();
            });
        }

        if (btn.dataset.tint !== undefined) {
          const v = btn.dataset.tint === "" ? null : Number(btn.dataset.tint);
          return void window.ulr.setReadyTint(v).then(apply);
        }
        if (btn.id === "addProfile") {
          return void window.ulr.profiles.add().then(apply);
        }
        if (btn.id === "copyFlag") {
          // 走主程序的剪貼簿（見 preload）。要玩家自己把那一行一字不差地打進
          // Steam，就是在製造一個「打錯了但完全看不出來」的失敗。
          return void window.ulr.copyDebugFlag().then(() => {
            btn.textContent = "已複製";
            setTimeout(() => (btn.textContent = "複製"), 1500);
          });
        }
        if (btn.id === "stagesRetry") {
          return void window.ulr.stages.retry().then((s) => {
            sstate = s;
            renderBody();
          });
        }
        if (btn.id === "costPick") return void window.ulr.cost.pick().then(apply);
        if (btn.id === "costClear") return void window.ulr.cost.clear().then(apply);
        if (btn.id === "costReload") return void window.ulr.cost.reload().then(apply);
        if (btn.id === "costModeDefault") return void window.ulr.cost.mode("default").then(apply);
        if (btn.id === "costModeOff") return void window.ulr.cost.mode("off").then(apply);
        if (btn.id === "costModeFile") {
          // ⚠ 切到「自己的規則檔」而還沒選過檔的話，直接把檔案選擇框開起來 ——
          // 不然畫面會停在一個什麼都沒有的狀態，而玩家剛剛才按了一顆按鈕。
          return void window.ulr.cost.mode("file").then((s) => {
            apply(s);
            if (s?.costRule === null) void window.ulr.cost.pick().then(apply);
          });
        }
        if (btn.dataset.link) {
          return void window.ulr.openExternal(btn.dataset.link);
        }
        // 設置底下的另一格（同一個大分頁，只換側欄）。
        if (btn.dataset.goto) {
          sub = btn.dataset.goto;
          renderChrome();
          return void renderBody();
        }
        // 網頁版那幾顆：結果講在按鈕旁邊（webMsg），不跳對話框。
        const web = (p, at = null) =>
          void p.then((r) => {
            if (r?.text) webMsg = { text: r.text, bad: !r.ok, at };
            renderBody();
          });
        if (btn.id === "browserOpen") {
          btn.disabled = true;
          btn.textContent = "開啟中…";
          return web(window.ulr.browser.open());
        }
        if (btn.dataset.browser) {
          btn.disabled = true;
          btn.textContent = "開啟中…";
          return web(window.ulr.browser.launch(btn.dataset.browser), "browser");
        }
        if (btn.dataset.shortcut)
          return web(window.ulr.browser.shortcut(btn.dataset.shortcut), "browser");
        if (btn.dataset.copytarget)
          return web(window.ulr.browser.copyTarget(btn.dataset.copytarget), "copy");
        if (btn.dataset.extpage) {
          btn.disabled = true;
          return web(window.ulr.browser.launch(btn.dataset.extpage, "extensions"), "boot");
        }
        if (btn.id === "browserCmd") return web(window.ulr.browser.saveCmd());
        if (btn.id === "bootExtInstall") return web(window.ulr.bootExt.install(), "boot");

        const row = btn.closest("tr[data-id]");
        if (!row) return;
        const id = row.dataset.id;
        if (btn.dataset.act === "launch") return void window.ulr.profiles.launch(id).then(apply);
        if (btn.dataset.act === "dup") return void window.ulr.profiles.add(id).then(apply);
        if (btn.dataset.act === "del") return void window.ulr.profiles.remove(id).then(apply);
      });

      // --- 對戰地點的動作 ---------------------------------------------------
      //
      // ⚠ **只剩「存這一格」。** 開始／停止配對那兩支拿掉了（WP-18）：那條路
      // 的入口是遊戲大廳裡那顆按鈕，而它從頭到尾都在主程序裡。畫面這邊已經沒有
      // 任何一條會替玩家操作遊戲的路徑了。

      /**
       * 把選好的地點存進設定檔。
       *
       * ⚠ **一定要立刻存**（不要等玩家按什麼按鈕）：這一頁沒有存檔鈕，而下一份
       * 狀態推播就會照設定檔重畫 —— 不存的話選單會自己彈回舊值。
       *
       * ⚠ 存完把主程序整理過的那份收回來。認不得的值會被夾成預設，而畫面自己
       * 留一份的話會跟設定檔漂開。
       */
      function saveStagePick(value) {
        mform = { stage: value };
        return window.ulr.match.prefs(mform).then((saved) => {
          mform = { ...saved.match };
          renderBody();
        });
      }

      function set(prefs) {
        return window.ulr.setPrefs(prefs).then(apply);
      }
      function options(patch) {
        return window.ulr.setOptions(patch).then(apply);
      }

      // =====================================================================
      // 套用一份快照
      // =====================================================================
      /** 目前選著的規則的身分。換檔或換版本時，編輯器的草稿就作廢了。 */
      function ruleSig(s) {
        const r = s?.status ? s.costRule : null;
        return `${s?.costRule?.path ?? ""}|${s?.costRule?.version ?? ""}|${s?.costRule?.shortHash ?? ""}`;
      }
      let lastRuleSig = null;

      function apply(next) {
        if (!next) return;
        const sig = ruleSig(next);
        // 規則換了（玩家去「Cost 表」選了別份，或我們剛存完檔）→ 手上那份草稿
        // 的基準已經不對了，丟掉重載。
        //
        // ⚠ **`edMsg` 不能一起清掉。** 存檔會讓核對碼改變，於是這個判斷成立、
        // 於是「已存回 xxx」那行字在出現的同一瞬間就被抹掉 —— 玩家按了存檔卻
        // 什麼回應都看不到。訊息本身帶著檔名與核對碼，過期也不會誤導。
        if (lastRuleSig !== null && sig !== lastRuleSig) {
          ed = null;
          rl = null;
          rd = null;
        }
        lastRuleSig = sig;
        snap = next;
        renderFooter();
        // ⚠ 拖滑桿或打字時不要重畫內容區 —— 會把游標踢掉、滑桿跳回去。
        // 狀態列照更新（它跟輸入無關，而且那才是玩家在等的資訊）。
        //
        // ⚠⚠ 這裡原本只擋 `editing`（各頁自己設的那個變數），而**配對頁的
        // 開房設定從來沒設過它** —— 於是每一次狀態推播（連線心跳、對戰狀態、
        // 記錄檔…）都會在玩家打房名打到一半時把輸入框整個換掉。現在一律問
        // `isEditing()`，那支是問瀏覽器誰有焦點，不必每一頁記得自己登記。
        if (dragging || isEditing() || (editing && document.activeElement === editing)) {
          // 玩家打完字（焦點離開）時要把錯過的那些更新補畫回來，否則畫面會停在
          // 他開始打字的那一刻。⚠ 只掛一次，而且是 `once` —— 累加的話每打一個
          // 字就多一個 listener。
          scheduleCatchUp();
          return;
        }
        // ⚠ 編輯 COST 那一頁**不跟著狀態推播重畫**。它有 700 個輸入框，而連線
        // 心跳、對戰狀態這些跟它一點關係都沒有的變動每幾秒就來一次 —— 重畫會
        // 把捲軸拉回頂端，而玩家正在第 40 位角色那一排調數字。
        // 需要重畫的兩件事（換規則、存完檔）各自都有明確的呼叫點。
        if (onEditPage() && ed !== null) return;
        // ⚠ 編輯規則那一頁同理。欄位少得多，但玩家一樣是在輸入框裡打數字，
        // 而連線心跳每幾秒就推一次 —— 重畫會把打到一半的數字連游標一起換掉。
        // 換規則與存完檔都會把 `rl` 設成 null，那時這道閘自然放行。
        if (onRulePage() && rl !== null) return;
        // 編輯描述同理 —— 整頁都是輸入框。
        if (onDescPage() && rd !== null) return;
        editing = null;
        // ⚠ 側邊那排會隨「進階：多開」增減，所以每次套用快照都要重畫，不能只在
        // 切分頁時畫。而關掉多開的那一刻若玩家正站在「配置」上，那一格已經不
        // 存在了 —— 退回第一格，不要把他留在一片空白上。
        const visible = subsOf(TABS.find((t) => t.id === tab));
        if (!visible.some((s) => s.id === sub)) sub = visible[0].id;
        renderChrome();
        renderBody();
      }

      // 狀態列最後一格是最近一則記錄 —— 點它看完整的。
      $("fLast").addEventListener("click", () => {
        tab = "settings";
        sub = "log";
        renderChrome();
        renderBody();
      });

      renderChrome();
      window.ulr.onState(apply);
      window.ulr.state().then(apply);
    </script>
  </body>
</html>
