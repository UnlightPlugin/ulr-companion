<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <!--
      ⚠ CSP 這裡是**必要的**，不是加好玩的。這個視窗的內容全部是我們自己寫死的，
      所以連線來源可以鎖到只剩 'self'。§12 的原則：邊界擋一次，之後都安全。

      ⚠ **外觀是純 CSS 重現的，一張遊戲圖檔都沒有。** 色票是 2026-08-07 從跑著的
      客戶端量出來的（分頁 tab_chara/library_btn_*、底 option_bg、面板 edit_bg），
      不是憑印象調的。這個選擇讓上面那行 `default-src 'none'` 成立 ——
      要是改成載入遊戲的圖，就得放寬 img-src，而且離線時整個外觀會消失。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>ULR Companion</title>
    <style>
      :root {
        /* --- 從客戶端量到的色票（見上方註解） --- */
        --tab-off: #622b2f; /* edit/tab_chara.png frame 0 */
        --tab-off-lo: #4a2024;
        --tab-hover: #873136; /* frame 1 */
        --tab-on: #d5d5d5; /* 選中是淺灰，不是更亮的紅 */
        --tab-on-lo: #b4b4b4;
        /*
         * ⚠ 遊戲原本的分頁字幾乎是黑的（量到的暗部接近 #000），靠浮雕撐可讀性。
         * 這裡刻意調亮一階：遊戲的分頁是大圖示尺寸，這個視窗是 13.5px 的文字，
         * 照抄會變成看不清楚要點哪裡。像它，但不要像到不能用。
         */
        --ink-off: #d8b6b8;
        --ink-on: #241013;

        --bg: #1e2336; /* option_bg 的主色 */
        --bg-lo: #161a29;
        --panel: #272c3c;
        --panel-hi: #313749;
        --line: #0c0e16;
        --rule: #434a60;

        --text: #dfe2ea;
        --dim: #939bb0;
        --amber: #ffc247;
        --green: #4cc96a;
        --red: #b8434b;
        --grey: #7d8496;

        --serif: "Noto Serif TC", "Source Han Serif TC", "MS Mincho", "PMingLiU", Georgia, serif;
        --sans: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg-lo);
        color: var(--text);
        font: 13px/1.6 var(--sans);
        user-select: none;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* --- 頂條：遊戲每個畫面上緣那條直紋 --- */
      header {
        flex: none;
        height: 34px;
        display: flex;
        align-items: center;
        padding: 0 12px;
        border-bottom: 1px solid var(--line);
        background:
          repeating-linear-gradient(90deg, #2b3a42 0 3px, #26333a 3px 6px, #1d282e 6px 9px), #26282a;
      }
      header .brand {
        font-family: var(--serif);
        font-size: 13px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #b9c6cc;
        text-shadow: 0 1px 0 #000;
      }
      header .ver {
        margin-left: 10px;
        padding: 1px 7px;
        border: 1px solid #3a4a52;
        border-radius: 2px;
        font-size: 10.5px;
        letter-spacing: 0.06em;
        color: #8fa0a8;
      }
      header .who {
        margin-left: auto;
        font-size: 11.5px;
        color: #8fa0a8;
        letter-spacing: 0.04em;
      }

      /* --- 大分頁列 --- */
      nav.tabs {
        flex: none;
        display: flex;
        gap: 2px;
        padding: 6px 8px 0;
        background: var(--bg-lo);
        border-bottom: 1px solid var(--line);
      }
      nav.tabs button {
        appearance: none;
        min-width: 92px;
        padding: 6px 16px 5px;
        border: 1px solid var(--line);
        border-bottom: none;
        border-radius: 2px 2px 0 0;
        font-family: var(--serif);
        font-size: 13.5px;
        letter-spacing: 0.14em;
        cursor: pointer;
        color: var(--ink-off);
        background: linear-gradient(180deg, var(--tab-off) 0%, var(--tab-off-lo) 100%);
        /* 遊戲的分頁字是浮雕的，靠一暗一亮兩層陰影做出來 */
        text-shadow:
          0 1px 1px rgba(0, 0, 0, 0.75),
          0 -1px 0 rgba(0, 0, 0, 0.35);
      }
      nav.tabs button:hover {
        background: linear-gradient(180deg, var(--tab-hover) 0%, #6e282d 100%);
        color: #f4e2e3;
      }
      nav.tabs button[aria-selected="true"] {
        background: linear-gradient(180deg, var(--tab-on) 0%, var(--tab-on-lo) 100%);
        color: var(--ink-on);
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.6);
      }

      /* --- 主體：左側子分頁 + 內容 --- */
      main {
        flex: 1;
        display: flex;
        min-height: 0;
        background:
          radial-gradient(circle at 1px 1px, rgba(255, 255, 255, 0.028) 1px, transparent 1px) 0 0 /
            4px 4px,
          linear-gradient(180deg, var(--bg) 0%, var(--bg-lo) 100%);
      }

      aside {
        flex: none;
        width: 116px;
        padding: 10px 0;
        border-right: 1px solid var(--line);
        background: linear-gradient(90deg, rgba(0, 0, 0, 0.28), rgba(0, 0, 0, 0.06));
        overflow-y: auto;
      }
      aside button {
        appearance: none;
        display: block;
        width: 100%;
        padding: 7px 10px 7px 16px;
        border: none;
        border-left: 3px solid transparent;
        background: none;
        color: var(--dim);
        font-family: var(--serif);
        font-size: 13px;
        letter-spacing: 0.1em;
        text-align: left;
        cursor: pointer;
      }
      aside button:hover {
        color: var(--text);
        background: rgba(135, 49, 54, 0.22);
      }
      aside button[aria-selected="true"] {
        color: #fff;
        border-left-color: var(--red);
        background: linear-gradient(90deg, rgba(184, 67, 75, 0.36), transparent);
      }
      /* 未實作的子分頁：看得見，但一眼看得出還不能用 */
      aside button.todo::after {
        content: "…";
        color: var(--grey);
        margin-left: 4px;
      }

      section.body {
        flex: 1;
        padding: 14px 16px;
        overflow-y: auto;
        min-width: 0;
      }
      h2 {
        margin: 0 0 3px;
        font-family: var(--serif);
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0.08em;
      }
      /* 遊戲 Library 那條帶小飾釘的分隔線 */
      .rule {
        height: 1px;
        margin: 9px 0 13px;
        background: linear-gradient(90deg, var(--rule), rgba(67, 74, 96, 0.1));
        position: relative;
      }
      .rule::before {
        content: "";
        position: absolute;
        left: -3px;
        top: -2.5px;
        width: 6px;
        height: 6px;
        background: var(--rule);
        transform: rotate(45deg);
      }
      .lede {
        color: var(--dim);
        font-size: 12px;
        margin: 0;
      }

      .card {
        background: linear-gradient(180deg, var(--panel-hi), var(--panel));
        border: 1px solid var(--line);
        border-radius: 3px;
        padding: 11px 13px;
        margin-bottom: 10px;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.045);
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 10px;
      }
      .row + .row {
        margin-top: 5px;
      }
      .dim {
        color: var(--dim);
      }
      .big {
        font-family: var(--serif);
        font-size: 24px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .hint {
        color: var(--dim);
        font-size: 11.5px;
        margin-top: 6px;
        line-height: 1.65;
      }
      .warn {
        color: var(--amber);
      }
      .bad {
        color: var(--red);
      }
      .good {
        color: var(--green);
      }

      label.toggle {
        display: flex;
        align-items: flex-start;
        gap: 9px;
        cursor: pointer;
      }
      label.toggle input {
        margin: 4px 0 0;
        flex: none;
        accent-color: var(--red);
      }
      label.toggle b {
        font-family: var(--serif);
        letter-spacing: 0.05em;
      }

      input[type="range"] {
        width: 100%;
        margin: 10px 0 2px;
        accent-color: var(--amber);
      }
      .ticks {
        display: flex;
        justify-content: space-between;
        color: var(--dim);
        font-size: 11px;
      }

      input[type="text"],
      input[type="number"],
      select {
        background: #12151f;
        border: 1px solid var(--line);
        border-radius: 2px;
        color: var(--text);
        font: 12.5px var(--sans);
        padding: 4px 7px;
      }
      input:focus,
      select:focus {
        outline: 1px solid var(--red);
      }
      select option {
        background: #12151f;
      }

      /* 遊戲的通用按鈕（btn_gene）：淺灰漸層、按下去描紅邊 */
      button.gene {
        appearance: none;
        padding: 4px 12px;
        border: 1px solid #2a2c31;
        border-radius: 2px;
        background: linear-gradient(180deg, #cfd4da 0%, #9aa1ab 48%, #cdd2d8 52%, #eef1f4 100%);
        color: #23262c;
        font: 12px var(--sans);
        cursor: pointer;
      }
      button.gene:hover {
        border-color: var(--red);
      }
      button.gene:disabled {
        opacity: 0.4;
        cursor: default;
        border-color: #2a2c31;
      }
      button.gene.danger:hover {
        border-color: var(--red);
        color: #7a1f26;
      }

      /* =================================================================
         編輯 COST
         =================================================================
         ⚠ **這一頁不准出現卡片編號。** `cc001_01` 對玩家沒有意義，名冊
         （catalog）存在的唯一理由就是把它換成「艾伯李斯特 L1」。編號只留在
         `data-k`（給程式用）與 title（滑過去才看得到，用來回報問題）。 */

      /* 四張表的分頁。做成遊戲那排紅色頁籤的縮小版。 */
      .etabs {
        display: flex;
        gap: 2px;
        margin-bottom: 9px;
      }
      .etabs button {
        appearance: none;
        flex: 1;
        padding: 5px 4px;
        border: 1px solid var(--line);
        border-bottom: none;
        border-radius: 2px 2px 0 0;
        background: linear-gradient(180deg, var(--tab-off), var(--tab-off-lo));
        color: var(--ink-off);
        font-family: var(--serif);
        font-size: 12.5px;
        letter-spacing: 0.08em;
        cursor: pointer;
      }
      .etabs button:hover {
        background: var(--tab-hover);
        color: #fff;
      }
      .etabs button[aria-selected="true"] {
        background: linear-gradient(180deg, var(--tab-on), var(--tab-on-lo));
        color: var(--ink-on);
      }
      .etabs .n {
        margin-left: 5px;
        font-size: 10.5px;
        opacity: 0.7;
      }

      /* 一排卡：左邊是**名字**，右邊是那一排的格子。 */
      .erow {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 2px 0;
      }
      .erow + .erow {
        border-top: 1px solid rgba(67, 74, 96, 0.35);
      }
      .ename {
        flex: none;
        width: 6.6em;
        font-family: var(--serif);
        font-size: 12px;
        letter-spacing: 0.03em;
        color: var(--text);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* 欄頭（L1 L2 … R5）。**只印一次**，不要每一排都重複 —— 70 排的話那會
         變成畫面上最吵的東西，而它其實是固定不變的。 */
      .ehead {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        position: sticky;
        top: -14px;
        z-index: 2;
        padding: 4px 0 3px;
        margin-bottom: 2px;
        background: var(--panel);
        border-bottom: 1px solid var(--rule);
      }
      .ehead .ename {
        color: var(--dim);
        font-size: 11px;
      }
      .egrid {
        flex: 1;
        display: grid;
        gap: 3px;
        min-width: 0;
      }
      .egrid.c10 {
        grid-template-columns: repeat(10, minmax(0, 1fr));
      }
      .egrid.c9 {
        grid-template-columns: repeat(9, minmax(0, 1fr));
      }
      .egrid.c5 {
        grid-template-columns: repeat(5, minmax(0, 1fr));
      }
      .egrid.c3 {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .egrid .slot {
        font-size: 10px;
        color: var(--dim);
        text-align: center;
        letter-spacing: 0.04em;
      }

      /* 一格 = 名字（索引型的表才有）＋ 數字欄位 */
      .ecell {
        min-width: 0;
      }
      .ecell .cn {
        display: block;
        font-size: 10px;
        line-height: 1.25;
        height: 2.5em;
        color: var(--dim);
        overflow: hidden;
        margin-bottom: 2px;
      }
      .ecell input {
        width: 100%;
        padding: 2px 3px;
        font-size: 11.5px;
        text-align: center;
        font-variant-numeric: tabular-nums;
        background: #12151f;
        border: 1px solid var(--line);
        border-radius: 2px;
        color: var(--text);
      }
      /* 改過的格子要一眼看得出來 —— 存檔前玩家要知道自己動了哪些。 */
      .ecell input.dirty {
        border-color: var(--amber);
        color: var(--amber);
        background: rgba(255, 194, 71, 0.08);
      }
      .ecell input:focus {
        outline: 1px solid var(--red);
      }

      /* 怪物：一排放三種，每種自己一小塊（M1~M3） */
      .mrow {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        padding: 3px 0;
      }
      .mrow + .mrow {
        border-top: 1px solid rgba(67, 74, 96, 0.35);
      }
      .mblock .mname {
        font-family: var(--serif);
        font-size: 11.5px;
        color: var(--text);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        margin-bottom: 2px;
      }

      /* 群組標題：裝備的「這是誰的專武」、事件卡的族群 */
      .egroup {
        margin: 12px 0 5px;
        font-family: var(--serif);
        font-size: 12px;
        letter-spacing: 0.06em;
        color: var(--amber);
        border-bottom: 1px solid rgba(255, 194, 71, 0.22);
        padding-bottom: 2px;
      }
      .egroup .sub {
        color: var(--dim);
        font-size: 11px;
        letter-spacing: 0;
        margin-left: 6px;
      }

      /* 官方 COST 檔位的快速鍵。刻意做小 —— 它們是捷徑，不是主要的輸入方式，
         真正的值在旁邊那個數字欄位裡（自訂 COST 想填幾就填幾）。 */
      button.tier {
        appearance: none;
        margin-left: 4px;
        padding: 3px 8px;
        border: 1px solid var(--line);
        border-radius: 2px;
        background: #12151f;
        color: var(--dim);
        font: 11.5px var(--sans);
        cursor: pointer;
      }
      button.tier:hover {
        border-color: var(--red);
        color: var(--text);
      }

      /* --- 編輯規則：一段壓 C 區間一排 --- */
      .bandrow {
        display: grid;
        grid-template-columns: 1.8em 2.6em 5.5em 1.2em 5.5em 2.6em 5.5em 1fr;
        align-items: center;
        gap: 6px;
        margin-top: 5px;
      }
      .bandrow input {
        width: 100%;
        padding: 3px 4px;
        font-size: 12px;
        text-align: center;
        font-variant-numeric: tabular-nums;
      }
      .bandrow .lbl {
        font-size: 11px;
        color: var(--dim);
        text-align: center;
      }
      .bandrow button {
        justify-self: start;
        padding: 1px 7px;
      }

      .presets {
        display: flex;
        gap: 6px;
        margin: 10px 0 2px;
        flex-wrap: wrap;
      }
      .presets button {
        appearance: none;
        padding: 5px 13px;
        border: 1px solid var(--line);
        border-radius: 2px;
        background: linear-gradient(180deg, var(--tab-off), var(--tab-off-lo));
        color: #e8d5d6;
        font-family: var(--serif);
        font-size: 13px;
        letter-spacing: 0.06em;
        cursor: pointer;
      }
      .presets button:hover {
        background: linear-gradient(180deg, var(--tab-hover), #6e282d);
      }
      .presets button[aria-pressed="true"] {
        background: linear-gradient(180deg, var(--tab-on), var(--tab-on-lo));
        color: var(--ink-on);
      }

      /* --- 配置清單 --- */
      table.profiles {
        width: 100%;
        border-collapse: collapse;
        font-size: 12.5px;
      }
      table.profiles th {
        text-align: left;
        font-weight: 500;
        color: var(--dim);
        font-size: 11.5px;
        padding: 0 6px 5px;
        border-bottom: 1px solid var(--rule);
      }
      table.profiles td {
        padding: 5px 6px;
        border-bottom: 1px solid rgba(67, 74, 96, 0.35);
        vertical-align: middle;
      }
      table.profiles tr.self td {
        background: rgba(184, 67, 75, 0.13);
      }
      table.profiles input[type="text"] {
        width: 100%;
      }
      table.profiles input[type="number"] {
        width: 72px;
      }
      /* 中間人那一欄是一整個網址（36 字元），不再是四位數的埠。
         窄於這個寬度會被切成 `wss://ulr-link.lldavuull.work`，而看不到尾巴的
         網址沒有辦法用眼睛核對 —— 那正是這一格唯一的用途。 */
      table.profiles td:nth-child(5) {
        min-width: 250px;
      }
      .self-mark {
        color: var(--amber);
        font-size: 11px;
      }

      /* 步驟教學：玩家要照著做的東西，行距要鬆、序號要看得見 */
      ol.steps {
        margin: 8px 0 0;
        padding-left: 20px;
        color: var(--text);
        font-size: 12px;
        line-height: 1.9;
      }
      ol.steps li {
        margin-bottom: 2px;
      }
      code {
        display: inline-block;
        padding: 1px 6px;
        margin: 1px 0;
        border: 1px solid var(--rule);
        border-radius: 2px;
        background: #12151f;
        color: var(--amber);
        font:
          11.5px ui-monospace,
          Consolas,
          monospace;
        /* 玩家要把這一行複製到 Steam 去 —— 選得起來是這個元素的全部用途 */
        user-select: text;
      }

      /* --- 未實作的頁 --- */
      .todo-box {
        border: 1px dashed var(--rule);
        border-radius: 3px;
        padding: 12px 14px;
        background: rgba(0, 0, 0, 0.16);
      }
      .todo-box h3 {
        margin: 0 0 6px;
        font-family: var(--serif);
        font-size: 13.5px;
        font-weight: 600;
        color: var(--text);
        letter-spacing: 0.06em;
      }
      .todo-box ul {
        margin: 6px 0 0;
        padding-left: 18px;
        color: var(--dim);
        font-size: 12px;
        line-height: 1.75;
      }
      .badge {
        display: inline-block;
        padding: 1px 7px;
        border: 1px solid var(--rule);
        border-radius: 2px;
        font-size: 10.5px;
        letter-spacing: 0.08em;
        color: var(--grey);
        vertical-align: 2px;
        margin-left: 8px;
      }

      pre.log {
        margin: 0;
        max-height: 320px;
        overflow: auto;
        color: var(--dim);
        font:
          11px/1.6 ui-monospace,
          Consolas,
          monospace;
        white-space: pre-wrap;
        word-break: break-all;
        user-select: text;
      }

      /* --- 底部狀態列：遊戲每個畫面下緣那條 --- */
      footer {
        flex: none;
        display: flex;
        align-items: center;
        gap: 0;
        height: 28px;
        border-top: 1px solid var(--line);
        background: linear-gradient(180deg, #0d0d0d, #050505);
        font-size: 11.5px;
      }
      footer .cell {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 18px;
        margin: 0 4px;
        padding: 0 10px;
        border: 1px solid #2a2a28;
        border-radius: 2px;
        background: linear-gradient(180deg, #6a6866, #4c4a48);
        color: #16181c;
        font-weight: 600;
        white-space: nowrap;
      }
      footer .cell.grow {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        display: block;
        line-height: 16px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--grey);
        flex: none;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.5);
      }
      .dot.solo {
        background: var(--amber);
      }
      .dot.paired {
        background: var(--green);
      }
    </style>
  </head>
  <body>
    <header>
      <span class="brand">Unlight&nbsp;Companion</span>
      <!--
        ⚠ 版本要**隨時看得見**，不能只藏在「設置 › 關於」。
        自動更新是靜默的（updater.ts）—— 玩家不會知道自己被換過版，而回報問題時
        第一個要問的就是版本。藏兩層深等於每次都要教他點去哪裡看。
      -->
      <span class="ver" id="ver"></span>
      <span class="who" id="who"></span>
    </header>

    <nav class="tabs" id="tabs"></nav>

    <main>
      <aside id="side"></aside>
      <section class="body" id="content"></section>
    </main>

    <footer>
      <span class="cell"><span class="dot" id="dot"></span><span id="fProfile">—</span></span>
      <span class="cell" id="fGame">等遊戲…</span>
      <span class="cell" id="fLink">—</span>
      <span class="cell grow" id="fLast">—</span>
    </footer>

    <script>
      "use strict";

      // =====================================================================
      // 分頁結構
      //
      // ⚠ 大分頁**照里程碑分**，不是照實作狀態分。牌組／渦／獎勵／任務四個
      // 這一輪不出現（範圍決定），但加回來只要在這裡多一筆 —— 畫面的其餘部分
      // 完全不必動。
      // =====================================================================
      const TABS = [
        {
          id: "battle",
          label: "戰鬥",
          subs: [
            { id: "ready", label: "準備" },
            { id: "seconds", label: "秒數上限" },
            // ⚠ 加速的引擎與協商都做好了，**刻意不開放**。理由見 battle/speed
            // 那一頁：它動的是節奏，而節奏牽涉公平性，還沒驗夠。
            {
              id: "speed",
              label: "加速",
              todo: true,
              why: "引擎與協商都做好了，刻意還沒開放。",
              items: [
                "它動的是<b>對戰節奏</b>，而節奏牽涉公平性 —— 還沒驗夠。",
                "⚠ 而且效果有限：<b>戰鬥長度是伺服器排程的</b>，加速客戶端動畫改不動伺服器那一端的節拍。",
                "開放的前提是兩邊協商一致，單邊加速沒有意義。",
              ],
            },
            { id: "count", label: "記牌", todo: true },
            { id: "replay", label: "牌譜", todo: true },
          ],
        },
        {
          id: "deck",
          label: "牌組",
          subs: [
            { id: "cost", label: "Cost 表" },
            // ⚠ 排在「Cost 表」與「配對」中間是玩家指定的順序，也是實際的
            // 動線：先選一份規則（Cost 表）→ 改它（編輯 COST／編輯規則）
            // → 拿去約戰（配對）。
            //
            // ⚠ 「編輯 COST」與「編輯規則」是**同一個檔案的兩半**，分頁是因為
            // 它們的形狀差太多：一邊是 1186 個數字格，一邊是十幾段區間。
            { id: "costedit", label: "編輯 COST" },
            { id: "ruleedit", label: "編輯規則" },
            { id: "match", label: "配對" },
            { id: "hidden", label: "隱藏地圖" },
          ],
        },
        {
          id: "vortex",
          label: "渦",
          subs: [
            { id: "vspeed", label: "速度加倍", todo: true },
            { id: "vteam", label: "推薦隊伍", todo: true },
            { id: "vrank", label: "排名與獎勵", todo: true },
          ],
        },
        { id: "bonus", label: "獎勵", subs: [{ id: "foresight", label: "未來視", todo: true }] },
        { id: "quest", label: "任務", subs: [{ id: "chest", label: "寶箱標註", todo: true }] },
        {
          id: "settings",
          label: "設置",
          subs: [
            { id: "link", label: "連線" },
            { id: "startup", label: "啟動" },
            { id: "update", label: "更新" },
            { id: "log", label: "記錄" },
            { id: "about", label: "關於" },
            // ⚠ **「配置」是整個介面裡優先級最低的一格，而且預設看不見。**
            //
            // 它管的是多開（一個視窗管一個遊戲客戶端，要管兩個就開兩份）。
            // 預設的使用者不知道有這回事，也不需要知道 —— 裝完就是一個視窗，
            // 埠、中間人埠、「開新實例」對他全都是雜訊。
            //
            // 要打開它得自己去 關於 那頁最底下勾「進階：同時管兩個遊戲客戶端」。
            // 排在關於後面是刻意的：找得到的人本來就是在找它。
            { id: "profiles", label: "配置", advanced: true },
          ],
        },
      ];

      /** 這個大分頁現在該顯示哪幾格。進階的那幾格只有玩家自己打開才出現。 */
      function subsOf(t) {
        const multi = snap?.store?.multiProfile === true;
        return t.subs.filter((s) => !s.advanced || multi);
      }

      let tab = "battle";
      let sub = "ready";
      let snap = null;
      /** 拖動滑桿時不要被推播的狀態蓋回去，不然會一直跳。 */
      let dragging = false;
      /** 正在編輯某個欄位時同理 —— 每次推播重畫會把游標踢掉。 */
      let editing = null;

      const $ = (id) => document.getElementById(id);
      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
        );

      // =====================================================================
      // 外殼
      // =====================================================================
      function renderChrome() {
        $("tabs").innerHTML = TABS.map(
          (t) =>
            `<button data-tab="${t.id}" aria-selected="${t.id === tab}">${esc(t.label)}</button>`,
        ).join("");
        const current = TABS.find((t) => t.id === tab);
        $("side").innerHTML = subsOf(current)
          .map(
            (s) =>
              `<button data-sub="${s.id}" class="${s.todo ? "todo" : ""}" aria-selected="${
                s.id === sub
              }">${esc(s.label)}</button>`,
          )
          .join("");
      }

      $("tabs").addEventListener("click", (e) => {
        const id = e.target.closest("button")?.dataset.tab;
        if (!id || id === tab) return;
        tab = id;
        sub = subsOf(TABS.find((t) => t.id === id))[0].id;
        renderChrome();
        renderBody();
      });

      $("side").addEventListener("click", (e) => {
        const id = e.target.closest("button")?.dataset.sub;
        if (!id || id === sub) return;
        sub = id;
        renderChrome();
        renderBody();
      });

      // =====================================================================
      // 狀態列
      // =====================================================================
      const LINK_TEXT = {
        // ⚠ idle 不是錯誤，是「還不需要連」。跟 offline 分開講是刻意的 ——
        // 混成同一句的話，玩家在大廳看到「沒連上中間人」會以為壞了。
        idle: "還沒進對戰",
        offline: "沒連上中間人",
        solo: "還沒配到對手",
        paired: "已配到對手",
        incompatible: "⚠ 版本不合，已退回單邊",
      };

      /**
       * 對手是 NPC 的那幾種 rule（`status.rule`）。認不出來就不特別講。
       *
       * ⚠ 這幾種模式底下**準備與秒數整組不生效**（2026-08-09），所以每一處
       * 顯示「生效中／已配對」的地方都要先問過它，否則 UI 會宣稱一個不存在的保護。
       */
      const NPC_RULE_TEXT = { quest: "任務", raid: "渦", event: "活動" };

      function renderFooter() {
        const st = snap?.status;
        const p = snap?.profile;
        /**
         * ⚠ **右上角只寫「這個視窗是誰」，不寫埠、不寫中間人。**
         *
         * 那兩個東西以前掛在這裡，但它們回答的不是玩家會問的問題。埠是實例身分
         * （玩家現在一律用 `--remote-debugging-port=0`，那個數字根本沒有人在聽），
         * 中間人是預設值就會動的東西 —— 兩個都只會讓人停下來想「我是不是漏設了
         * 什麼」。要查的人在 設置 › 連線 找得到。
         *
         * 配置名稱**也只在多開打開時**才有意義：只有一個客戶端的人，那就是一個
         * 他沒取過的名字。
         */
        const multi = snap?.store?.multiProfile === true;
        $("ver").textContent = snap?.version ? `v${snap.version}` : "";
        $("who").textContent = p && multi ? p.name : "";
        // 只有一份實例時這一格留空 —— 旁邊那顆燈就是全部的資訊，
        // 補一個玩家沒取過的名字只是讓狀態列多一個要解讀的東西。
        $("fProfile").textContent = p && multi ? p.name : "";
        $("dot").className =
          "dot " + (!st || !st.connected ? "" : st.link === "paired" ? "paired" : "solo");
        $("fGame").textContent = !st
          ? "啟動中…"
          : !st.connected
            ? "等遊戲…"
            : st.armed
              ? // ⚠ 打任務／渦時也是 armed，但那不是「對戰中」。講成對戰中的話，
                // 玩家會合理地期待準備與秒數在管 —— 而它們刻意沒有。
                NPC_RULE_TEXT[st.rule]
                ? `${NPC_RULE_TEXT[st.rule]}中（對手是 NPC）`
                : `對戰中${st.seat ? `（座位 ${st.seat}）` : ""}`
              : "已接上，還沒進對戰";
        $("fLink").textContent = st
          ? st.connected && !st.pvp && NPC_RULE_TEXT[st.rule]
            ? "不生效（NPC）"
            : (LINK_TEXT[st.link] ?? st.link)
          : "—";
        $("fLast").textContent = st?.error ? "⚠ " + st.error : (st?.lastSend ?? "—");
      }

      // =====================================================================
      // 內容
      // =====================================================================
      const PAGES = {};

      /** 這一格在 TABS 裡的定義。找不到回 null。 */
      function subDef(tabId, subId) {
        const t = TABS.find((x) => x.id === tabId);
        return t?.subs.find((s) => s.id === subId) ?? null;
      }

      /**
       * 沒有對應 PAGES 條目時畫什麼。
       *
       * ⚠ **絕對不要退回空字串。** 空白頁不會報錯、不會出現在 log 裡，看起來
       * 就只是「這個功能壞了」—— 配置頁與五個預告頁就是這樣安靜地消失了很久
       * （分頁註冊了、CSS 與事件都在，只有 render 函式沒寫）。
       */
      function missingPage(tabId, subId) {
        const def = subDef(tabId, subId);
        const label = def?.label ?? subId;
        if (def?.todo) {
          // 知道卡在哪就講明白（見 todoPage 的註解：不要只寫「敬請期待」）。
          return todoPage(
            label,
            def.why ?? "這個功能還沒做。",
            def.items ?? [
              "分頁先放著是為了讓你知道規劃了什麼，不是它壞了。",
              "做好之後這一頁會換成真正的內容。",
            ],
          );
        }
        // 不是預告卻沒有頁面 —— 那是真的漏了，要講出來而不是裝沒事。
        return (
          head(label, "", "缺頁") +
          `<div class="card"><div class="hint warn" style="margin-top:0">
             ⚠ 這一頁還沒接上（<code>${esc(tabId)}/${esc(subId)}</code> 沒有對應的畫面）。
             這是插件的問題，不是你的操作。
           </div></div>`
        );
      }

      function renderBody() {
        const fn = PAGES[`${tab}/${sub}`];
        $("content").innerHTML = fn ? fn() : missingPage(tab, sub);
        // 配對頁與隱藏地圖頁的資料不在 snapshot 裡，開著的時候才輪詢。
        if (onMatchPage()) startMatchPolling();
        else stopMatchPolling();
        if (onStagePage()) startStagePolling();
        else stopStagePolling();
      }

      function head(title, lede, badge) {
        return (
          `<h2>${esc(title)}${badge ? `<span class="badge">${esc(badge)}</span>` : ""}</h2>` +
          `<div class="rule"></div>` +
          (lede ? `<p class="lede">${lede}</p>` : "")
        );
      }

      /** 未實作的頁長什麼樣。**要講清楚卡在哪**，不是只寫「敬請期待」。 */
      function todoPage(title, why, items) {
        return (
          head(title, "", "未實作") +
          `<div class="todo-box"><h3>${esc(why)}</h3><ul>` +
          items.map((i) => `<li>${i}</li>`).join("") +
          `</ul></div>`
        );
      }

      // --- 戰鬥 › 準備 ------------------------------------------------------
      /**
       * OK 鈕的顏色。**「官方原本」是預設值**（玩家指定）。
       *
       * 琥珀色跟系統匣圖示的「已接上、還沒配對」同一個值，不是隨手挑的。
       */
      const TINTS = [
        { label: "官方原本", value: null },
        { label: "琥珀色", value: 0xffc247 },
      ];
      const hex = (n) => "#" + n.toString(16).padStart(6, "0");

      /**
       * 準備功能現在到底有沒有在管，以及**為什麼沒有**。
       *
       * ⚠ 「否」一個字是不夠的。這個功能有四種不生效的理由，而玩家能自己處理的
       * 只有其中兩種（自己關掉、對手沒開）；另外兩種（在打 NPC、還沒握手）
       * 講不清楚的話，他會以為插件壞了而去重裝。
       */
      function readyWhy(st, on) {
        if (!on) return "否（我自己關掉了）";
        if (!st?.connected) return "否（還沒接上遊戲）";
        const npc = NPC_RULE_TEXT[st.rule];
        if (npc) return `否（正在打${npc}，對手是 NPC）`;
        if (st.link !== "paired") return "否（還沒握手到對手的插件）";
        if (!st.agreed.readyEnabled) return "否（對手把準備關掉了）";
        return "是（雙方都開，已握手）";
      }

      PAGES["battle/ready"] = () => {
        const st = snap?.status;
        const on = snap?.profile.prefs.readyEnabled;
        const tint = snap?.profile.readyTint ?? null;
        const live = on && st?.pvp && st?.link === "paired" && st?.agreed.readyEnabled;
        return (
          head("準備", "按下 OK 不立刻送出，等對手也按了才同時送出。") +
          `<div class="card">
             <label class="toggle">
               <input type="checkbox" id="ready" ${on ? "checked" : ""} />
               <span><b>啟用準備功能</b>
                 <div class="hint">
                   再按一次可以取消，對手一動也會解除。<br />
                   ⚠ <b>只在跟真人對戰、而且兩邊都握手成功時生效。</b>
                   打任務、打渦以及對手沒裝插件時完全不介入。
                 </div>
               </span>
             </label>
           </div>
           <div class="card">
             <div class="row"><span><b>OK 鈕的顏色</b></span></div>
             <div class="presets" id="tints">${TINTS.map(
               (t) =>
                 `<button data-tint="${t.value === null ? "" : t.value}" aria-pressed="${
                   t.value === tint
                 }">${esc(t.label)}</button>`,
             ).join("")}</div>
             <label class="toggle" style="margin-top:10px">
               <input type="color" id="tintPick" value="${hex(tint ?? 0xffc247)}" />
               <span><b>自訂顏色</b>
                 <div class="hint">
                   準備中（壓著 OK 沒送出）時把按鈕染成這個顏色。<br />
                   ⚠ 選「官方原本」＝完全不改遊戲畫面，代價是少了「插件正在管這個階段」的視覺提示 ——
                   那時要改看系統圖示（見下方）。
                 </div>
               </span>
             </label>
           </div>
           <div class="card">
             <div class="row"><span class="dim">我這邊</span><span>${on ? "已開啟" : "已關閉"}</span></div>
             <div class="row"><span class="dim">實際生效</span>
               <span class="${live ? "good" : "warn"}">${esc(readyWhy(st, on))}</span></div>
             <div class="row"><span class="dim">剛剛送出</span><span>${esc(st?.lastSend ?? "—")}</span></div>
           </div>`
        );
      };

      // --- 戰鬥 › 秒數上限 --------------------------------------------------
      PAGES["battle/seconds"] = () => {
        const st = snap?.status;
        const prefs = snap?.profile.prefs;
        const lim = snap?.limits ?? { minSeconds: 5, maxSeconds: 30 };
        // ⚠ 「配到對手」不等於「秒數會生效」—— 打任務／渦時對面是 NPC，
        // 這條規則整組不套用（2026-08-09）。兩件事混在同一個布林裡的話，
        // 玩家會在渦裡看到「共同值 15 秒」然後等一個永遠不會來的強制結束。
        const paired = st?.link === "paired" && st?.pvp === true;
        const npcRule = NPC_RULE_TEXT[st?.rule];
        return (
          head("秒數上限", "移動階段要多長。共同值取<b>雙方比較長的那個</b>。") +
          `<div class="card">
             <div class="row"><span><b>我希望的階段長度</b></span>
               <span class="big" id="secLabel">${prefs?.phaseSeconds ?? 30}</span></div>
             <input type="range" id="seconds" min="${lim.minSeconds}" max="${lim.maxSeconds}"
                    step="1" value="${prefs?.phaseSeconds ?? 30}" />
             <div class="ticks"><span>${lim.minSeconds} 秒</span><span>${lim.maxSeconds} 秒（不縮短）</span></div>
             <div class="hint ${paired ? "" : "warn"}" id="agreed">${
               paired
                 ? `共同值 ${st.agreed.phaseSeconds} 秒（取雙方較長的那個）` +
                   (st.hazard ? `，防止壓秒出聖水生效中 → ${st.capSeconds} 秒` : "")
                 : npcRule
                   ? `正在打${npcRule} —— 對手是 NPC，秒數不縮短（這條只對真人對戰）`
                   : "還沒握手到對手 —— 秒數不會縮短（單方面縮短只是自己更早承諾）"
             }</div>
           </div>
           <div class="card">
             <div class="row"><span><b>防止壓秒出聖水</b></span
               ><span class="good">握手後強制生效</span></div>
             <div class="hint">
               手牌有聖水／聖杯，而且場上有麻痺、降低移動或<b>剩一回合的自壞</b>時，
               這個階段再短 5 秒。<br />
               ⚠ <b>這條不需要雙方同意</b>，握手成功就一起套用 ——
               它對兩邊對稱（同一個局面各砍同樣的秒數），沒有人能靠關掉它拿到優勢。<br />
               ⚠ <b>砍完不會低於 8 秒</b>（9→8、10→8、13→8、20→15）——
               砍到 4~5 秒連把牌拖到場上都來不及，而時間到是把<b>當下的場面</b>
               送出去，不是空手。
             </div>
           </div>`
        );
      };

      // --- 牌組 › Cost 表 ---------------------------------------------------
      /**
       * 自訂 COST。
       *
       * ⚠ 這一頁最重要的一件事是**講清楚「選了規則」跟「畫面上真的變了」是
       * 兩回事**。注入走 `addScriptToEvaluateOnNewDocument`，只對之後載入的
       * document 生效 —— 玩家選完規則盯著牌組畫面看不到變化是**正常的**，
       * 而如果 UI 只寫「已啟用」，他會以為插件壞了然後去重裝。
       */
      const COST_PHASE_TEXT = {
        off: "未啟用（顯示原版數字）",
        pending: "已裝上，等遊戲重新載入才會變",
        applied: "生效中",
        error: "注入失敗",
      };

      /**
       * 罰則的狀態跟價格分開。
       *
       * ⚠ 這不是多此一舉：罰則走 `Deck.prototype.getCost`，<b>立刻生效</b>；
       * 價格走載入時的資料改寫，要重載。合成一句話一定會對其中一邊說謊。
       */
      const COST_PENALTY_TEXT = {
        off: "用遊戲原本的（7~13 罰 5、14 以上罰 10）",
        applied: "生效中",
        error: "注入失敗",
      };

      /** 壓 C 區間寫成人話：`7 ~ 13 → +5`、`14 以上 → +10`。 */
      function bandText(b) {
        const range =
          b.maxGap === null
            ? `${b.minGap} 以上`
            : b.minGap === b.maxGap
              ? `${b.minGap}`
              : `${b.minGap} ~ ${b.maxGap}`;
        return `差距 ${range} → +${b.extraCost}`;
      }

      PAGES["deck/cost"] = () => {
        const st = snap?.status;
        const rule = snap?.costRule ?? null;
        const failure = snap?.costRuleError ?? null;
        const cost = st?.cost ?? {
          phase: "off",
          applied: null,
          unknownKeys: 0,
          penalty: "off",
          penaltyEverywhere: false,
          bands: null,
          error: null,
        };

        const chosen = rule
          ? `<div class="card">
               <div class="row"><span class="dim">規則</span><span><b>${esc(rule.name)}</b> ${esc(rule.version)}</span></div>
               <div class="row"><span class="dim">作者</span><span>${esc(rule.publisher)}</span></div>
               ${
                 // 四張表分開列。一個總數看不出「這份規則管不管裝備」，而那是
                 // 拿到別人的規則檔時第一個要知道的事。0 筆＝那種卡用原版價格。
                 [
                   ["角色", rule.tableEntries.characters],
                   ["怪物卡", rule.tableEntries.monsters],
                   ["裝備", rule.tableEntries.equipment],
                   ["事件卡", rule.tableEntries.eventCards],
                 ]
                   .map(
                     ([label, n]) =>
                       `<div class="row"><span class="dim">${label}</span><span>${
                         n === 0 ? '<span class="dim">沒定價，用原版</span>' : `${n} 筆`
                       }</span></div>`,
                   )
                   .join("")
               }
               <div class="row"><span class="dim">遊戲版本</span><span>${esc(rule.gameVersion)}</span></div>
               <div class="row"><span class="dim">核對碼</span><span>${
                 rule.shortHash
                   ? `<code>${esc(rule.shortHash)}</code>`
                   : '<span class="dim">裸規則，沒有核對碼</span>'
               }</span></div>
               <div class="row"><span class="dim">檔案</span><span>${esc(rule.fileName)}</span></div>
               ${
                 rule.shortHash
                   ? `<div class="hint">跟對手約戰時核對這 8 碼 —— 一樣才代表兩邊算的是同一份規則。
                        這個碼是<b>照檔案內容算出來的</b>，改一個數字它就會變。</div>`
                   : `<div class="hint warn">⚠ 這是裸規則檔，沒有內容雜湊，不能拿去跟對手核對。要分享請先跑 <code>companion pack</code>。</div>`
               }
               ${
                 rule.rehashedFrom
                   ? // 直接改包是支援的做法，所以這不是錯誤 —— 但一定要說，
                     // 否則玩家會拿著新數字去跟對手核對舊的碼。
                     `<div class="hint warn">⚠ 這個檔案被直接編輯過，核對碼已重算：
                        <code>${esc(rule.rehashedFrom)}</code> → <code>${esc(rule.shortHash ?? "")}</code><br />
                        對手手上那份還是舊的 —— <b>把這個檔案傳給他</b>，兩邊的碼才會一樣。</div>`
                   : ""
               }
             </div>`
          : failure
            ? // ⚠ 這張卡片是「選了沒反應」的解藥。載入失敗時 costRule 是 null，
              // 沒有它的話這一頁只會說「還沒選規則」—— 跟根本沒按過一模一樣。
              `<div class="card">
               <div class="row"><span class="dim">規則</span><span class="bad"><b>載入失敗，沒有套用</b></span></div>
               <div class="row"><span class="dim">檔案</span><span>${esc(failure.fileName)}</span></div>
               <div class="hint warn">⚠ ${esc(failure.message)}</div>
               ${
                 failure.hint
                   ? `<div class="hint">${esc(failure.hint).replace(/\n/g, "<br />")}</div>`
                   : ""
               }
               <div class="hint">遊戲顯示的仍然是原版 COST。修好之後再選一次。</div>
             </div>`
            : `<div class="card">
               <div class="hint">還沒選規則。遊戲顯示的是原版 COST。</div>
             </div>`;

        const state = `<div class="card">
             <div class="row"><span class="dim">卡片價格</span><span>${
               COST_PHASE_TEXT[cost.phase] ?? cost.phase
             }</span></div>
             <div class="row"><span class="dim">壓 C 罰則</span><span>${
               cost.penalty === "applied"
                 ? cost.penaltyEverywhere
                   ? "生效中（立即，全遊戲）"
                   : "生效中（⚠ 目前只有牌組畫面）"
                 : (COST_PENALTY_TEXT[cost.penalty] ?? cost.penalty)
             }</span></div>
             ${
               cost.applied !== null
                 ? `<div class="row"><span class="dim">已改寫</span><span>${cost.applied} 張卡</span></div>`
                 : ""
             }
             ${
               cost.unknownKeys > 0
                 ? `<div class="hint warn">⚠ 規則有 ${cost.unknownKeys} 個鍵這個客戶端沒有。規則可能是給別的遊戲版本用的 —— 那些卡會被當成 99C。</div>`
                 : ""
             }
             ${cost.error ? `<div class="hint warn">⚠ ${esc(cost.error)}</div>` : ""}
             ${
               cost.phase === "pending"
                 ? `<div class="hint">⚠ 這兩件事的生效時機<b>不一樣</b>。<br />
                      <b>壓 C 罰則</b>改的是遊戲的計算函式，<b>已經生效</b>了 ——
                      牌組畫面的罰則與總和現在就是規則裡的。<br />
                      <b>卡片價格</b>改的是載入時的資料，只對<b>之後載入</b>的畫面生效，
                      要按下面的重載或自己重開遊戲。</div>`
                 : ""
             }
           </div>`;

        const bands = rule
          ? rule.bands === null
            ? `<div class="card"><div class="hint">這份規則不壓 C。</div></div>`
            : `<div class="card">
                 <div class="row"><span class="dim">壓 C</span><span>${rule.bands.length} 段</span></div>
                 ${rule.bands
                   .map(
                     (b) =>
                       `<div class="row"><span class="dim">·</span><span>${esc(bandText(b))}</span></div>`,
                   )
                   .join("")}
                 <div class="hint">壓 C 是<b>隊內每一對出戰卡</b>各判一次，三張就是三對。
                   <b>怪物卡也算</b> —— 它跟角色共用同樣那三個槽位；
                   裝備與事件卡計入總和但<b>不</b>參與壓 C。<br />
                   遊戲畫面上的 <code>+N</code> 徽章與總和都會照這張表重算。<br />
                   ⚠ 對戰大廳的 <code>cost:</code> 是<b>進場時跟伺服器要的</b>，
                   換規則後要離開再進去一次才會重新抓。<br />
                   ⚠ 存牌組時送上伺服器的仍然是<b>原版數字</b> —— 插件不改變伺服器的判定。</div>
               </div>`
          : "";

        return (
          head(
            "Cost 表",
            "套用自訂 COST —— 角色、怪物、裝備、事件卡四張表。只改本機顯示，不會改變伺服器的判定。",
          ) +
          chosen +
          state +
          bands +
          `<div class="card">
             <div class="presets">
               <button id="costPick">選規則檔…</button>
               ${rule ? `<button id="costClear">停用</button>` : ""}
               ${rule && st?.connected ? `<button id="costReload">重載遊戲讓它生效</button>` : ""}
             </div>
             <div class="hint">
               ⚠ 重載會<b>打斷正在進行的對戰</b>。
               ${st?.connected ? "" : "現在還沒接上遊戲，接上之後才按得到。"}
             </div>
           </div>
           <div class="card">
             <div class="hint">
               規則檔怎麼來：<code>companion official-rule</code> 匯出一份原版表
               （四張表一次全帶），<b>直接改裡面的數字</b>就是你的版本了 ——
               核對碼會在載入時自動重算，不用先解包。改完把檔案傳給對手，
               兩邊的碼一樣就是同一份規則。<br />
               四張表的鍵：角色 <code>cc078_04</code>、怪物 <code>mc001_01</code>、
               裝備 <code>wp001</code>、事件卡 <code>ev091</code>。
               後兩者的數字是<b>補零到三位的卡片編號</b>，寫成 <code>wp1</code> 不算數。
             </div>
           </div>`
        );
      };

      // --- 設置 › 連線 ------------------------------------------------------
      /**
       * 「怎麼讓插件接得到遊戲」——**一行字加一顆複製按鈕，就這樣。**
       *
       * ⚠ **這一段以前有 5 個步驟加 4 條警告，那是寫給我自己看的，不是寫給玩家的。**
       * 玩家要的不是理解 CDP，是知道下一步按哪裡。那 4 條警告全部是「填固定埠時
       * 才會出事」的排錯知識 —— 改成叫大家填 `0` 之後，那些情況一個都不會發生，
       * 於是整段可以刪掉，而不是折疊起來。**指示變短的正確方式是讓它變得不必要。**
       *
       * 剩下的排錯（埠被保留、被別的程式佔走、asar 是網頁版）由
       * `explainDebugPort()` 在真的出事時講一句，而且是講**那一次**的原因 ——
       * 比預先把四種可能都攤在玩家面前準。
       *
       * ⚠ **網頁版沒有這一段。** 那條路要自己改 `app.asar`，玩家做不到 ——
       * 對他講等於叫他去撞牆。（我自己也不需要：我知道那支 cmd 在哪。）
       */
      function howToConnect(p) {
        if (p?.kind === "web") return "";
        return `<div class="card">
           <div class="row"><span><b>接不上遊戲？</b></span></div>
           <div class="hint">在 Steam 的啟動選項填這一行，然後重開遊戲：</div>
           <div class="row">
             <code>${esc(snap?.debugFlag ?? "")}</code>
             <button id="copyFlag">複製</button>
           </div>
         </div>`;
      }

      // --- 牌組 › 編輯 COST -------------------------------------------------
      //
      // 這一頁存在的理由只有一句：**規則檔裡是 `cc001_01`，玩家看得懂的是
      // 「艾伯李斯特 L1」。** 中間那份對照叫名冊（catalog），從玩家自己跑著的
      // 客戶端讀出來，存在家目錄重複使用。
      //
      // ⚠ 這一頁的資料**不在 snapshot 裡**：四張表加起來 1186 筆，而快照每次
      // 狀態變動都整份重送。開頁時用 `editor.load()` 拉一次就好。

      /** 編輯器的全部狀態。`null` = 還沒載入。 */
      let ed = null;
      /** 四張表哪一張開著。 */
      let edTab = "characters";
      /** 名字的篩選字串。700 位角色，沒有它找不到人。 */
      let edFilter = "";
      /** 上一次存檔的結果，畫在按鈕旁邊。 */
      let edMsg = null;
      /** 正在載入中，避免重複發 IPC。 */
      let edLoading = false;

      const onEditPage = () => tab === "deck" && sub === "costedit";

      const ED_TABS = [
        { id: "characters", label: "角色卡" },
        { id: "eventCards", label: "事件卡" },
        { id: "equipment", label: "裝備卡" },
        { id: "monsters", label: "怪物卡" },
      ];

      function edLoad(force) {
        if (edLoading) return;
        if (ed !== null && !force) return;
        edLoading = true;
        window.ulr.editor.load().then((payload) => {
          edLoading = false;
          ed = decorate(payload);
          if (onEditPage()) renderBody();
        });
      }

      /**
       * 把 IPC 送來的東西整理成畫面直接可用的樣子。
       *
       * 兩件事：
       * 1. **原價索引**（`base`）—— 每一格都要知道「原本是多少」，才畫得出
       *    「改過了」與「改回原價」。
       * 2. **草稿**（`draft`）—— 規則裡沒有的鍵先用原價填。那正是「舊規則只有
       *    角色表」的升級路徑：打開編輯器、按存檔，四張表就補齊了。
       */
      function decorate(payload) {
        const base = {};
        const draft = {};
        for (const t of ED_TABS) {
          base[t.id] = {};
          draft[t.id] = {};
        }
        const cat = payload.catalog;
        if (cat) {
          for (const g of cat.characters)
            for (const c of g.cards) base.characters[c.key] = c.baseCost;
          for (const g of cat.monsters) for (const c of g.cards) base.monsters[c.key] = c.baseCost;
          for (const g of cat.equipment)
            for (const i of g.items) base.equipment[i.key] = i.baseCost;
          for (const g of cat.eventCards)
            for (const i of g.items) base.eventCards[i.key] = i.baseCost;
        }
        for (const t of ED_TABS) {
          const fromRule = payload.tables?.[t.id] ?? {};
          for (const k of Object.keys(base[t.id])) draft[t.id][k] = base[t.id][k];
          // 規則寫了什麼就蓋上去。⚠ 規則有、名冊沒有的鍵也要留著 —— 那是
          // 「規則比客戶端新（或舊）」的訊號，默默丟掉等於偷改別人的規則。
          for (const k of Object.keys(fromRule)) draft[t.id][k] = fromRule[k];
        }
        // 載入當下的樣子。**跟 base 是兩回事**，見 edUnsaved()。
        const saved = JSON.parse(JSON.stringify(draft));
        return { ...payload, base, draft, saved };
      }

      /**
       * 這一格跟**遊戲原價**不一樣嗎 —— 決定要不要標成琥珀色。
       *
       * 名冊沒有原價時（規則比客戶端新）一律當成沒改：我們不知道原價是多少，
       * 標成「改過了」是在講一件自己也不確定的事。
       */
      function edChanged(tableId, key) {
        const b = ed?.base[tableId]?.[key];
        if (b === undefined) return false;
        return ed.draft[tableId][key] !== b;
      }

      /**
       * 這一格跟**檔案裡存著的值**不一樣嗎 —— 決定存檔鈕與「未存檔」計數。
       *
       * ⚠ **這兩件事一定要分開。** 一份自訂規則本來就有一堆格子跟原價不同
       * （夾擠式那份就有兩格），拿「跟原價不同」當存檔鈕的條件的話，存完檔
       * 按鈕仍然亮著、上面還寫著「改動 4 格」—— 玩家會一直以為自己有東西沒存。
       */
      function edUnsaved(tableId, key) {
        return ed.draft[tableId][key] !== ed.saved[tableId][key];
      }

      function edUnsavedCount() {
        if (ed === null) return 0;
        let n = 0;
        for (const t of ED_TABS)
          for (const k of Object.keys(ed.draft[t.id])) if (edUnsaved(t.id, k)) n++;
        return n;
      }

      /** 跟原版不一樣的格數 —— 「這份規則到底動了多少東西」。 */
      function edCustomCount() {
        if (ed === null) return 0;
        let n = 0;
        for (const t of ED_TABS)
          for (const k of Object.keys(ed.draft[t.id])) if (edChanged(t.id, k)) n++;
        return n;
      }

      /** 篩選：名字對得上就留。空字串代表全部。 */
      function edMatch(name) {
        if (edFilter === "") return true;
        return name.toLowerCase().includes(edFilter.toLowerCase());
      }

      /**
       * 一個數字格。
       *
       * `data-k` 帶的是規則鍵（`cc001_01`）—— 程式要靠它定位，但**它不顯示**。
       * `title` 也帶著，是為了玩家回報問題時說得出是哪一張。
       */
      function edInput(tableId, key, label) {
        const v = ed.draft[tableId][key];
        const cls = edChanged(tableId, key) ? "dirty" : "";
        return (
          `<input type="number" step="0.01" class="${cls}" value="${v}" ` +
          `data-t="${tableId}" data-k="${esc(key)}" title="${esc(label)}（${esc(key)}）" />`
        );
      }

      /** 角色：一位一排，L1~L5 R1~R5。欄頭只印一次。 */
      function edCharacters(cat) {
        const groups = cat.characters.filter((g) => edMatch(g.name));
        if (groups.length === 0)
          return `<div class="hint">沒有名字對得上「${esc(edFilter)}」。</div>`;
        const slots = groups[0].cards.map((c) => `<div class="slot">${esc(c.slot)}</div>`).join("");
        const head = `<div class="ehead"><div class="ename">角色</div><div class="egrid c10">${slots}</div></div>`;
        const rows = groups
          .map(
            (g) =>
              `<div class="erow"><div class="ename" title="${esc(g.name)}">${esc(g.name)}</div>` +
              `<div class="egrid c10">${g.cards
                .map(
                  (c) =>
                    `<div class="ecell">${edInput("characters", c.key, `${g.name} ${c.slot}`)}</div>`,
                )
                .join("")}</div></div>`,
          )
          .join("");
        return head + rows;
      }

      /** 怪物：M1~M3，一排放三種不同的怪物。 */
      function edMonsters(cat) {
        const groups = cat.monsters.filter((g) => edMatch(g.name));
        if (groups.length === 0)
          return `<div class="hint">沒有名字對得上「${esc(edFilter)}」。</div>`;
        const blocks = groups.map(
          (g) =>
            `<div class="mblock"><div class="mname" title="${esc(g.name)}">${esc(g.name)}</div>` +
            `<div class="egrid c3">${g.cards
              .map((c) => `<div class="slot">${esc(c.slot)}</div>`)
              .join("")}</div>` +
            `<div class="egrid c3">${g.cards
              .map(
                (c) =>
                  `<div class="ecell">${edInput("monsters", c.key, `${g.name} ${c.slot}`)}</div>`,
              )
              .join("")}</div></div>`,
        );
        const rows = [];
        for (let i = 0; i < blocks.length; i += 3) {
          rows.push(`<div class="mrow">${blocks.slice(i, i + 3).join("")}</div>`);
        }
        return rows.join("");
      }

      /**
       * 裝備：照「這是誰的專武」分組，一排 5 件。
       *
       * ⚠ 角色限制一定要標出來 —— 一件只有某位角色帶得動的武器，跟通用武器的
       * 定價考量完全不同。實測 238 件裡有 212 件是專武。
       */
      function edEquipment(cat) {
        const groups = cat.equipment
          .map((g) => ({ ...g, items: g.items.filter((i) => edMatch(i.name) || edMatch(g.name)) }))
          .filter((g) => g.items.length > 0);
        if (groups.length === 0)
          return `<div class="hint">沒有名字對得上「${esc(edFilter)}」。</div>`;
        return groups
          .map(
            (g) =>
              `<div class="egroup">${esc(g.name)}` +
              `<span class="sub">${g.charaId === null ? "誰都能帶" : "專武"} · ${g.items.length} 件</span></div>` +
              `<div class="egrid c5">${g.items
                .map(
                  (i) =>
                    `<div class="ecell"><span class="cn" title="${esc(i.name)}">${esc(i.name)}</span>` +
                    `${edInput("equipment", i.key, i.name)}</div>`,
                )
                .join("")}</div>`,
          )
          .join("");
      }

      /** 事件卡：族群一塊，一排 9 張（劍1~劍9、劍3·槍1~劍5·移動1…）。 */
      function edEvents(cat) {
        const groups = cat.eventCards
          .map((g) => ({ ...g, items: g.items.filter((i) => edMatch(i.name)) }))
          .filter((g) => g.items.length > 0);
        if (groups.length === 0)
          return `<div class="hint">沒有名字對得上「${esc(edFilter)}」。</div>`;
        return groups
          .map(
            (g) =>
              `<div class="egroup">${esc(g.name)}<span class="sub">${g.items.length} 張</span></div>` +
              `<div class="egrid c9">${g.items
                .map(
                  (i) =>
                    `<div class="ecell"><span class="cn" title="${esc(i.name)}">${esc(i.name)}</span>` +
                    `${edInput("eventCards", i.key, i.name)}</div>`,
                )
                .join("")}</div>`,
          )
          .join("");
      }

      /** 沒有名冊時這一頁做不了事 —— 要講清楚為什麼，以及下一步按哪裡。 */
      function edNoCatalog() {
        const why = ed?.catalogError
          ? `<div class="hint warn">⚠ ${esc(ed.catalogError)}</div>`
          : `<div class="hint">這一頁要先有一份<b>卡片名冊</b>才畫得出來 ——
               規則檔裡是 <code>cc001_01</code>，名冊才知道那是「艾伯李斯特 L1」。
               名冊從<b>你自己跑著的遊戲</b>讀，讀一次就會存起來，之後沒開遊戲也用得了。</div>`;
        return `<div class="card">
             <div class="row"><span class="dim">卡片名冊</span><span class="bad"><b>還沒有</b></span></div>
             ${why}
             <div class="presets" style="margin-top:8px">
               <button id="edCatalog" ${ed?.connected ? "" : "disabled"}>從遊戲讀取名冊</button>
             </div>
             <div class="hint">${
               ed?.connected
                 ? "遊戲已接上，按下去就會讀。"
                 : "現在還沒接上遊戲 —— 先把遊戲開起來（見「設置 › 連線」）。"
             }</div>
           </div>`;
      }

      PAGES["deck/costedit"] = () => {
        const title = head(
          "編輯 COST",
          "改自己的規則檔。<b>看到的是卡片名稱，不是編號</b> —— 中間那份對照從你自己的遊戲讀。",
        );
        if (ed === null) {
          edLoad(false);
          return title + `<div class="card"><div class="hint">載入中…</div></div>`;
        }
        if (ed.rule === null) {
          return (
            title +
            `<div class="card">
               <div class="row"><span class="dim">規則</span><span class="bad"><b>還沒選</b></span></div>
               <div class="hint">編輯 COST 是<b>改一份既有的規則檔</b>，所以要先有檔案。
                 到「牌組 › Cost 表」選一份 —— 沒有自己的規則就先選
                 <code>unlight-official</code>，那是原版數字的完整四張表，改它就是你的版本了。</div>
             </div>`
          );
        }

        const cat = ed.catalog;
        const unsaved = edUnsavedCount();
        const custom = edCustomCount();
        const size = cat
          ? {
              characters: cat.characters.reduce((n, g) => n + g.cards.length, 0),
              monsters: cat.monsters.reduce((n, g) => n + g.cards.length, 0),
              equipment: cat.equipment.reduce((n, g) => n + g.items.length, 0),
              eventCards: cat.eventCards.reduce((n, g) => n + g.items.length, 0),
            }
          : null;

        const header = `<div class="card">
             <div class="row"><span class="dim">正在編輯</span>
               <span><b>${esc(ed.rule.name)}</b>
                 <input type="text" id="edVersion" value="${esc(ed.rule.version)}" style="width:5.5em;margin-left:6px" />
               </span></div>
             <div class="row"><span class="dim">檔案</span><span>${esc(ed.rule.fileName)}</span></div>
             <div class="row"><span class="dim">未存檔</span><span>${
               unsaved === 0
                 ? '<span class="dim">沒有，都存好了</span>'
                 : `<b class="warn">${unsaved} 格</b>`
             }</span></div>
             <div class="row"><span class="dim">跟原版不同</span><span>${
               custom === 0 ? '<span class="dim">完全照原版</span>' : `${custom} 格`
             }</span></div>
             <div class="presets" style="margin-top:8px">
               <button id="edSave" ${unsaved === 0 ? "disabled" : ""}>存回這個檔</button>
               <button id="edResetTab" class="danger">這一頁全部改回原價</button>
             </div>
             ${edMsg ? `<div class="hint ${edMsg.bad ? "warn" : "good"}">${esc(edMsg.text)}</div>` : ""}
             <div class="hint">存檔會<b>就地覆寫同一個檔</b>，不會多生一份 ——
               核對碼每次都重算。<b>要傳給對手之前記得把版本號改掉</b>（上面那格），
               不然對手會拿舊版本號配到不同內容的規則。</div>
           </div>`;

        if (cat === null) return title + header + edNoCatalog();

        const tabs =
          `<div class="etabs">` +
          ED_TABS.map(
            (t) =>
              `<button data-edtab="${t.id}" aria-selected="${t.id === edTab}">${esc(t.label)}` +
              `<span class="n">${size[t.id]}</span></button>`,
          ).join("") +
          `</div>`;

        const tools = `<div class="row" style="margin-bottom:8px">
             <input type="text" id="edFilter" placeholder="打名字找卡（例：艾伯、聖水、短劍）" value="${esc(edFilter)}" style="flex:1" />
             <span class="dim" style="font-size:11px">名冊 ${esc(cat.gameVersion)} · ${esc(
               cat.readAt.slice(0, 10),
             )} 讀的</span>
             <button id="edCatalog" ${ed.connected ? "" : "disabled"}>重讀名冊</button>
           </div>`;

        const body =
          edTab === "characters"
            ? edCharacters(cat)
            : edTab === "monsters"
              ? edMonsters(cat)
              : edTab === "equipment"
                ? edEquipment(cat)
                : edEvents(cat);

        return title + header + tabs + tools + `<div class="card">${body}</div>`;
      };

      // --- 牌組 › 編輯規則 --------------------------------------------------
      //
      // 「編輯 COST」改的是**價格**（1186 個數字格），這一頁改的是**規則本身**。
      // 目前規則裡除了價格以外唯一有行為意義的欄位就是壓 C（`compressionRule`），
      // 所以這一頁現在只有壓 C。原版那份與自訂那份都改得動 —— 它們是同一種檔案，
      // 差別只在裡面的數字。
      //
      // ⚠ 隊伍 COST 上限**刻意不在這裡**。它是<b>對戰環境</b>的屬性而不是規則的
      // 屬性（伺服器按頻道下發，客戶端裡根本沒有這個常數），約定值填在「配對」
      // 那一頁 —— 見 docs/official-cost-rule.md 的「上限不在規則裡」。

      /** 這一頁的全部狀態。`null` = 還沒載入。 */
      let rl = null;
      let rlMsg = null;
      let rlLoading = false;

      const onRulePage = () => tab === "deck" && sub === "ruleedit";

      /** 官方的兩段。「改回原版壓 C」那顆按的就是它。 */
      const RL_OFFICIAL = [
        { minGap: 7, maxGap: 13, extraCost: 5 },
        { minGap: 14, maxGap: null, extraCost: 10 },
      ];

      function rlLoad(force) {
        if (rlLoading) return;
        if (rl !== null && !force) return;
        rlLoading = true;
        window.ulr.editor.load().then((payload) => {
          rlLoading = false;
          const bands = (payload.compression?.bands ?? []).map((b) => ({
            minGap: b.minGap,
            // ⚠ 主程序那邊「沒有上界」是**欄位不存在**，這裡一律正規化成 null。
            // 留著 undefined 的話 `b.maxGap === null` 那些判斷會全部漏掉它。
            maxGap: b.maxGap === undefined || b.maxGap === null ? null : b.maxGap,
            extraCost: b.extraCost,
          }));
          rl = { rule: payload.rule, bands, saved: JSON.stringify(bands) };
          if (onRulePage()) renderBody();
        });
      }

      /** 跟檔案裡存著的不一樣嗎 —— 決定存檔鈕。 */
      function rlDirty() {
        return rl !== null && JSON.stringify(rl.bands) !== rl.saved;
      }

      /**
       * 存不下去的錯。**跟主程序那邊是同一套判準**（`validateCostRule` 的
       * `band.*`），先在畫面上擋是為了讓玩家看到是哪一段，而不是存檔時收到
       * 一句 JSON Pointer。
       */
      function rlIssues(bands) {
        const bad = [];
        bands.forEach((b, i) => {
          if (!Number.isFinite(b.minGap) || !Number.isFinite(b.extraCost)) {
            bad.push(`第 ${i + 1} 段有欄位空著或不是數字。`);
          }
          if (b.maxGap !== null && b.maxGap < b.minGap) {
            bad.push(`第 ${i + 1} 段的上界 ${b.maxGap} 比下界 ${b.minGap} 小。`);
          }
        });
        if (bands.filter((b) => b.maxGap === null).length > 1) {
          bad.push("只能有一段留空上界（＝無上界），否則兩段一定重疊。");
        }
        const sorted = bands.map((b, i) => ({ ...b, i })).sort((a, b) => a.minGap - b.minGap);
        for (let n = 1; n < sorted.length; n++) {
          const prev = sorted[n - 1];
          const cur = sorted[n];
          const end = prev.maxGap === null ? Infinity : prev.maxGap;
          if (cur.minGap <= end) {
            bad.push(
              `第 ${prev.i + 1} 段與第 ${cur.i + 1} 段重疊 —— 同一個差距會對應到兩個追加值。`,
            );
          }
        }
        return bad;
      }

      /**
       * 兩段之間的縫隙。**這是警告不是錯誤**，但它是這個表最容易踩的坑。
       *
       * 點狀區間（`[7,7]`、`[8,8]`…）碰到**小數差距**會整段落空：角色 COST 一旦
       * 有小數，差距就是小數，而 7.5 在 [7,7] 與 [8,8] 之間一段都不中 →
       * 完全不罰，而且完全沒有提示。2026-08-15 的 `shinon/squeeze-band` 就是
       * 這樣整條曲線消失的，所以規則檔的上界才寫成 x.99。
       */
      function rlHoles(bands) {
        const sorted = bands
          .filter((b) => Number.isFinite(b.minGap))
          .map((b, i) => ({ ...b, i }))
          .sort((a, b) => a.minGap - b.minGap);
        const holes = [];
        for (let n = 1; n < sorted.length; n++) {
          const prev = sorted[n - 1];
          const cur = sorted[n];
          if (prev.maxGap === null) continue;
          if (cur.minGap > prev.maxGap) holes.push([prev.maxGap, cur.minGap]);
        }
        return holes;
      }

      /** 一個差距落在哪一段 → 追加多少。跟引擎同一套語義（照陣列順序取第一個命中的）。 */
      function rlExtraFor(bands, gap) {
        for (const b of bands) {
          if (!Number.isFinite(b.minGap)) continue;
          if (gap < b.minGap) continue;
          if (b.maxGap !== null && gap > b.maxGap) continue;
          return b.extraCost;
        }
        return 0;
      }

      function rlNum(v) {
        return v === null || v === undefined || Number.isNaN(v) ? "" : String(v);
      }

      /** 警告區塊的內容（重疊、縫隙）。改一格數字要立刻跟著變。 */
      function rlWarnHtml(bands) {
        const issues = rlIssues(bands);
        const holes = rlHoles(bands);
        return (
          (issues.length > 0
            ? `<div class="hint warn">⚠ ${issues.map(esc).join("<br />⚠ ")}</div>`
            : "") +
          (holes.length > 0
            ? `<div class="hint warn">⚠ 這幾段之間有縫隙：${holes
                .map(([a, b]) => `${a} ~ ${b}`)
                .join("、")}。<br />
                 整數差距不會掉進去，但<b>小數會</b> —— 角色 COST 只要有一個 13.2，
                 差距就是小數，落在縫隙裡就是<b>完全不罰</b>，而且沒有任何提示。
                 按上面那顆會把每一段的上界頂到下一段起點的前 0.01。</div>`
            : "")
        );
      }

      /** 試算表：差距 0~29 各追加多少。 */
      function rlPreviewHtml(bands) {
        return (
          `<div class="egrid c10" style="margin-top:6px">
             ${Array.from({ length: 30 }, (_, g) => `<div class="slot">${g}</div>`).join("")}
           </div>` +
          `<div class="egrid c10">
             ${Array.from({ length: 30 }, (_, g) => {
               const x = rlExtraFor(bands, g);
               return `<div class="ecell"><input type="text" readonly class="${
                 x > 0 ? "dirty" : ""
               }" value="${x === 0 ? "" : `+${x}`}" /></div>`;
             }).join("")}
           </div>`
        );
      }

      /**
       * 改一格數字之後把**衍生的那幾塊**重畫。
       *
       * ⚠ **不能整頁重畫。** `renderBody()` 是換掉 `#content` 的 innerHTML，
       * 玩家正在打字的那個輸入框會連同焦點一起消失 —— 每按一個鍵就要重新點一次。
       * 編輯 COST 那一頁踩過同一件事（700 個欄位），這裡只是欄位少而已。
       */
      function rlRefresh() {
        if (rl === null) return;
        const warn = $("rlWarn");
        if (warn) warn.innerHTML = rlWarnHtml(rl.bands);
        const preview = $("rlPreview");
        if (preview) preview.innerHTML = rlPreviewHtml(rl.bands);
        const dirty = rlDirty();
        const save = $("rlSave");
        if (save) save.disabled = !dirty || rlIssues(rl.bands).length > 0;
        const cell = $("rlDirtyCell");
        if (cell) {
          cell.innerHTML = dirty
            ? '<b class="warn">有改動</b>'
            : '<span class="dim">沒有，都存好了</span>';
        }
      }

      PAGES["deck/ruleedit"] = () => {
        const title = head(
          "編輯規則",
          "改規則檔裡<b>不是價格</b>的那一半。目前是壓 C —— 差距多少罰多少，一段一排。",
        );
        if (rl === null) {
          rlLoad(false);
          return title + `<div class="card"><div class="hint">載入中…</div></div>`;
        }
        if (rl.rule === null) {
          return (
            title +
            `<div class="card">
               <div class="row"><span class="dim">規則</span><span class="bad"><b>還沒選</b></span></div>
               <div class="hint">編輯規則是<b>改一份既有的規則檔</b>，所以要先有檔案。
                 到「牌組 › Cost 表」選一份 —— 沒有自己的規則就先選
                 <code>unlight-official</code>，那份的壓 C 就是原版的兩段。</div>
             </div>`
          );
        }

        const bands = rl.bands;
        const issues = rlIssues(bands);
        const dirty = rlDirty();

        const header = `<div class="card">
             <div class="row"><span class="dim">正在編輯</span>
               <span><b>${esc(rl.rule.name)}</b>
                 <input type="text" id="rlVersion" value="${esc(rl.rule.version)}" style="width:5.5em;margin-left:6px" />
               </span></div>
             <div class="row"><span class="dim">檔案</span><span>${esc(rl.rule.fileName)}</span></div>
             <div class="row"><span class="dim">壓 C</span><span>${
               bands.length === 0 ? '<span class="dim">這份規則不壓 C</span>' : `${bands.length} 段`
             }</span></div>
             <div class="row"><span class="dim">未存檔</span><span id="rlDirtyCell">${
               dirty ? '<b class="warn">有改動</b>' : '<span class="dim">沒有，都存好了</span>'
             }</span></div>
             <div class="presets" style="margin-top:8px">
               <button id="rlSave" ${dirty && issues.length === 0 ? "" : "disabled"}>存回這個檔</button>
               <button id="rlOfficial">改回原版兩段</button>
               <button id="rlClear" class="danger">清空（不壓 C）</button>
             </div>
             ${rlMsg ? `<div class="hint ${rlMsg.bad ? "warn" : "good"}">${esc(rlMsg.text)}</div>` : ""}
             <div class="hint">存檔會<b>就地覆寫同一個檔</b>，核對碼重算 ——
               跟「編輯 COST」是同一個檔案的兩半，兩邊互不影響。
               <b>要傳給對手之前記得改版本號</b>（上面那格）。<br />
               ⚠ 壓 C 改完<b>立刻生效</b>，不用重載遊戲（它攔的是遊戲的計算函式）；
               價格才要重載。</div>
           </div>`;

        const rows = bands
          .map(
            (b, i) => `<div class="bandrow">
               <span class="lbl">${i + 1}.</span>
               <span class="lbl">差距</span>
               <input type="number" step="0.01" data-rb="${i}" data-rf="minGap" value="${esc(rlNum(b.minGap))}" />
               <span class="lbl">～</span>
               <input type="number" step="0.01" data-rb="${i}" data-rf="maxGap" value="${esc(rlNum(b.maxGap))}" placeholder="無上界" />
               <span class="lbl">追加</span>
               <input type="number" step="0.01" data-rb="${i}" data-rf="extraCost" value="${esc(rlNum(b.extraCost))}" />
               <button data-rbdel="${i}" title="刪掉這一段">✕</button>
             </div>`,
          )
          .join("");

        const table = `<div class="card">
             <div class="row"><span class="dim">壓 C 區間</span>
               <span class="dim">上界留空＝無上界</span></div>
             ${
               bands.length === 0
                 ? `<div class="hint">一段都沒有 —— 這份規則<b>完全不壓 C</b>。
                      那跟「用原版」是兩回事：原版是 7~13 罰 5、14 以上罰 10。</div>`
                 : rows
             }
             <div class="presets">
               <button id="rlAdd">新增一段</button>
               <button id="rlSort">照差距排序</button>
               <button id="rlSnap">把上界頂到下一段（補小數縫隙）</button>
             </div>
             <div id="rlWarn">${rlWarnHtml(bands)}</div>
             <div class="hint">壓 C 是<b>隊內每一對出戰卡</b>各判一次，三張就是三對。
               <b>怪物卡也算</b>（它跟角色共用那三個槽位）；裝備與事件卡計入總和但不參與壓 C。<br />
               遊戲畫面上每張卡底下的 <code>+N</code> 會貼在<b>那一對裡比較便宜的那張</b>
               —— 壓 C 罰的就是被夾帶進來的低 C 卡。三格的和等於總罰則。</div>
           </div>`;

        // 對照表：一眼看出這條曲線長什麼樣。
        const preview = `<div class="card">
             <div class="row"><span class="dim">試算</span><span class="dim">差距 → 追加</span></div>
             <div id="rlPreview">${rlPreviewHtml(bands)}</div>
             <div class="hint">上排是<b>兩張卡的 COST 差距</b>，下排是這條曲線要追加多少。
               空白＝不罰。小數差距請看上面的縫隙警告 —— 這張表只列整數。</div>
           </div>`;

        return title + header + table + preview;
      };

      // --- 牌組 › 配對 ------------------------------------------------------
      //
      // ⚠ 這一頁的狀態**不在 snapshot 裡**。它要跟遊戲要（兩次 CDP 往返），
      // 塞進 snapshot 會讓每個無關的狀態變動都去戳一次遊戲。所以這頁自己在
      // 開著的時候輪詢，離開就停。
      let mstate = null;
      let matchTimer = null;
      /** 配對頁開著沒。輪詢只在這時候跑。 */
      const onMatchPage = () => tab === "deck" && sub === "match";
      /** 開房成功之後要交給對手的東西。⚠ 只活在記憶體，不落地、不進記錄檔。 */
      let matchHandoff = null;
      // ⚠ 預設值要跟官方一致：房名是客戶端的 `DEFAULT_NAMES.tcn`，地點是清單
      // 第一項（000 雷德貝魯格城）—— 官方對話框開起來就是這兩個。
      // **隨機是 014 不是 000**，很容易搞反。
      const mform = {
        roomName: null, // null = 還沒動過，用官方預設
        stage: "000",
        multi: true,
        bandOn: false,
        band: 5,
        // ⚠ 約定 COST 上限跟上面那個 ±N **是兩回事**：這個是自訂規則算的、
        // 插件自己檢查的；那個是伺服器用原版 COST 判的。兩個都要有，因為
        // 遊戲那邊擋不掉的東西只有我們擋得掉。
        limitOn: false,
        limit: 62,
      };

      function startMatchPolling() {
        if (matchTimer !== null) return;
        const tick = () =>
          window.ulr.match.state().then((s) => {
            mstate = s;
            if (!onMatchPage()) return;
            // ⚠ 正在打字就不要重畫。這頁每 3 秒輪詢一次，重畫會把游標跟半個
            // 房名一起吃掉 —— 使用者只會覺得輸入框壞了。
            const el = document.activeElement;
            if (el && /^(INPUT|SELECT)$/.test(el.tagName) && el.closest("#content")) return;
            renderBody();
          });
        void tick();
        // ⚠ 房間清單閒置時**約 20 秒才推一次**（2026-08-15 實測），輪詢再快也
        // 不會更新。3 秒是為了「連上／斷線」與自己剛開的房，不是為了清單。
        matchTimer = setInterval(tick, 3000);
      }
      function stopMatchPolling() {
        if (matchTimer !== null) clearInterval(matchTimer);
        matchTimer = null;
      }

      function channelLabel(n) {
        if (n === null || n === undefined) return "（沒進頻道）";
        const name = mstate?.channelNames?.[n];
        return name ? `${n} ${name}` : String(n);
      }

      PAGES["deck/match"] = () => {
        const s = mstate;
        const ctx = s?.context ?? null;
        const rule = s?.rule ?? null;
        const ch = ctx?.channel ?? null;
        const info = ch !== null ? (ctx?.channels?.[String(ch)] ?? null) : null;

        if (!s?.connected) {
          return (
            head("約戰", "跟指定的對手用同一份 COST 規則開一場。") +
            `<div class="card"><div class="hint warn">⚠ 還沒接上遊戲。請先開遊戲並確認「設置 › 連線」那邊是綠的。</div></div>`
          );
        }

        // 現在的狀態。⚠ 每一行都要標清楚數字是誰算的 —— 伺服器算的 COST 跟
        // 自訂規則算的不是同一個數，混在一起看會做出錯誤的判斷。
        const state = `<div class="card">
            <div class="row"><span class="dim">頻道</span><span>${esc(channelLabel(ch))}${
              info?.crossplay ? ' <span class="badge">跨平台</span>' : ""
            }${info?.type === "ranked" ? ' <span class="badge">排名</span>' : ""}</span></div>
            <div class="row"><span class="dim">玩家</span><span>${esc(ctx?.playerName ?? "—")}</span></div>
            <div class="row"><span class="dim">牌組</span><span>Deck${ctx?.deckNow ?? "—"}</span></div>
            <div class="row"><span class="dim">COST（伺服器算的）</span><span>${ctx?.deckCost ?? "—"}</span></div>
            ${
              s.myCost === null
                ? ""
                : `<div class="row"><span class="dim">COST（你的規則算的）</span><span>${
                    s.myCost.total === null
                      ? '<span class="dim">讀不到牌組</span>'
                      : `<b>${esc(s.myCost.total)}</b>`
                  }${
                    s.myCost.unknown > 0
                      ? ` <span class="badge">${s.myCost.unknown} 張沒定價</span>`
                      : ""
                  }</span></div>
                   <div class="hint">上面那個是<b>伺服器</b>用原版 COST 算的，遊戲的「牌組Cost限制 ±N」判的是它；
                     這一個是<b>你選的規則</b>算的，約戰的約定上限判的是它。<b>兩個是不同的數字</b>。${
                       s.myCost.unknown > 0
                         ? " ⚠ 有卡在這份規則裡沒有定價，一律當 99 算 —— 這個總和不能當真。"
                         : ""
                     }</div>`
            }
            <div class="row"><span class="dim">配對中</span><span>${ctx?.isMatching ? "是（已經開著一間房）" : "否"}</span></div>
            ${
              info?.type === "ranked"
                ? `<div class="hint warn">⚠ 這是排名頻道，有 BP 增減與伺服器 COST 上限。約戰建議用迪特赫姆（2）或布萊德克洛伊茲（4）。</div>`
                : ""
            }
            ${
              s.seq === 0
                ? `<div class="hint warn">⚠ 還沒收到房間清單。等收到之前不能開房 —— 空的清單分不出「你沒有房」跟「還不知道」。</div>`
                : ""
            }
          </div>`;

        const ruleCard = `<div class="card">
            <div class="row"><span class="dim">規則</span><span>${
              rule
                ? `<b>${esc(rule.name)}</b> ${esc(rule.version)}`
                : '<span class="dim">沒選，用原版 COST</span>'
            }</span></div>
            ${
              rule
                ? `<div class="row"><span class="dim">核對碼</span><span>${
                    rule.shortHash
                      ? `<code>${esc(rule.shortHash)}</code>`
                      : '<span class="dim">裸規則，沒有核對碼</span>'
                  }</span></div>
                   <div class="row"><span class="dim">規則族</span><span><code>${esc(rule.ruleSetId)}</code></span></div>
                   <div class="hint">要換規則請到「牌組 › Cost 表」。<b>自動配對是照「規則族」分的，不是照核對碼</b> ——
                     同一套規則的不同版本會排在同一條隊伍裡，配到之後插件會驗算「這一場算出來的東西一不一樣」，
                     一樣就能打。手動開房的話還是跟對手核對這 8 碼比較快。</div>`
                : `<div class="hint">要選規則請到「牌組 › Cost 表」。<b>自動配對一定要有規則</b> —— 沒有規則就沒有「約定」可言。</div>`
            }
          </div>`;

        // ⚠ **兩個 COST 限制是不同的東西**，UI 上一定要分開講。混在一起會做出
        // 「顯示有限制、實際判的是另一套數字」的狀態。
        const K = s.statics;
        const roomName = mform.roomName ?? K.defaultRoomName;
        // 官方那 11 項 + 官方選單裡沒有的四張。⚠ 兩組要分開標：後者在遊戲自己的
        // 選單上是選不到的，玩家要知道自己選的是哪一種。
        const opt = (g) =>
          `<option value="${esc(g.value)}"${mform.stage === g.value ? " selected" : ""}>${esc(g.value)} ${esc(g.name)}</option>`;
        const stageOpts =
          K.stages.map(opt).join("") +
          `<optgroup label="隱藏地圖（官方選單沒有）">` +
          K.hiddenStages.map(opt).join("") +
          `</optgroup>`;

        const bandOpts = K.costRanges
          .map((n) => `<option value="${n}"${mform.band === n ? " selected" : ""}>± ${n}</option>`)
          .join("");

        // 排隊中就把「會改變配對條件」的欄位鎖起來 —— 改了也不會生效（鍵是
        // 按下開始時算的），而一個「改了沒反應」的輸入框比鎖起來更難懂。
        const pairing = s.pairing ?? { phase: "idle" };
        const queueBusy = pairing.phase !== "idle" && pairing.phase !== "blocked";

        // 官方的 COST 階層。⚠ **只是快速鍵** —— 自訂 COST 想約幾就填幾，這幾顆
        // 只是省下每次自己打數字。duel 頻道自己沒有階層，借的是同一條 socket 上
        // 那個 ranked 頻道的（主程序的 costTiersFor 處理掉了）。
        const tiers = s.costTiers ?? null;
        const tierButtons =
          tiers === null || queueBusy
            ? ""
            : tiers.map((n) => `<button class="tier" data-tier="${n}">${n}</button>`).join("");
        const tierHint =
          tiers === null
            ? ch === null
              ? `<div class="hint">進了頻道之後，這裡會列出那個頻道的官方 COST 檔位當快速鍵。</div>`
              : ""
            : `<div class="hint">上面那幾顆是<b>頻道 ${esc(String(ch))} 的官方 COST 檔位</b>（${tiers.join(" / ")}），
                 按一下就填進去 —— 平常對戰最常約的就那幾檔。${
                   info?.type === "duel" ? "這個頻道自己沒有檔位，用的是同一組排名頻道的。" : ""
                 }
                 ⚠ 它們<b>每週二遊戲更新會變</b>，所以插件每次都現讀，不記在設定裡。</div>`;

        const form = `<div class="card">
            <div class="row"><span class="dim">房間名</span>
              <span><input id="mRoomName" type="text" maxlength="20" value="${esc(roomName)}" /></span></div>
            <div class="row"><span class="dim">對戰地點</span>
              <span><select id="mStage">${stageOpts}</select></span></div>
            <div class="hint">官方選單是 000～009 加上 014（隨機），中間的 010～013 整段跳過 ——
              但那四張是<b>真的地圖</b>：客戶端的背景圖抓得到，013 甚至是動畫圖。
              要在<b>遊戲自己的開房對話框</b>裡也選得到，去「隱藏地圖」那一頁打開。</div>
            <div class="row"><span class="dim">對戰規則</span>
              <span><select id="mMulti" ${queueBusy ? "disabled" : ""}>
                <option value="1"${mform.multi ? " selected" : ""}>3vs3</option>
                <option value="0"${mform.multi ? "" : " selected"}>1vs1</option>
              </select></span></div>
            <div class="row"><span class="dim">牌組Cost限制</span>
              <span><input id="mBandOn" type="checkbox" ${mform.bandOn ? "checked" : ""} />
                    <select id="mBand">${bandOpts}</select></span></div>
            <div class="hint">遊戲自己的欄位，<b>伺服器用原版 COST 判</b> —— 跟你選的規則算出來的數字對不上。</div>
            <div class="row"><span class="dim">約定 COST 上限</span>
              <span><input id="mLimitOn" type="checkbox" ${mform.limitOn ? "checked" : ""} ${queueBusy ? "disabled" : ""} />
                    <input id="mLimit" type="number" min="0" max="200" step="0.01" style="width:5em"
                           value="${mform.limit}" ${queueBusy ? "disabled" : ""} />
                    ${tierButtons}</span></div>
            <div class="hint">用<b>你選的規則</b>算的上限，由插件檢查 —— 遊戲伺服器不認得它。
              ⚠ 這個數字<b>進配對條件</b>：填得不一樣的人會排在不同的隊伍裡，永遠配不到。
              雙方各自檢查自己那副牌，所以誰都看不到對方的 COST。</div>
            ${tierHint}
            <div class="row"><span></span><span>
              <button id="mOpen">開房配對</button>
              <button id="mCancel">取消配對</button>
            </span></div>
            <div class="hint">⚠ 開房會<b>消耗 AP</b>，而且房間會出現在公開清單上（有密碼，別人進不來）。
              上面這兩顆是<b>手動</b>的（房號密碼自己傳給對手）；要讓插件自動找人的話用下面那張卡。</div>
          </div>`;

        // 自動配對。⚠ 這張卡**永遠不會顯示對手的任何東西** —— 跨版本驗算會
        // 交換牌組描述子，但那只拿去算指紋，不進畫面也不進記錄（見
        // docs/match-making.md 的「對手的牌組不會出現在畫面上」）。
        const compatBadge = {
          exact: '<span class="badge">同一版規則</span>',
          compatible: '<span class="badge">版本不同，這一場等價</span>',
          incompatible: '<span class="badge">不相容</span>',
        };
        const queue = !rule
          ? `<div class="hint">自動配對要先在「牌組 › Cost 表」選一份規則 —— 沒有規則就沒有「約定」可言。</div>`
          : `<div class="row"><span class="dim">狀態</span><span>${
              queueBusy
                ? "<b>" + esc(queuePhaseText(pairing)) + "</b>"
                : esc(queuePhaseText(pairing))
            }${pairing.compatibility ? " " + compatBadge[pairing.compatibility] : ""}</span></div>
             ${
               // ⚠ **「排隊中·只有你」與「根本沒連上」一定要分開講。** 兩者原本
               // 長得一模一樣，而它們要玩家做的事完全相反：一個是等，一個是去
               // 檢查中間人。2026-08-16 就是這樣讓兩台條件相同的客戶端各等各的
               // ——雲端中間人那時還沒有配對佇列的路由。
               pairing.phase === "queued" && pairing.linked === false
                 ? `<div class="row"><span class="dim">中間人</span><span class="bad"><b>還沒連上</b></span></div>
                    <div class="hint warn">⚠ 這不是在等對手 —— 是連不上配對佇列，插件還在重試。
                      看「設置 › 記錄」有沒有「連不上配對佇列」那幾行，
                      中間人的位址在「設置 › 連線」。</div>`
                 : pairing.phase === "queued"
                   ? `<div class="row"><span class="dim">排隊中</span><span>${
                       pairing.waiting > 1
                         ? `含你共 <b>${pairing.waiting}</b> 人`
                         : "只有你 —— 對手要用同樣的條件排隊才配得到"
                     }</span></div>`
                   : ""
             }
             ${
               pairing.skipped > 0
                 ? `<div class="row"><span class="dim">已跳過</span><span>${pairing.skipped} 位（規則版本算出來的東西不一樣）</span></div>`
                 : ""
             }
             <div class="hint">${esc(pairing.message ?? "")}</div>
             <div class="row"><span></span><span>
               <button id="mQueueStart" ${queueBusy ? "disabled" : ""}>開始自動配對</button>
               <button id="mQueueStop" ${queueBusy ? "" : "disabled"}>停止</button>
             </span></div>
             <div class="hint">插件會去中間人那邊排隊，配到條件一樣的人就<b>自動開房／進房</b>。
               ⚠ 配到之後會直接<b>消耗 AP</b> 並開打 —— 不想被自動拉進對戰就先按停止。
               對手用的規則是<b>同一族的哪一版都可以</b>，只要這一場算出來的 COST 完全一樣。</div>`;

        const queueCard = `<div class="card">
            <div class="row"><span class="dim">自動配對</span><span class="dim">走中間人的佇列</span></div>
            ${queue}
          </div>`;

        const handoff =
          matchHandoff === null
            ? ""
            : `<div class="card">
                 <div class="row"><span class="dim">房號</span><span><code>${esc(matchHandoff.roomId)}</code></span></div>
                 <div class="row"><span class="dim">密碼</span><span><code>${esc(matchHandoff.pass)}</code></span></div>
                 <div class="hint">把這兩個交給對手，他在下面「進房」貼上就能進來。<b>密碼不要貼在房名上</b> —— 房名是公開的。</div>
               </div>`;

        const err = matchHandoff?.error
          ? `<div class="card"><div class="hint warn">⚠ ${esc(matchHandoff.error)}</div></div>`
          : "";

        // 「有沒有人在等人」＝ B 位是空的。⚠ 這份清單最舊可能是 20 秒前的。
        const waiting = (s.rooms ?? []).filter((r) => r.playerBName === null);
        const rows = (s.rooms ?? [])
          .map(
            (r) => `<tr>
                <td>${r.pass ? "🔒" : ""}</td>
                <td>${esc(r.name)}</td>
                <td>${esc(r.playerAName ?? "—")}</td>
