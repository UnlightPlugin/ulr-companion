<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <!--
      ⚠ CSP 這裡是**必要的**，不是加好玩的。這個視窗的內容全部是我們自己寫死的，
      所以連線來源可以鎖到只剩 'self'。§12 的原則：邊界擋一次，之後都安全。

      ⚠ **外觀是純 CSS 重現的，一張遊戲圖檔都沒有。** 色票是 2026-08-07 從跑著的
      客戶端量出來的（分頁 tab_chara/library_btn_*、底 option_bg、面板 edit_bg），
      不是憑印象調的。這個選擇讓上面那行 `default-src 'none'` 成立 ——
      要是改成載入遊戲的圖，就得放寬 img-src，而且離線時整個外觀會消失。

      script-src 只准 'self'（同資料夾的 .js）：2026-10-18 從一整支 inline script 拆成檔案時
      順手拿掉了 'unsafe-inline' —— 頁面裡沒有 inline 事件處理器，都是 events.js 委派。
      style-src 還要 'unsafe-inline'：模板裡有 style="…" 屬性。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>ULR Companion</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <header>
      <span class="brand">Unlight&nbsp;Companion</span>
      <!--
        ⚠ 版本要**隨時看得見**，不能只藏在「設置 › 關於」。
        自動更新是靜默的（updater.ts）—— 玩家不會知道自己被換過版，而回報問題時
        第一個要問的就是版本。藏兩層深等於每次都要教他點去哪裡看。
      -->
      <span class="ver" id="ver"></span>
      <span class="who" id="who"></span>
    </header>

    <nav class="tabs" id="tabs"></nav>

    <main>
      <aside id="side"></aside>
      <section class="body" id="content"></section>
    </main>

    <footer>
      <span class="cell"><span class="dot" id="dot"></span><span id="fProfile">—</span></span>
      <span class="cell" id="fLink">—</span>
      <span class="cell grow" id="fLast" style="cursor: pointer">—</span>
    </footer>

    <!--
      ⚠ 載入順序就是執行順序：core.js 最先（TABS、$、esc、PAGES），boot.js 最後
      （它會呼叫 renderChrome 並訂閱快照）。這幾支是 classic script，共用同一個全域，
      頂層的 const／let／function 互相看得到 —— 但載入當下就執行的程式只能用
      前面已經載過的檔。
    -->
    <script src="core.js"></script>
    <script src="pages/battle.js"></script>
    <script src="pages/cost.js"></script>
    <script src="pages/raid.js"></script>
    <script src="pages/quest.js"></script>
    <script src="pages/mods.js"></script>
    <script src="pages/diet.js"></script>
    <script src="pages/bonus.js"></script>
    <script src="pages/deck.js"></script>
    <script src="pages/settings.js"></script>
    <script src="events.js"></script>
    <script src="boot.js"></script>
  </body>
</html>
