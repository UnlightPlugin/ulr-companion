<!doctype html>
<!--
  遊戲視窗標題列上的「重新整理」鈕。為什麼這樣做見 src/title-button-core.ts。
  底色是 helper 從標題列取來的；按下去導向 CLICK_URL，主程序在 will-navigate 攔下來。
-->
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>重新整理</title>
    <style>
      :root {
        --bg: #2b2b2b;
        --glyph: #8c8c8c;
        --hover: rgba(0, 0, 0, 0.1);
        --press: rgba(0, 0, 0, 0.2);
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        user-select: none;
        cursor: default;
      }
      a {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        color: var(--glyph);
        text-decoration: none;
        font:
          10px "Segoe MDL2 Assets",
          "Segoe Fluent Icons";
        -webkit-user-drag: none;
      }
      a:hover {
        background: var(--hover);
      }
      a:active {
        background: var(--press);
      }
      span {
        display: inline-block;
      }
      .spin span {
        animation: spin 0.6s linear;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <a href="https://ulr.invalid/title-button/reload" title="重新整理遊戲" draggable="false"
      ><span>&#xE72C;</span></a
    >
    <script>
      window.ulrLook = function (look) {
        var s = document.documentElement.style;
        s.setProperty("--bg", look.bg);
        s.setProperty("--glyph", look.glyph);
        s.setProperty("--hover", look.hover);
        s.setProperty("--press", look.press);
      };
      window.ulrSpin = function () {
        var a = document.querySelector("a");
        a.classList.remove("spin");
        void a.offsetWidth;
        a.classList.add("spin");
      };
    </script>
  </body>
</html>
